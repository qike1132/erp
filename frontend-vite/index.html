<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>滨发协同系统</title>
    <style>
      /* 内联加载指示器 — JS 未加载前立即可见，消除白屏 */
      /* Vue mount 后 #app 内部被替换，加载指示器自动消失 */
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f4f6fc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .app-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e4e7ed;
        border-top-color: #FF9500;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      .app-loading-text {
        margin-top: 16px;
        font-size: 14px;
        color: #8492a6;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-spinner { animation: none; }
      }
      .app-loading-fail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .app-loading-fail .app-fail-text {
        margin: 0;
        font-size: 14px;
        color: #991b1b;
        font-weight: 600;
      }
      .app-loading-fail button {
        padding: 8px 20px;
        border: none;
        border-radius: 8px;
        background: #2d5ab8;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      .app-loading-fail button:hover {
        background: #234996;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="app-spinner"></div>
        <div class="app-loading-text">加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 启动遮罩兜底：外置为 /app-loading-fallback.js（public/ 会被原样拷进 dist），
         SPA 入口 CSP 的 script-src 已收紧为 'self'，内联脚本会被浏览器拦掉。 -->
    <script src="/app-loading-fallback.js" defer></script>
  </body>
</html>
