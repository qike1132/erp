    <style>
        /* 全局通知系统样式 */
        .global-notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: calc(100% - 40px);
        }
        
        @media (max-width: 576px) {
            .global-notification-container {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                width: auto;
            }
        }
        
        .global-notification {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: notificationSlideIn 0.3s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .global-notification::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }
        
        .global-notification.success::before {
            background: #10b981;
        }
        
        .global-notification.error::before {
            background: #ef4444;
        }
        
        .global-notification.warning::before {
            background: #f59e0b;
        }
        
        .global-notification.info::before {
            background: #3b82f6;
        }
        
        .global-notification.closing {
            animation: notificationSlideOut 0.3s ease-in forwards;
        }
        
        @keyframes notificationSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes notificationSlideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        .notification-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
        }
        
        .global-notification.success .notification-icon {
            background: #d1fae5;
            color: #059669;
        }
        
        .global-notification.error .notification-icon {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .global-notification.warning .notification-icon {
            background: #fef3c7;
            color: #d97706;
        }
        
        .global-notification.info .notification-icon {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .notification-content {
            flex: 1;
            min-width: 0;
        }
        
        .notification-title {
            font-weight: 600;
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 4px;
        }
        
        .notification-message {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .notification-close {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: none;
            background: none;
            cursor: pointer;
            color: #9ca3af;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .notification-close:hover {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .notification-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #e5e7eb;
            overflow: hidden;
        }
        
        .notification-progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 100%;
            animation: progressShrink 2s linear forwards;
        }
        
        .global-notification.success .notification-progress-bar {
            background: #10b981;
        }
        
        .global-notification.error .notification-progress-bar {
            background: #ef4444;
        }
        
        .global-notification.warning .notification-progress-bar {
            background: #f59e0b;
        }
        
        @keyframes progressShrink {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }
    </style>

    <script>
    // 全局通知系统
    const GlobalNotification = {
        container: null,
        notificationId: 0,
        defaultDuration: 2000,
        
        icons: {
            success: 'fa-check',
            error: 'fa-times',
            warning: 'fa-exclamation',
            info: 'fa-info'
        },
        
        titles: {
            success: '成功',
            error: '错误',
            warning: '警告',
            info: '提示'
        },
        
        init: function() {
            this.container = document.getElementById('globalNotificationContainer');
            if (!this.container) {
                this.container = document.createElement('div');
                this.container.id = 'globalNotificationContainer';
                this.container.className = 'global-notification-container';
                document.body.appendChild(this.container);
            }
        },
        
        show: function(type, message, title, duration) {
            if (!this.container) {
                this.init();
            }
            
            const id = ++this.notificationId;
            const notificationDuration = duration || this.defaultDuration;
            const notificationTitle = title || this.titles[type] || '提示';
            
            const notification = document.createElement('div');
            notification.className = `global-notification ${type}`;
            notification.id = `notification-${id}`;
            
            notification.innerHTML = `
                <div class="notification-icon">
                    <i class="fas ${this.icons[type]}"></i>
                </div>
                <div class="notification-content">
                    <div class="notification-title">${this.escapeHtml(notificationTitle)}</div>
                    <div class="notification-message">${this.escapeHtml(message)}</div>
                </div>
                <button class="notification-close" onclick="GlobalNotification.close(${id})">
                    <i class="fas fa-times"></i>
                </button>
                <div class="notification-progress">
                    <div class="notification-progress-bar"></div>
                </div>
            `;
            
            this.container.appendChild(notification);
            
            const timeoutId = setTimeout(() => {
                this.close(id);
            }, notificationDuration);
            
            notification.dataset.timeoutId = timeoutId;
            
            return id;
        },
        
        close: function(id) {
            const notification = document.getElementById(`notification-${id}`);
            if (!notification) return;
            
            const timeoutId = notification.dataset.timeoutId;
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            
            notification.classList.add('closing');
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        },
        
        success: function(message, title, duration) {
            return this.show('success', message, title, duration);
        },
        
        error: function(message, title, duration) {
            return this.show('error', message, title, duration);
        },
        
        warning: function(message, title, duration) {
            return this.show('warning', message, title, duration);
        },
        
        info: function(message, title, duration) {
            return this.show('info', message, title, duration);
        },
        
        escapeHtml: function(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    };
    
    // 初始化全局通知系统
    document.addEventListener('DOMContentLoaded', function() {
        GlobalNotification.init();
        
        // 将Flash消息转换为全局通知
        const flashMessages = document.querySelectorAll('.flash-message');
        flashMessages.forEach(flashMsg => {
            const category = flashMsg.dataset.category;
            const message = flashMsg.dataset.message;
            
            // 映射flash类别到通知类型
            const typeMapping = {
                'success': 'success',
                'error': 'error',
                'warning': 'warning',
                'info': 'info',
                'danger': 'error'
            };
            
            const type = typeMapping[category] || 'info';
            
            // 根据消息内容生成合适的标题
            let title = '提示';
            if (message.includes('登录成功') || message.includes('登录成功')) {
                title = '登录成功';
            } else if (message.includes('退出登录') || message.includes('已退出')) {
                title = '退出登录';
            } else if (message.includes('成功')) {
                title = '操作成功';
            } else if (message.includes('错误') || message.includes('失败')) {
                title = '错误提示';
            } else if (message.includes('警告') || message.includes('注意')) {
                title = '警告';
            }
            
            // 延迟显示，确保DOM完全加载
            setTimeout(() => {
                GlobalNotification.show(type, message, title);
            }, 100);
        });
    });
    </script>
    
<script>
// 产品名称自动补全功能
function searchProducts(query) {
    if (!query) {
        document.getElementById('product_list').innerHTML = '';
        return;
    }
    fetch(`/api/product-search?q=${encodeURIComponent(query)}`)
        .then(response => {
            if (!response.ok) {
                console.error('API error:', response.status, response.statusText);
                return [];
            }
            return response.json();
        })
        .then(data => {
            const datalist = document.getElementById('product_list');
            datalist.innerHTML = '';
            data.forEach(product => {
                const option = document.createElement('option');
                option.value = product.name;
                option.setAttribute('data-id', product.id);
                option.setAttribute('data-barcode', product.barcode);
                option.setAttribute('data-stock', product.current_stock);
                datalist.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Search products error:', error);
        });
}

// 处理产品选择
function handleProductSelection() {
    const searchInput = document.getElementById('product');
    const datalist = document.getElementById('product_list');
    const selectedOption = Array.from(datalist.options).find(opt => opt.value === searchInput.value);
    
    if (selectedOption) {
        console.log('Selected product:', selectedOption.value);
        
        // 产品被选中，立即清空列表并触发关闭动画
        datalist.innerHTML = '';
    }
}

// 绑定事件监听器
document.addEventListener('DOMContentLoaded', function() {
    const productInput = document.getElementById('product');
    
    // 输入事件 - 实时搜索
    productInput.addEventListener('input', function(e) {
        searchProducts(e.target.value);
    });
    
    // 变化事件 - 处理选择
    productInput.addEventListener('change', function(e) {
        handleProductSelection();
    });
    
    // 失焦事件 - 清理datalist
    productInput.addEventListener('blur', function(e) {
        setTimeout(() => {
            const datalist = document.getElementById('product_list');
            datalist.innerHTML = '';
        }, 200);
    });
});

// 添加 CSS 样式优化自动补全 UI
const style = document.createElement('style');
style.textContent = `
    /* 优化 datalist 下拉菜单样式 */
    input[list] {
        position: relative;
        z-index: 1;
    }
    
    /* 自定义下拉菜单样式 */

        background: white;
        border: 1px solid #ced4da;
        border-radius: 0 0 0.375rem 0.375rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        margin-top: -1px;
        animation: fadeIn 0.2s ease-in-out;
    }
    
    .autocomplete-item {
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .autocomplete-item:hover {
        background-color: #f8f9fa;
        transform: translateX(5px);
    }
    
    .autocomplete-item.selected {
        background-color: #e9ecef;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes fadeOut {
        from {
            opacity: 1;
            transform: translateY(0);
        }
        to {
            opacity: 0;
            transform: translateY(-10px);
        }
    }
`;
document.head.appendChild(style);
</script>
