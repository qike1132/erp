[pytest]
# 测试路径配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# 标记配置
markers =
    unit: 单元测试
    integration: 集成测试
    functional: 功能测试
    boundary: 边界条件测试
    slow: 慢速测试
    api: API测试
    model: 模型测试
    db: 数据库测试

# 最小Python版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告配置
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
