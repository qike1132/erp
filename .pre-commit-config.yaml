repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 统一代码质量门禁（基线棘轮）：存量违规不阻断，新增即拦截。
  # 实现见 scripts/quality_gate.py，阈值见 pyproject.toml [tool.code-quality]。
  # 紧急情况可用 `git commit --no-verify` 绕过，但绕过不应成为常态。
  - repo: local
    hooks:
      - id: quality-gate
        name: 代码质量门禁（新增违规即阻断）
        entry: python scripts/quality_gate.py
        language: system
        pass_filenames: false
        always_run: true
