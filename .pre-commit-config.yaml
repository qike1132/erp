repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 统一代码质量门禁（基线棘轮）：存量违规不阻断，新增即拦截。
  # 实现见 scripts/quality_gate.py，阈值见 pyproject.toml [tool.code-quality]。
  # 紧急情况可用 `git commit --no-verify` 绕过，但绕过不应成为常态。
  - repo: local
    hooks:
      - id: quality-gate
        name: 代码质量门禁（新增违规即阻断）
        entry: python scripts/quality_gate.py
        language: system
        pass_filenames: false
        always_run: true

      # 分层门禁（server_manager_v8 重构，零容忍）。
      # 正向：domain/ 禁止 I/O，保证领域层可 100% 单测 —— 见重构方案风险 R2。
      # 反向：adapters/ 禁止复刻领域判定（状态字面量 / sc 返回码 / 非法跨层 import）
      #       —— v5.36 与 v5.39 两次互杀事故的成因就是规则散落在调用点。
      # 应用层：★★ 禁止 import adapters（依赖倒置）。这一条最关键 ——
      #       一旦 L3 直接依赖 L1，用例就无法被 Fake 替换，
      #       整个「用 Protocol 换可测性」的设计就失效了。
      # 仅在重构进行期间有意义；server_manager_v8/ 不存在时自动跳过。
      - id: domain-purity
        name: 分层门禁（domain 零 I/O + adapters 零判定复刻 + 应用层依赖倒置）
        entry: python scripts/check_domain_purity.py
        language: system
        pass_filenames: false
        always_run: true
