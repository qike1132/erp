# ============================================================
# Pre-commit hooks — BinFa ERP
# ============================================================
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: '(tsconfig\.json|package-lock\.json)'
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'bandit.yaml']
        exclude: 'tests/'

  - repo: local
    hooks:
      - id: mypy-targeted
        name: mypy-targeted
        entry: python -m mypy --config-file mypy.ini
        language: system
        pass_filenames: false
        files: ^fastapi_app/core/security\.py$
