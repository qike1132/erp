# ============================================
# Redis for Windows - ARQ 任务队列专用实例
# ============================================
# 与缓存实例(config/redis.production.conf, 端口 6379)独立运行，
# 避免缓存 Eviction 驱逐排队任务导致连锁故障。
# 队列数据无需持久化（任务失败由 ARQ 重试），故关闭 AOF，仅保留 RDB 兜底。

# --------------------------------------------
# 网络配置
# --------------------------------------------
bind 127.0.0.1

# 监听端口（独立于缓存实例 6379）
port 6380

# 保护模式
protected-mode yes

# TCP连接配置
tcp-keepalive 300
tcp-backlog 511
timeout 0

# --------------------------------------------
# 通用配置
# --------------------------------------------
loglevel notice

# 日志文件（独立命名，与缓存实例区分）
logfile "redis-broker.log"

# 减少数据库数量（队列仅需少量逻辑库）
databases 16

# --------------------------------------------
# 持久化 - 队列实例仅保留 RDB 兜底，不启用 AOF
# --------------------------------------------
save 900 1
save 300 10
save 60 10000

dbfilename dump-broker.rdb

# 数据目录（独立命名，避免与缓存实例冲突）
dir ./

rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# 关闭 AOF（队列数据非关键，任务可重试）
appendonly no

# --------------------------------------------
# 内存管理
# --------------------------------------------
# 队列实例内存上限（较缓存实例小，任务数据量有限）
maxmemory 256mb

# 队列实例使用 noeviction：任务数据不允许被淘汰，
# 宁可拒绝新任务也不丢已有队列任务
maxmemory-policy noeviction

# 内存淘汰样本数量
maxmemory-samples 5

# --------------------------------------------
# 安全配置
# --------------------------------------------
# 访问密码：由 NSSM 服务通过 --requirepass 注入，与缓存实例一致
# requirepass <由 REDIS_PASSWORD 环境变量注入>

# --------------------------------------------
# 客户端配置
# --------------------------------------------
maxclients 10000
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --------------------------------------------
# 慢查询日志
# --------------------------------------------
slowlog-max-len 128
slowlog-log-slower-than 10000

# --------------------------------------------
# 数据结构优化
# --------------------------------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
lua-time-limit 5000