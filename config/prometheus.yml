global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'erp-system'
    env: 'production'

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # FastAPI 应用指标（主指标源）
  - job_name: 'fastapi'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:5002']
        labels:
          service: 'fastapi'

  # Nginx 指标（需 nginx-prometheus-exporter，暂用stub状态监控）
  - job_name: 'nginx'
    metrics_path: /nginx-health
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'

  # PostgreSQL 指标
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Redis 指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Celery 任务指标
  - job_name: 'celery'
    metrics_path: /metrics
    static_configs:
      - targets: ['celery-exporter:9808']
        labels:
          service: 'celery'

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OTel Collector 指标
  - job_name: 'otel-collector'
    scrape_interval: 30s
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
