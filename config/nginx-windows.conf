# ============================================================
# ERP Nginx for Windows 生产配置
# 由 NSSM 服务 erp-web 以如下方式启动:
#   nginx -p <项目根> -c config/nginx-windows.conf -e logs/nginx-error.log
# include 使用绝对路径，避免 prefix 相对路径解析歧义。
# 监听 3000：前端静态资源 + 反代 /api、/ws、/static 至本地 Uvicorn(5002)。
# ============================================================

# 6 物理核机器上的静态资源服务,2 worker 足够(auto=12 进程对 6 核过订阅)
worker_processes 2;

events {
    worker_connections 1024;
}

http {

    # 加载 MIME 类型映射；缺失会导致静态资源以 text/plain 返回，
    # 浏览器因 MIME 校验会拒绝执行 <script type="module">，前端无法挂载。
    include C:/nginx/conf/mime.types;

    # ============ 限流（OPT-18，2026-10-01） ============
    # 网关层第二道闸（应用层已有 slowapi 限流）。
    # 全站泛率 60r/m + burst 40：正常快速浏览（实测 14r/min）远达不到；
    # 登录路径 10r/m + burst 20：双层防爆破的网关侧兜底。
    # /metrics 有本机白名单不受影响；/ws 长连接不套限流。
    # dry_run 模式：只记日志不拒绝，观察 3-7 天无正常用户误伤后改为 reject。
    limit_req_zone $binary_remote_addr zone=perip:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=authzone:10m rate=10r/m;
    limit_req_log_level warn;
    limit_req_status 429;

    # 后端上游（本机 Uvicorn 多 worker）
    # 注意：官方 Windows 版 nginx 不含 ngx_http_upstream_keepalive_module，禁用 upstream keepalive，
    # 否则反代请求会返回 400 Bad Request。每个请求新建到后端的连接。
    upstream fastapi_backend {
        server 127.0.0.1:5002;
    }

    # ==================== 日志格式 ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" request_time=$request_time '
                   'upstream_response_time=$upstream_response_time';

    # ==================== 主应用服务器 ====================
    # HTTPS 443（OPT-17，2026-10-01）：自签内网证书（config/tls/），与 3000 并行监听；
    # 客户端导入 config/tls/ca.crt 到受信任根后即可走 https://192.168.0.95。
    # 3000 过渡期保留：443 稳定运行后再另行决定是否关闭或 301 跳转。
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     D:/erp_system/config/tls/server.crt;
        ssl_certificate_key D:/erp_system/config/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        access_log logs/nginx-access-ssl.log main;
        error_log logs/nginx-error-ssl.log warn;

        include D:/erp_system/config/security-headers.conf;

        # 前端静态资源根目录（所有 location 块继承此 root）
        root frontend-vite/dist;

        # 客户端请求体大小限制：普通 API 的默认上限（与后端全局上限一致，
        # 见 fastapi_app/core/middleware.py::MAX_REQUEST_BODY_SIZE）。
        # 备份还原/Excel 导入走下方各自的 location 放宽，不在此处放大。
        client_max_body_size 10m;

        # 隐藏 Nginx 版本号
        server_tokens off;

        # 代理通用设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理缓冲区配置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # --- 限流（与 3000 同一套 zone，dry_run 观察期） ---
        limit_req zone=perip burst=40 nodelay;
        limit_req_dry_run on;

        # --- 静态资源压缩 ---
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        # --- Vue 构建产物（带 hash 静态资源，长期缓存） ---
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- 上传文件由 Nginx 直接本地托管（文件缺失时 404 亚毫秒返回，不占用 FastAPI worker） ---
        # OPT-19 签名 URL 启用步骤（当前为兼容期：未签名 URL 照常放行）：
        #   1. .env 注入 UPLOAD_URL_SIGNING_SECRET=<openssl rand -hex 32 生成>
        #      （后端 services/signed_urls.py 检测到密钥即开始签发限时 URL）
        #   2. 在下方 location 中取消 secure_link 三行注释（替换为真实密钥）并 reload
        #   3. 观察错误日志无 403 后，兼容期结束——存量无签名 URL 将随 7 天
        #      expires 自然失效，此后全部走限时签名
        # secure_link_md5 的哈希输入 "$secure_link_expires$uri <密钥>" 与
        # signed_urls.sign_upload_url 的公式严格对齐（有对齐单测）。
        location /static/uploads/ {
            alias D:/erp_system/static/uploads/;
            try_files $uri =404;
            secure_link $arg_s,$arg_st;
            secure_link_md5 "$arg_st$uri 0829c6a6b01cafc47788ccc04297dd382838bdfc1f77e5ef1a58b1e5d6e32589";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }   # 签名对但已过期
            expires 7d;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- 上传/导出文件（由 FastAPI 托管，反代至后端） ---
        location /static/ {
            proxy_pass http://fastapi_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- WebSocket 实时通知 ---
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- 统一健康检查 ---
        location = /api/health {
            access_log off;
            proxy_pass http://fastapi_backend;
        }

        # --- Prometheus 指标（仅本机可抓取）---
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            proxy_pass http://fastapi_backend;
        }

        # --- 大文件上传：备份还原（业务上限 500MB）与 Excel 导入（50MB）---
        location /api/v1/backup/ {
            client_max_body_size 512m;   # >= services/backup/_constants.py::MAX_BACKUP_FILE_SIZE(500MB)
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 600s;
        }

        location /api/v1/tasks/import- {
            client_max_body_size 64m;    # >= endpoints/tasks.py::MAX_IMPORT_FILE_SIZE(50MB)
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 300s;
        }

        # --- 登录/认证路径：收紧限流（防爆破网关侧兜底，dry_run 观察期） ---
        location = /api/v1/auth/login {
            limit_req zone=authzone burst=20 nodelay;
            limit_req_dry_run on;
            proxy_pass http://fastapi_backend;
        }

        # --- FastAPI API 代理 ---
        location /api/ {
            # 注意：Windows 官方 nginx 无 upstream keepalive 模块，且 HTTP/1.1 + 空 Connection 头
            # 会导致反代返回 400。让 nginx 用默认 HTTP/1.0 反代（每次新建连接），即可正常转发。
            limit_req zone=perip burst=40 nodelay;
            limit_req_dry_run on;
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 120s;
        }

        # --- Vue SPA 页面路由（所有前端页面回退到 index.html） ---
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- Nginx 自身健康检查（prod_runner 探测用） ---
        location /nginx-health {
            access_log off;
            include D:/erp_system/config/security-headers.conf;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # --- 禁止访问隐藏文件 ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==================== 过渡期 HTTP 3000（与 443 同构） ====================
    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;
        server_name _;

        access_log logs/nginx-access.log main;
        error_log logs/nginx-error.log warn;

        include D:/erp_system/config/security-headers.conf;

        # 前端静态资源根目录（所有 location 块继承此 root）
        root frontend-vite/dist;

        # 客户端请求体大小限制：普通 API 的默认上限（与后端全局上限一致，
        # 见 fastapi_app/core/middleware.py::MAX_REQUEST_BODY_SIZE）。
        # 备份还原/Excel 导入走下方各自的 location 放宽，不在此处放大。
        client_max_body_size 10m;

        # 隐藏 Nginx 版本号
        server_tokens off;

        # 代理通用设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理缓冲区配置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # --- 静态资源压缩 ---
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        # --- Vue 构建产物（带 hash 静态资源，长期缓存） ---
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- 上传文件由 Nginx 直接本地托管（文件缺失时 404 亚毫秒返回，不占用 FastAPI worker） ---
        # OPT-19 签名 URL 启用步骤（当前为兼容期：未签名 URL 照常放行）：
        #   1. .env 注入 UPLOAD_URL_SIGNING_SECRET=<openssl rand -hex 32 生成>
        #      （后端 services/signed_urls.py 检测到密钥即开始签发限时 URL）
        #   2. 在下方 location 中取消 secure_link 三行注释（替换为真实密钥）并 reload
        #   3. 观察错误日志无 403 后，兼容期结束——存量无签名 URL 将随 7 天
        #      expires 自然失效，此后全部走限时签名
        # secure_link_md5 的哈希输入 "$secure_link_expires$uri <密钥>" 与
        # signed_urls.sign_upload_url 的公式严格对齐（有对齐单测）。
        location /static/uploads/ {
            alias D:/erp_system/static/uploads/;
            try_files $uri =404;
            secure_link $arg_s,$arg_st;
            secure_link_md5 "$arg_st$uri 0829c6a6b01cafc47788ccc04297dd382838bdfc1f77e5ef1a58b1e5d6e32589";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }   # 签名对但已过期
            expires 7d;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- 上传/导出文件（由 FastAPI 托管，反代至后端） ---
        location /static/ {
            proxy_pass http://fastapi_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- WebSocket 实时通知 ---
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- FastAPI 文档（生产已关闭，兼容性保留） ---
        location /api/docs { proxy_pass http://fastapi_backend; }
        location /api/redoc { proxy_pass http://fastapi_backend; }
        location /api/openapi.json { proxy_pass http://fastapi_backend; }

        # --- 统一健康检查 ---
        location /api/health {
            access_log off;
            proxy_pass http://fastapi_backend;
        }

        # --- Prometheus 指标（仅本机可抓取）---
        # 后端 /metrics 在生产还要求 METRICS_BEARER_TOKEN（core/health.py:206-213），
        # 这里是第一层边界：非本机来源直接 403，连 token 校验都不进。
        # 用精确匹配 = ，避免 /metrics 被 location / 的 SPA 回退吞掉返回 index.html。
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            proxy_pass http://fastapi_backend;
        }

        # --- 登录/认证路径：收紧限流（防爆破网关侧兜底，dry_run 观察期） ---
        location = /api/v1/auth/login {
            limit_req zone=authzone burst=20 nodelay;
            limit_req_dry_run on;
            proxy_pass http://fastapi_backend;
        }

        # --- 全站 API 泛率（dry_run 观察期；/metrics 白名单优先级更高不受影响） ---
        location /api/ {
            # 注意：Windows 官方 nginx 无 upstream keepalive 模块，且 HTTP/1.1 + 空 Connection 头
            # 会导致反代返回 400。让 nginx 用默认 HTTP/1.0 反代（每次新建连接），即可正常转发。
            limit_req zone=perip burst=40 nodelay;
            limit_req_dry_run on;
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 120s;
        }

        # --- 大文件上传：备份还原（业务上限 500MB）与 Excel 导入（50MB）---
        # 两层必须同步放宽，否则边缘先 413、后端解不解除都一样：
        #   nginx 这里  <->  fastapi_app/core/middleware.py::max_body_size_for_path
        # 只放大这两个 location；默认仍是 server 级 10m（普通 API 不受影响）。
        location /api/v1/backup/ {
            client_max_body_size 512m;   # >= services/backup/_constants.py::MAX_BACKUP_FILE_SIZE(500MB)
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 600s;     # 同步还原整库可能远超 120s
        }

        location /api/v1/tasks/import- {
            client_max_body_size 64m;    # >= endpoints/tasks.py::MAX_IMPORT_FILE_SIZE(50MB)
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 300s;
        }

        # --- Vue SPA 页面路由（所有前端页面回退到 index.html） ---
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- Nginx 自身健康检查（prod_runner 探测用） ---
        location /nginx-health {
            access_log off;
            include D:/erp_system/config/security-headers.conf;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # --- 禁止访问隐藏文件 ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}