# ============================================================
# ERP Nginx for Windows 生产配置
# 由 fastapi_app/core/prod_runner.py 以如下方式启动:
#   nginx -p <项目根> -c config/nginx-windows.conf -e logs/nginx-error.log
# include 使用绝对路径，避免 prefix 相对路径解析歧义。
# 监听 3000：前端静态资源 + 反代 /api、/ws、/static 至本地 Uvicorn(5002)。
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # 加载 MIME 类型映射；缺失会导致静态资源以 text/plain 返回，
    # 浏览器因 MIME 校验会拒绝执行 <script type="module">，前端无法挂载。
    include C:/nginx/conf/mime.types;

    # 后端上游（本机 Uvicorn 多 worker）
    # 注意：官方 Windows 版 nginx 不含 ngx_http_upstream_keepalive_module，禁用 upstream keepalive，
    # 否则反代请求会返回 400 Bad Request。每个请求新建到后端的连接。
    upstream fastapi_backend {
        server 127.0.0.1:5002;
    }

    # ==================== 日志格式 ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" request_time=$request_time '
                   'upstream_response_time=$upstream_response_time';

    # ==================== 主应用服务器 (HTTP 3000) ====================
    server {
        listen 3000 default_server;
        server_name _;

        access_log logs/nginx-access.log main;
        error_log logs/nginx-error.log warn;

        include D:/erp_system/config/security-headers.conf;

        # 客户端请求体大小限制 (支持 APK 上传，最大 100MB)
        client_max_body_size 100m;

        # 隐藏 Nginx 版本号
        server_tokens off;

        # 代理通用设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理缓冲区配置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # --- 静态资源压缩 ---
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        # --- Vue 构建产物（带 hash 静态资源，长期缓存） ---
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- 上传/导出文件（由 FastAPI 托管，反代至后端） ---
        location /static/ {
            proxy_pass http://fastapi_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- WebSocket 实时通知 ---
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- FastAPI 文档（生产已关闭，兼容性保留） ---
        location /api/docs { proxy_pass http://fastapi_backend; }
        location /api/redoc { proxy_pass http://fastapi_backend; }
        location /api/openapi.json { proxy_pass http://fastapi_backend; }

        # --- 统一健康检查 ---
        location /api/health {
            access_log off;
            proxy_pass http://fastapi_backend;
        }

        # --- FastAPI API 代理 ---
        location /api/ {
            # 注意：Windows 官方 nginx 无 upstream keepalive 模块，且 HTTP/1.1 + 空 Connection 头
            # 会导致反代返回 400。让 nginx 用默认 HTTP/1.0 反代（每次新建连接），即可正常转发。
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 120s;
        }

        # --- Vue SPA 页面路由（所有前端页面回退到 index.html） ---
        root frontend-vite/dist;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include D:/erp_system/config/security-headers.conf;
        }

        # --- Nginx 自身健康检查（prod_runner 探测用） ---
        location /nginx-health {
            access_log off;
            include D:/erp_system/config/security-headers.conf;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # --- 禁止访问隐藏文件 ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}