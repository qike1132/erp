# ============================================================
# ERP Nginx for Windows 生产配置
# 由 fastapi_app/core/prod_runner.py 以如下方式启动:
#   nginx -p <项目根> -c config/nginx-windows.conf -e logs/nginx-error.log
# 因此本文件内的相对路径均相对项目根目录解析（prefix）。
# 监听 3000：前端静态资源 + 反代 /api、/ws、/static 至本地 Uvicorn(5002)。
# ============================================================

# 后端上游（本机 Uvicorn 多 worker）
upstream fastapi_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

# ==================== 日志格式 ====================
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" request_time=$request_time '
               'upstream_response_time=$upstream_response_time';

# ==================== 主应用服务器 (HTTP 3000) ====================
server {
    listen 3000 default_server;
    server_name _;

    access_log logs/nginx-access.log main;
    error_log logs/nginx-error.log warn;

    include config/security-headers.conf;

    # 客户端请求体大小限制 (支持 APK 上传，最大 100MB)
    client_max_body_size 100m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 代理通用设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 代理缓冲区配置
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- 静态资源压缩 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Vue 构建产物（带 hash 静态资源，长期缓存） ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include config/security-headers.conf;
    }

    # --- 上传/导出文件（由 FastAPI 托管，反代至后端） ---
    location /static/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, immutable";
        include config/security-headers.conf;
    }

    # --- WebSocket 实时通知 ---
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- FastAPI 文档（生产已关闭，兼容性保留） ---
    location /api/docs { proxy_pass http://fastapi_backend; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location /api/redoc { proxy_pass http://fastapi_backend; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location /api/openapi.json { proxy_pass http://fastapi_backend; proxy_http_version 1.1; proxy_set_header Connection ""; }

    # --- 统一健康检查 ---
    location /api/health {
        access_log off;
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- FastAPI API 代理 ---
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # --- Vue SPA 页面路由（所有前端页面回退到 index.html） ---
    root frontend-vite/dist;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include config/security-headers.conf;
    }

    # --- Nginx 自身健康检查（prod_runner 探测用） ---
    location /nginx-health {
        access_log off;
        include config/security-headers.conf;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # --- 禁止访问隐藏文件 ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
