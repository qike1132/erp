# Alertmanager 配置
# 接收 Prometheus 告警并路由到通知渠道
# 生产环境须配置真实的通知接收器（邮件/Webhook/钉钉等）

global:
  resolve_timeout: 5m
  # SMTP 配置（从环境变量注入更佳，此处为模板）
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@erp-system.local'

# 告警分组与抑制规则
route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # 严重告警立即发送
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h
    # 警告级别按常规频率发送
    - match:
        severity: warning
      receiver: 'default'

receivers:
  - name: 'default'
    # 生产环境配置真实通知渠道，示例：
    # email_configs:
    #   - to: 'ops-team@example.com'
    # webhook_configs:
    #   - url: 'http://dingtalk-webhook:8060/dingtalk/ops/send'
    webhook_configs:
      - url: 'http://app:5002/api/v1/monitoring/alerts'
        send_resolved: true

  - name: 'critical'
    # 严重告警发送到多个渠道
    webhook_configs:
      - url: 'http://app:5002/api/v1/monitoring/alerts'
        send_resolved: true

# 抑制规则：当高级别告警触发时，抑制同源的低级别告警
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'cluster']
