;; PgBouncer 连接池代理配置
;; 部署于应用与 PostgreSQL 之间，复用数据库连接，减少连接开销
;; 文档: https://www.pgbouncer.org/config.html

[databases]
;; 主库连接（应用通过 PgBouncer 6432 端口连接，PgBouncer 转发到 PostgreSQL 5432）
erp_system = host=127.0.0.1 port=5432 dbname=erp_system

;; 只读副本连接（端口 6433，转發到副本 5433）
;; 启用读写分离后取消注释
; erp_system_readonly = host=127.0.0.1 port=5433 dbname=erp_system

[pgbouncer]
;; 监听地址与端口
listen_addr = 0.0.0.0
listen_port = 6432

;; 只读副本监听端口（启用读写分离后取消注释）
; listen_port_replica = 6433

;; 管理端口（用于 SHOW STATS 等诊断命令）
admin_users = erp_admin
stats_users = erp_monitor

;; 连接池模式
;; transaction: 事务结束后连接归还池，适合 Web 应用（推荐）
;; session: 会话结束后归还，适合需要 SET/prepare 的场景
;; statement: 每条SQL后归还，最激进，不支持事务
pool_mode = transaction

;; 连接池大小
;; 每个数据库-用户对的最大空闲连接数
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; 服务端连接生命周期
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_check_query = select 1
server_check_delay = 30

;; 客户端连接
client_idle_timeout = 0
client_login_timeout = 15
query_timeout = 30
query_wait_timeout = 60

;; 日志
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;; 认证方式
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; PID 文件
pidfile = /var/run/pgbouncer/pgbouncer.pid
