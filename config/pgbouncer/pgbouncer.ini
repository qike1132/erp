;; PgBouncer 连接池配置 - ERP System
;; 部署于应用与 PostgreSQL 之间，减少 PG 连接数
;; 文档: https://www.pgbouncer.org/config.html

[databases]
;; 主库连接（应用通过 PgBouncer 6432 端口连接，PgBouncer 转发到 PostgreSQL 5432）
erp_system = host=127.0.0.1 port=5432 dbname=erp_system

;; 只读副本连接（端口 6433，转發到副本 5433）
;; 启用读写分离后取消注释
; erp_system_readonly = host=127.0.0.1 port=5433 dbname=erp_system

[pgbouncer]
;; 监听地址与端口
listen_addr = 0.0.0.0
listen_port = 6432

;; 只读副本监听端口（启用读写分离后取消注释）
; listen_port_replica = 6433

;; 管理用户（用于 SHOW STATS 等诊断命令）
admin_users = erp_admin
stats_users = erp_monitor

;; 认证方式（scram-sha-256 比 md5 更安全，PostgreSQL 14+ 推荐）
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; 连接池模式
;; transaction: 事务结束后连接归还池，适合 FastAPI 短事务（推荐）
;; session: 会话结束后归还，适合需要 SET/prepare 的场景
;; statement: 每条SQL后归还，最激进，不支持事务
pool_mode = transaction

;; 连接数配置
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; 服务端连接生命周期
server_lifetime = 3600
server_idle_timeout = 300
server_connect_timeout = 15
server_check_query = select 1
server_check_delay = 30

;; 客户端连接
client_idle_timeout = 0
client_login_timeout = 15
query_timeout = 30
query_wait_timeout = 30

;; 日志
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; 性能
;; 事务模式下归还连接前执行 DISCARD ALL，清除会话级状态（如 SET 变量）
server_reset_query = DISCARD ALL
;; 忽略 PostgreSQL 启动参数，避免 PgBouncer 拒绝连接
ignore_startup_parameters = extra_float_digits

;; PID 文件
pidfile = /var/run/pgbouncer/pgbouncer.pid
