# ==================== WebSocket 升级映射 ====================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upstream fastapi_backend: FastAPI 后端（Docker/K8s容器服务名）
upstream fastapi_backend {
    server app:5002;
    keepalive 32;
}

# ==================== 日志格式 ====================

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" request_time=$request_time '
               'upstream_response_time=$upstream_response_time';

# ==================== 主应用服务器 (HTTP 3000) ====================

server {
    listen 3000 default_server;
    server_name _;

    # 访问日志
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 安全头
    include /etc/nginx/conf.d/security-headers.conf;

    # 客户端请求体大小限制 (支持 APK 上传，最大 100MB)
    client_max_body_size 100m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 代理通用设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 代理缓冲区配置
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- 静态文件由 Nginx 直接服务 ---
    location /static/ {
        alias /app/static/;
        expires 7d;

        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable";

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- Vite 构建产物（带 hash 的静态资源，长期缓存） ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- Brotli + Gzip 压缩 ---
    # 优先响应支持 Brotli 的客户端，回退到 Gzip；静态文本体积再降 15-20%
    # 注意：Nginx 容器镜像必须包含 ngx_brotli 模块（如 fholzer/nginx-brotli）
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Vue SPA 静态资源（PC + 移动端自适应，单一构建产物） ---
    root /app/frontend-vite/dist;

    # --- WebSocket 实时通知 ---
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- FastAPI 文档 ---
    location /api/docs {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/redoc {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 统一健康检查
    location /api/health {
        access_log off;
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Prometheus 指标端点（仅内网可访问）
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Grafana 监控面板
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Prometheus 控制台（仅内网可访问）
    location /prometheus/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- FastAPI API 代理 ---
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # --- Vue SPA 页面路由（所有前端页面回退到 index.html） ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- Nginx 自身健康检查 ---
    location /nginx-health {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # --- 禁止访问隐藏文件 ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
