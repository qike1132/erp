# ==========================================
# 滨发协同系统 - Nginx 高可用配置
# 版本: v1.0
# 功能: 负载均衡、反向代理、静态资源缓存
# ==========================================

# 上游应用服务器（3 实例）
upstream fastapi_backend {
    least_conn;  # 最少连接负载均衡
    
    server app1:5002 weight=3 max_fails=3 fail_timeout=30s;
    server app2:5002 weight=3 max_fails=3 fail_timeout=30s;
    server app3:5002 weight=3 max_fails=3 fail_timeout=30s;
    
    keepalive 32;  # 长连接池
}

upstream flask_backend {
    server app1:5003 weight=3 max_fails=3 fail_timeout=30s;
    server app2:5003 weight=3 max_fails=3 fail_timeout=30s;
    server app3:5003 weight=3 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

# HTTP 服务器（重定向到 HTTPS）
server {
    listen 80;
    server_name erp.example.com;
    
    # 健康检查端点（负载均衡器使用）
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ACME 证书验证（Let's Encrypt）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name erp.example.com;
    
    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/erp.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/erp.example.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 静态资源缓存（Next.js 构建产物）
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 静态文件
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # API 请求 -> FastAPI
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # WebSocket -> FastAPI
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    
    # 页面请求 -> Flask（遗留）或 Next.js
    location / {
        # 优先尝试 Next.js 静态文件
        try_files $uri $uri/ @nextjs;
    }
    
    # Next.js 服务端渲染
    location @nextjs {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# 监控端点（限制 IP 访问）
server {
    listen 8080;
    server_name localhost;
    
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;
    
    location /nginx-status {
        stub_status on;
        access_log off;
    }
}
