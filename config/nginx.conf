upstream flask_backend {
    server erp-app:5003;
}

upstream fastapi_backend {
    server erp-app:5002;
}

# ==================== 日志格式 ====================

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" request_time=$request_time '
               'upstream_response_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    # 访问日志（JSON格式便于日志收集）
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # 客户端请求体大小限制（与 Flask MAX_CONTENT_LENGTH=16MB 对齐）
    client_max_body_size 16m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 代理通用设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 代理缓冲区配置
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- 静态文件由 Nginx 直接服务（减少应用服务器负载） ---
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- FastAPI 路由（直接代理，绕过 Flask 中间代理层） ---
    # FastAPI v1 API
    location /api/v1/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # FastAPI 文档
    location /api/docs {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/redoc {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 统一健康检查（路由到 FastAPI 健康端点）
    location /api/health {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Prometheus 指标端点
    location /metrics {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Grafana 监控面板
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Prometheus 控制台（仅内网可访问，生产环境建议通过Grafana访问）
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Flask 路由（页面渲染 + 剩余 API） ---
    location / {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        # 禁止缓存 HTML 页面（确保用户始终获取最新版本）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Nginx 自身健康检查 ---
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # --- 禁止访问隐藏文件 ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
