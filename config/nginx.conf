# ==================== WebSocket 升级映射 ====================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fastapi_backend {
    server app:5002;
    keepalive 32;
    # Docker Compose DNS resolves "app" to all 3 replica IPs (round-robin)
}

upstream nextjs_frontend {
    server nextjs:3000;
    keepalive 16;
}

# ==================== 日志格式 ====================

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" request_time=$request_time '
               'upstream_response_time=$upstream_response_time';

# ==================== 默认服务器：拒绝未知主机 ====================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ==================== 主应用服务器 ====================
server {
    listen 80;
    server_name _;

    # 禁用 DNS 反向解析
    resolver_timeout 1s;

    # 访问日志
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 安全头
    include /etc/nginx/conf.d/security-headers.conf;

    # 客户端请求体大小限制
    client_max_body_size 16m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 代理通用设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 代理缓冲区配置
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- 静态文件由 Nginx 直接服务 ---
    location /static/ {
        alias /app/static/;
        expires 7d;

        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable";

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- WebSocket 实时通知 ---
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- FastAPI 文档 ---
    location /api/docs {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/redoc {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 统一健康检查
    location /api/health {
        access_log off;
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Prometheus 指标端点（仅内网可访问）
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Grafana 监控面板
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Flower Celery 监控面板（仅内网可访问）
    location /flower/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://flower:5555/flower/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Prometheus 控制台（仅内网可访问）
    location /prometheus/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- Next.js Frontend Routes ---
    # Pages served by Next.js, API calls proxied to FastAPI
    location /_next/ {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /login {
