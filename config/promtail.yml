server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi
          __path__: /app/logs/fastapi_*.log
    pipeline_stages:
      - json:
          expressions:
            event: event
            level: level
            logger: logger
            duration: duration
            threshold: threshold
            query_type: query_type
            statement: statement
      - labels:
          event:
          level:
          logger:
          query_type:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: slow-query-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi
          __path__: /app/logs/fastapi_*.log
    pipeline_stages:
      - json:
          expressions:
            event: event
            duration: duration
            threshold: threshold
            statement: statement
            query_type: query_type
      - match:
          selector: '{event="slow_query"}'
          stages:
            - labels:
                query_type:
            - timestamp:
                source: timestamp
                format: RFC3339

  - job_name: host-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /host/var/log/*.log
