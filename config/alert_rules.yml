groups:
  - name: erp_slo
    interval: 30s
    rules:
      # SLO: P95 查询延迟 < 1s
      - alert: ERP_QueryLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{method=~"GET|HEAD"}[5m])) by (le, service)) > 1
        for: 5m
        labels:
          severity: warning
          slo: query-p95-lt-1s
        annotations:
          summary: "ERP 查询 P95 延迟超过 1s SLO"
          description: "服务 {{ $labels.service }} 查询 P95 延迟为 {{ $value | humanize }}s，超过 1s 目标。"

      # SLO: P95 写入延迟 < 2s
      - alert: ERP_WriteLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
          slo: write-p95-lt-2s
        annotations:
          summary: "ERP 写入 P95 延迟超过 2s SLO"
          description: "服务 {{ $labels.service }} 写入 P95 延迟为 {{ $value | humanize }}s，超过 2s 目标。"

      # SLO: 可用性 > 99.5% (错误率 < 0.5%)
      - alert: ERP_AvailabilityLow
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.005
        for: 5m
        labels:
          severity: critical
          slo: availability-gt-99.5
        annotations:
          summary: "ERP 可用性低于 99.5% SLO"
          description: "服务 {{ $labels.service }} 5xx 错误率为 {{ $value | humanizePercentage }}，超过 0.5% 阈值。"

      # 补充告警
      - alert: ERP_HighErrorRate
        expr: sum(rate(http_requests_total{status=~"4..|5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ERP 错误率过高"
          description: "服务 {{ $labels.service }} 错误率为 {{ $value | humanizePercentage }}。"

      - alert: ERP_DatabaseConnectionsHigh
        # 用被真实赋值的连接池指标（db_health.py 每 30s 设 db_pool_*）；
        # 原 pg_stat_activity_count / pg_settings_max_connections 从未导出，
        # 规则永不触发（评审 2026-10-11 N2）。
        expr: db_pool_checked_out{pool="async_main"} / db_pool_size{pool="async_main"} * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池使用率过高"
          # $value 已是百分数(checked_out/size*100)，不能再过 humanizePercentage（会×100）
          description: "数据库连接池使用率为 {{ $value }}%。"

      - alert: ERP_ArqTasksFailing
        expr: increase(arq_task_failure_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ARQ 任务失败数增加"
          description: "最近 5 分钟 ARQ 失败任务数 > 10，请检查死信队列。"

      - alert: ERP_DeadLetterQueueGrowing
        # arq_dead_letter_queue_depth 由 metrics.py 导出，在 /metrics 抓取前
        # 经 Redis LLEN arq:dead_letter 刷新（评审 2026-10-11 N2 前该名不存在）。
        expr: arq_dead_letter_queue_depth > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "死信队列堆积超过 10 条"
          description: "当前死信队列深度: {{ $value }}，需人工介入处理。"
