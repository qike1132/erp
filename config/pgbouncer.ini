# ==========================================
# 滨发协同系统 - PgBouncer 完整配置
# 版本: v1.0
# 功能: 数据库连接池管理
# ==========================================

[databases]
# MySQL 连接（阶段一）
erp_system = host=mysql port=3306 dbname=erp_system
# PostgreSQL 连接（阶段二启用）
# erp_system = host=postgres port=5432 dbname=erp_system

[pgbouncer]
# 监听配置
listen_port = 6432
listen_addr = 0.0.0.0

# 认证配置
auth_type = md5
auth_file = /etc/pgbouncer/users.txt

# 连接池模式
# session: 会话级连接（默认）
# transaction: 事务级连接（推荐）
# statement: 语句级连接
pool_mode = transaction

# 客户端连接限制
max_client_conn = 500
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

# 服务端连接限制
max_db_connections = 100
max_user_connections = 100

# 连接生命周期（关键参数）
server_idle_timeout = 600        ; 空闲连接 10 分钟后关闭
server_lifetime = 3600           ; 连接最长存活 1 小时
server_connect_timeout = 15      ; 连接超时 15 秒
server_login_retry = 15          ; 登录重试间隔 15 秒

# 客户端超时
client_idle_timeout = 0          ; 不禁用客户端空闲超时
client_login_timeout = 60        ; 客户端登录超时 60 秒

# 健康检查
server_check_delay = 30          ; 健康检查间隔 30 秒
server_check_query = "SELECT 1"  ; 健康检查 SQL

# 日志配置
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# 管理接口
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

# 额外安全设置
ignore_startup_parameters = extra_float_digits

# 连接数计算参考:
# 总连接数 = app 实例数 × 每个实例连接池大小 = 3 × 25 = 75
# 在 max_db_connections=100 范围内，预留 25 个连接给管理/应急
