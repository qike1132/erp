{% extends 'base.html' %}
{% block content %}
    <h2><i class="fas fa-warehouse text-info me-2"></i>皮套库存查询</h2>
    
    <div class="row">
        <div class="col-12">
            <div class="card mt-3">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <span>皮套库存汇总</span>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control form-control-sm" id="searchKeyword" placeholder="搜索产品名称或69码..." style="width: 200px;">
                            <button class="btn btn-sm btn-primary" id="refreshBtn">
                                <i class="fas fa-sync-alt me-1"></i>刷新
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div id="inventoryTable">
                        <div class="text-center text-muted py-4">
                            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card mt-4">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <span>库存流水记录 <small class="text-muted" id="selectedCaseName"></small></span>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#logFilterPanel">
                    <i class="fas fa-filter me-1"></i>筛选
                </button>
            </div>
        </div>
        <div class="collapse" id="logFilterPanel">
            <div class="card-body border-bottom">
                <form id="logFilterForm" class="row g-3">
                    <input type="hidden" id="filterCaseId">
                    <div class="col-md-3">
                        <label class="form-label">操作类型</label>
                        <select class="form-select" id="filterLogType">
                            <option value="">全部</option>
                            <option value="入库">入库</option>
                            <option value="出库">出库</option>
                            <option value="入库调整">入库调整</option>
                            <option value="出库调整">出库调整</option>
                            <option value="删除入库">删除入库</option>
                            <option value="删除出库">删除出库</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">开始日期</label>
                        <input type="date" class="form-control" id="filterStartDate">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">结束日期</label>
                        <input type="date" class="form-control" id="filterEndDate">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="fas fa-search me-1"></i>查询
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="clearFilterBtn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-body">
            <div id="logTable">
                <div class="text-center text-muted py-4">
                    <i class="fas fa-info-circle fa-2x mb-3" style="opacity: 0.3;"></i>
                    <p>请点击上方库存表格中的产品查看流水记录</p>
                </div>
            </div>
            <nav id="logPagination" class="mt-3" style="display: none;">
                <ul class="pagination justify-content-center"></ul>
            </nav>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
let inventoryData = [];
let currentCaseId = null;
let currentLogPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadInventorySummary();
    initEventHandlers();
});

function initEventHandlers() {
    document.getElementById('refreshBtn').addEventListener('click', loadInventorySummary);
    
    document.getElementById('searchKeyword').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = inventoryData.filter(item => 
            item.name.toLowerCase().includes(keyword) || 
            (item.barcode && item.barcode.toLowerCase().includes(keyword))
        );
        renderInventoryTable(filtered);
    });
    
    document.getElementById('logFilterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        currentLogPage = 1;
        if (currentCaseId) {
            loadInventoryLogs(currentCaseId);
        }
    });
    
    document.getElementById('clearFilterBtn').addEventListener('click', function() {
        document.getElementById('filterLogType').value = '';
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        currentLogPage = 1;
        if (currentCaseId) {
            loadInventoryLogs(currentCaseId);
        }
    });
}

async function loadInventorySummary() {
    const container = document.getElementById('inventoryTable');
    container.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin fa-2x mb-3"></i><p>加载中...</p></div>';
    
    try {
        const response = await fetch('/api/v1/case/inventory-summary');
        inventoryData = await response.json();
        renderInventoryTable(inventoryData);
    } catch (error) {
        container.innerHTML = `<div class="alert alert-danger">加载失败: ${error.message}</div>`;
    }
}

function renderInventoryTable(data) {
    const container = document.getElementById('inventoryTable');
    
    if (!data || data.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-4">
                <i class="fas fa-box-open fa-3x mb-3" style="opacity: 0.3;"></i>
                <p>暂无库存数据</p>
            </div>
        `;
        return;
    }
    
    const totalStock = data.reduce((sum, item) => sum + item.current_stock, 0);
    const totalIn = data.reduce((sum, item) => sum + item.total_in, 0);
    const totalOut = data.reduce((sum, item) => sum + item.total_out, 0);
    
    container.innerHTML = `
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="card bg-success bg-opacity-10 border-success">
                    <div class="card-body py-2 text-center">
                        <h5 class="mb-0 text-success">${totalStock}</h5>
                        <small class="text-muted">当前总库存</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary bg-opacity-10 border-primary">
                    <div class="card-body py-2 text-center">
                        <h5 class="mb-0 text-primary">${totalIn}</h5>
                        <small class="text-muted">累计入库</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger bg-opacity-10 border-danger">
                    <div class="card-body py-2 text-center">
                        <h5 class="mb-0 text-danger">${totalOut}</h5>
                        <small class="text-muted">累计出库</small>
                    </div>
                </div>
            </div>
        </div>
        
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>产品名称</th>
                    <th>69码</th>
                    <th>初始库存</th>
                    <th>累计入库</th>
                    <th>累计出库</th>
                    <th>当前库存</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                ${data.map(item => `
                    <tr style="cursor: pointer;" onclick="selectCase(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                        <td><strong>${item.name}</strong></td>
                        <td><small>${item.barcode || '-'}</small></td>
                        <td>${item.initial_stock}</td>
                        <td><span class="text-success">${item.total_in}</span></td>
                        <td><span class="text-danger">${item.total_out}</span></td>
                        <td><strong class="${item.current_stock < 0 ? 'text-danger' : 'text-primary'}">${item.current_stock}</strong></td>
                        <td>
                            <button class="btn btn-sm btn-outline-info" onclick="event.stopPropagation(); viewLogs(${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                                <i class="fas fa-history me-1"></i>流水
                            </button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function selectCase(caseId, caseName) {
    currentCaseId = caseId;
    document.getElementById('filterCaseId').value = caseId;
    document.getElementById('selectedCaseName').textContent = `- ${caseName}`;
    currentLogPage = 1;
    loadInventoryLogs(caseId);
    
    document.querySelectorAll('#inventoryTable tbody tr').forEach(tr => {
        tr.classList.remove('table-active');
    });
    event.currentTarget.classList.add('table-active');
}

function viewLogs(caseId, caseName) {
    currentCaseId = caseId;
    document.getElementById('filterCaseId').value = caseId;
    document.getElementById('selectedCaseName').textContent = `- ${caseName}`;
    currentLogPage = 1;
    loadInventoryLogs(caseId);
}

async function loadInventoryLogs(caseId, page = 1) {
    const container = document.getElementById('logTable');
    container.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin fa-2x mb-3"></i><p>加载中...</p></div>';
    
    const logType = document.getElementById('filterLogType').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    
    const params = new URLSearchParams({ page, per_page: 15 });
    if (logType) params.append('type', logType);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    
    try {
        const response = await fetch(`/api/v1/case/inventory-logs/${caseId}?${params}`);
        const data = await response.json();
        
        if (data.success && data.logs && data.logs.length > 0) {
            container.innerHTML = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>操作类型</th>
                            <th>变化数量</th>
                            <th>客户</th>
                            <th>关联单号</th>
                            <th>时间</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.logs.map(log => `
                            <tr>
                                <td><span class="badge ${getLogTypeBadgeClass(log.change_type)}">${log.change_type}</span></td>
                                <td><strong class="${log.change_quantity >= 0 ? 'text-success' : 'text-danger'}">${log.change_quantity >= 0 ? '+' : ''}${log.change_quantity}</strong></td>
                                <td>${log.customer || '-'}</td>
                                <td><small>${log.related_id || '-'}</small></td>
                                <td><small>${log.change_date}</small></td>
                                <td><small>${log.note || '-'}</small></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            renderLogPagination(data.pagination);
            document.getElementById('logPagination').style.display = 'block';
        } else {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-history fa-2x mb-3" style="opacity: 0.3;"></i>
                    <p>暂无流水记录</p>
                </div>
            `;
            document.getElementById('logPagination').style.display = 'none';
        }
    } catch (error) {
        container.innerHTML = `<div class="alert alert-danger">加载失败: ${error.message}</div>`;
    }
}

function getLogTypeBadgeClass(type) {
    const classes = {
        '入库': 'bg-success',
        '出库': 'bg-danger',
        '入库调整': 'bg-warning text-dark',
        '出库调整': 'bg-warning text-dark',
        '删除入库': 'bg-secondary',
        '删除出库': 'bg-secondary'
    };
    return classes[type] || 'bg-info';
}

function renderLogPagination(pagination) {
    const paginationEl = document.querySelector('#logPagination ul');
    const { page, pages } = pagination;
    
    if (pages <= 1) {
        paginationEl.innerHTML = '';
        return;
    }
    
    let html = '';
    html += `<li class="page-item ${page === 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadInventoryLogs(currentCaseId, ${page - 1}); return false;">上一页</a>
    </li>`;
    
    for (let i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || (i >= page - 2 && i <= page + 2)) {
            html += `<li class="page-item ${i === page ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadInventoryLogs(currentCaseId, ${i}); return false;">${i}</a>
            </li>`;
        } else if (i === page - 3 || i === page + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }
    
    html += `<li class="page-item ${page === pages ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadInventoryLogs(currentCaseId, ${page + 1}); return false;">下一页</a>
    </li>`;
    
    paginationEl.innerHTML = html;
}
</script>
{% endblock %}
