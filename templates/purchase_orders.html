{% extends 'base.html' %}
{% block content %}
<div class="pol-container">
    <div class="pol-header">
        <div class="pol-header-left">
            <h1 class="pol-title">
                <i class="fas fa-file-invoice-dollar"></i>
                采购订单管理
            </h1>
            <p class="pol-subtitle">查看和管理所有采购订单</p>
        </div>
        <div class="pol-header-right">
            <a href="/material/calculator" class="pol-btn-secondary">
                <i class="fas fa-calculator"></i>
                <span>返回计算器</span>
            </a>
        </div>
    </div>

    <div class="pol-body">
        <div class="pol-card">
            <div class="pol-card-header">
                <div class="pol-header-row">
                    <div class="pol-title-group">
                        <div class="pol-icon-box pol-icon-blue">
                            <i class="fas fa-list-alt"></i>
                        </div>
                        <div>
                            <h3>采购订单列表</h3>
                            <small>按创建时间倒序排列</small>
                        </div>
                    </div>
                    <div class="pol-header-actions">
                        <button class="pol-btn-delete-batch" id="btnBatchDelete" onclick="batchDeleteOrders()" disabled>
                            <i class="fas fa-trash-alt"></i>
                            <span>批量删除</span>
                            <span class="pol-selected-count" id="deleteCount">(0)</span>
                        </button>
                        <button class="pol-btn-print-batch" id="btnBatchPrint" onclick="batchPrint()" disabled>
                            <i class="fas fa-print"></i>
                            <span>批量打印</span>
                            <span class="pol-selected-count" id="selectedCount">(0)</span>
                        </button>
                        <span class="pol-badge" id="orderCount">0 个订单</span>
                    </div>
                </div>
            </div>

            <div class="pol-card-body">
                <div class="pol-filter-section">
                    <div class="pol-filter-row">
                        <div class="pol-filter-item">
                            <label>订单状态</label>
                            <select class="pol-select" id="filterStatus" onchange="loadOrders()">
                                <option value="">全部状态</option>
                                <option value="pending">待处理</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                        <div class="pol-filter-item">
                            <label>客户</label>
                            <select class="pol-select" id="filterCustomer" onchange="loadOrders()">
                                <option value="">全部客户</option>
                            </select>
                        </div>
                        <div class="pol-filter-item">
                            <label>产品名称</label>
                            <div class="pol-product-search-wrapper">
                                <input type="text" class="pol-input" id="filterProductName"
                                       placeholder="输入产品名称或69码关键字"
                                       autocomplete="off"
                                       oninput="handleProductSearchInput(this.value)"
                                       onblur="hideProductSuggestions()">
                                <div class="pol-product-suggestions" id="productSuggestions" style="display:none;"></div>
                            </div>
                        </div>
                        <div class="pol-filter-item">
                            <label>开始日期</label>
                            <input type="date" class="pol-input" id="filterStartDate">
                        </div>
                        <div class="pol-filter-item">
                            <label>结束日期</label>
                            <input type="date" class="pol-input" id="filterEndDate">
                        </div>
                        <div class="pol-filter-item pol-filter-action">
                            <button class="pol-btn-primary" onclick="loadOrders()">
                                <i class="fas fa-search"></i>
                                筛选
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pol-order-list" id="orderList">
                    <div class="pol-loading-state">
                        <div class="pol-spinner"></div>
                        <span>加载订单列表...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="pol-print-template" id="printTemplate" style="display:none;"></div>

<script>
let allOrders = [];
let selectedOrders = new Set();
let productSearchTimer = null;
let selectedProductName = '';

document.addEventListener('DOMContentLoaded', async function() {
    await loadCustomers();
    await loadOrders();
});

async function loadCustomers() {
    try {
        const response = await fetch('/api/v1/purchase-center/api/customers');
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const result = await response.json();
        
        if (result.success && result.data) {
            const select = document.getElementById('filterCustomer');
            result.data.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.customer_code 
                    ? `${customer.customer_code} - ${customer.name}`
                    : customer.name;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Load customers error:', error);
    }
}

async function loadOrders() {
    try {
        const status = document.getElementById('filterStatus').value;
        const customerId = document.getElementById('filterCustomer').value;
        const productName = selectedProductName;
        const startDate = document.getElementById('filterStartDate').value;
        const endDate = document.getElementById('filterEndDate').value;

        let url = '/api/v1/purchase-center/api/orders?per_page=100';
        if (status) url += `&status=${status}`;
        if (customerId) url += `&customer_id=${customerId}`;
        if (productName) url += `&product_name=${encodeURIComponent(productName)}`;
        if (startDate) url += `&start_date=${startDate}`;
        if (endDate) url += `&end_date=${endDate}`;
        
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success) {
            allOrders = result.data.orders;
            renderOrders();
            document.getElementById('orderCount').textContent = `${result.data.total} 个订单`;
        } else {
            showError('加载订单失败：' + result.error);
        }
    } catch (error) {
        console.error('Load orders error:', error);
        showError('网络错误，无法加载订单列表');
    }
}

function handleProductSearchInput(value) {
    clearTimeout(productSearchTimer);

    if (value.length < 1) {
        hideProductSuggestions();
        selectedProductName = '';
        return;
    }

    productSearchTimer = setTimeout(async () => {
        await searchProducts(value);
    }, 300);
}

async function searchProducts(keyword) {
    try {
        const response = await fetch(`/api/v1/purchase-center/api/products?search=${encodeURIComponent(keyword)}&per_page=10`);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const result = await response.json();

        if (result.success && result.data && result.data.products) {
            showProductSuggestions(result.data.products);
        }
    } catch (error) {
        console.error('Search products error:', error);
    }
}

function showProductSuggestions(products) {
    const container = document.getElementById('productSuggestions');

    if (!products || products.length === 0) {
        container.innerHTML = '<div class="pol-suggestion-item">未找到匹配的产品</div>';
        container.style.display = 'block';
        return;
    }

    let html = '';
    products.forEach(product => {
        html += `
            <div class="pol-suggestion-item" onclick="selectProduct('${escapeHtml(product.name)}')">
                <span class="product-name">${escapeHtml(product.name)}</span>
                <span class="product-code">${escapeHtml(product.barcode || product.product_code || '')}</span>
            </div>
        `;
    });

    container.innerHTML = html;
    container.style.display = 'block';
}

function selectProduct(productName) {
    selectedProductName = productName;
    document.getElementById('filterProductName').value = productName;
    hideProductSuggestions();
    loadOrders();
}

function hideProductSuggestions() {
    setTimeout(() => {
        document.getElementById('productSuggestions').style.display = 'none';
    }, 200);
}

function renderOrders() {
    const container = document.getElementById('orderList');
    
    if (!allOrders || allOrders.length === 0) {
        container.innerHTML = `
            <div class="pol-empty-state">
                <i class="fas fa-inbox"></i>
                <p>暂无采购订单</p>
                <span>去物料用量计算器生成第一个订单</span>
            </div>
        `;
        return;
    }
    
    const statusLabels = {
        'pending': '待处理',
        'completed': '已完成',
        'cancelled': '已取消'
    };
    
    let html = '';
    allOrders.forEach(order => {
        const isSelected = selectedOrders.has(order.id);
        
        html += `
            <div class="pol-order-card ${isSelected ? 'selected' : ''}" data-id="${order.id}">
                <div class="pol-order-select-bar">
                    <label class="pol-checkbox-label">
                        <input type="checkbox" 
                               ${isSelected ? 'checked' : ''} 
                               onchange="toggleOrderSelect(${order.id}, this.checked)">
                        <span class="pol-checkbox-custom"></span>
                        <span>选择此订单</span>
                    </label>
                </div>
                
                <div class="pol-order-header">
                    <div class="pol-order-no">
                        <a href="/material/orders/${order.id}">${order.order_no}</a>
                    </div>
                    <div class="pol-order-actions">
                        <button class="pol-btn-delete" onclick="deleteSingleOrder(${order.id})" title="删除订单">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <button class="pol-btn-print" onclick="printSingleOrder(${order.id})">
                            <i class="fas fa-print"></i>
                            打印
                        </button>
                        <span class="pol-status-badge ${order.status}">${statusLabels[order.status] || order.status}</span>
                    </div>
                </div>
                
                <div class="pol-order-info">
                    <div class="pol-info-item">
                        <span class="pol-info-label">客户</span>
                        <span class="pol-info-value">${order.customer_name || '未指定'}</span>
                    </div>
                    <div class="pol-info-item">
                        <span class="pol-info-label">供应商</span>
                        <span class="pol-info-value">${order.supplier_name || '未指定'}</span>
                    </div>
                    <div class="pol-info-item">
                        <span class="pol-info-label">下单日期</span>
                        <span class="pol-info-value">${order.order_date}</span>
                    </div>
                    <div class="pol-info-item">
                        <span class="pol-info-label">创建时间</span>
                        <span class="pol-info-value">${order.create_time}</span>
                    </div>
                </div>
                
                ${order.items && order.items.length > 0 ? `
                    <div class="pol-order-items">
                        <table class="pol-items-table">
                            <thead>
                                <tr>
                                    <th style="width:40%;">物料名称</th>
                                    <th style="width:15%;">规格</th>
                                    <th style="width:10%;">单位</th>
                                    <th style="width:15%;">采购数量</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${order.items.map(item => `
                                    <tr>
                                        <td class="pol-mat-name">${escapeHtml(item.material_name)}</td>
                                        <td>${item.specification || '-'}</td>
                                        <td style="text-align:center;">${item.unit || '-'}</td>
                                        <td class="pol-mat-total" style="text-align:right;">${Number(item.quantity || 0).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                ` : ''}
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function toggleOrderSelect(orderId, checked) {
    if (checked) {
        selectedOrders.add(orderId);
    } else {
        selectedOrders.delete(orderId);
    }
    
    const card = document.querySelector(`.pol-order-card[data-id="${orderId}"]`);
    if (card) {
        card.classList.toggle('selected', checked);
    }

    updateBatchPrintButton();
}

function updateBatchPrintButton() {
    const btn = document.getElementById('btnBatchPrint');
    const countEl = document.getElementById('selectedCount');
    
    btn.disabled = selectedOrders.size === 0;
    countEl.textContent = `(${selectedOrders.size})`;
    
    const deleteBtn = document.getElementById('btnBatchDelete');
    const deleteCountEl = document.getElementById('deleteCount');
    if (deleteBtn) {
        deleteBtn.disabled = selectedOrders.size === 0;
    }
    if (deleteCountEl) {
        deleteCountEl.textContent = `(${selectedOrders.size})`;
    }
}

async function deleteSingleOrder(orderId) {
    if (!confirm('确定要删除此采购订单吗？此操作不可撤销。')) {
        return;
    }
    
    try {
        const response = await fetch(`/api/v1/purchase-center/api/orders/${orderId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success) {
            showToast(result.message || '订单已删除', 'success');
            await loadOrders();
        } else {
            showToast(result.error || '删除订单时发生错误', 'error');
        }
    } catch (error) {
        console.error('Delete order error:', error);
        showToast('网络错误，请检查连接后重试', 'error');
    }
}

async function batchDeleteOrders() {
    if (selectedOrders.size === 0) {
        showToast('请先选择要删除的订单', 'warning');
        return;
    }
    
    const count = selectedOrders.size;
    if (!confirm(`确定要删除选中的 ${count} 个采购订单吗？此操作不可撤销。`)) {
        return;
    }
    
    try {
        const response = await fetch('/api/v1/purchase-center/api/orders/batch-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_ids: Array.from(selectedOrders) })
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success) {
            showToast(result.message || `成功删除 ${count} 个订单`, 'success');
            selectedOrders.clear();
            await loadOrders();
        } else {
            showToast(result.error || '批量删除订单时发生错误', 'error');
        }
    } catch (error) {
        console.error('Batch delete orders error:', error);
        showToast('网络错误，请检查连接后重试', 'error');
    }
}

async function printSingleOrder(orderId) {
    try {
        const response = await fetch(`/api/v1/purchase-center/api/orders/${orderId}/print`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success) {
            const printHtml = generatePrintPage(result.data);
            printWithHtml(printHtml);
        } else {
            alert('获取打印数据失败：' + result.error);
        }
    } catch (error) {
        console.error('Print error:', error);
        alert('打印失败，请重试');
    }
}

async function batchPrint() {
    if (selectedOrders.size === 0) {
        alert('请先选择要打印的订单');
        return;
    }
    
    try {
        const orderIds = Array.from(selectedOrders);
        const response = await fetch('/api/v1/purchase-center/api/orders/batch-print', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_ids: orderIds })
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success) {
            let allPrintHtml = '';
            result.data.forEach((orderData, index) => {
                allPrintHtml += generatePrintPage(orderData);
                if (index < result.data.length - 1) {
                    allPrintHtml += '<div style="page-break-after: always;"></div>';
                }
            });
            
            printWithHtml(allPrintHtml);
        } else {
            alert('获取打印数据失败：' + result.error);
        }
    } catch (error) {
        console.error('Batch print error:', error);
        alert('批量打印失败，请重试');
    }
}

function generatePrintPage(data) {
    const items = data.items || [];
    
    let tableRows = '';
    items.forEach((item, index) => {
        tableRows += `
            <tr>
                <td style="text-align:center;">${index + 1}</td>
                <td>${item.material_code || ''}</td>
                <td style="text-align:left;">${escapeHtml(item.material_name)}</td>
                <td>${item.specification || ''}</td>
                <td>${item.unit || ''}</td>
                <td style="font-weight:600;">${Number(item.quantity || 0).toFixed(2)}</td>
            </tr>
        `;
    });
    
    return `
        <div class="print-page">
            <div class="print-header">
                <div class="print-company">${data.company_name || '东莞市滨发玩具有限公司'}</div>
                <div class="print-title">${data.title || '采购订单'}</div>
                <div class="print-order-no">订单编号：${data.order_no}</div>
            </div>
            <div class="print-info">
                <div class="print-info-row">
                    ${data.customer_name ? `
                    <div class="print-info-item">
                        <span class="print-label">客户：</span>
                        <span class="print-value">${data.customer_name}</span>
                    </div>
                    ` : ''}
                    <div class="print-info-item">
                        <span class="print-label">供应商：</span>
                        <span class="print-value">${data.supplier_name || ''}</span>
                    </div>
                    <div class="print-info-item">
                        <span class="print-label">下单日期：</span>
                        <span class="print-value">${data.order_date || ''}</span>
                    </div>
                </div>
            </div>
            <table class="print-table">
                <thead>
                    <tr>
                        <th style="width:35px;">序号</th>
                        <th style="width:90px;">物料编码</th>
                        <th style="width:150px;">物料名称</th>
                        <th style="width:80px;">规格</th>
                        <th style="width:40px;">单位</th>
                        <th style="width:80px;">采购数量</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
            <div class="print-footer">
                ${data.remark ? `<div class="print-remark">备注：${data.remark}</div>` : ''}
                <div class="print-signatures">
                    <div class="print-sign-item">
                        <span>制单人：</span>
                        <div class="print-sign-line"></div>
                    </div>
                    <div class="print-sign-item">
                        <span>审核人：</span>
                        <div class="print-sign-line"></div>
                    </div>
                    <div class="print-sign-item">
                        <span>供应商确认：</span>
                        <div class="print-sign-line"></div>
                    </div>
                </div>
                <div class="print-date">
                    <span>打印时间：</span>
                    <span>${new Date().toLocaleString('zh-CN')}</span>
                </div>
            </div>
        </div>
    `;
}

function printWithHtml(html) {
    const printTemplate = document.getElementById('printTemplate');
    printTemplate.innerHTML = html;
    printTemplate.style.display = 'block';

    setTimeout(() => {
        window.print();
        setTimeout(() => {
            printTemplate.style.display = 'none';
        }, 100);
    }, 100);
}

function showError(message) {
    document.getElementById('orderList').innerHTML = `
        <div class="pol-empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#E57373;"></i>
            <p style="color:#C62828;">${message}</p>
        </div>
    `;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

</script>
{% endblock %}
