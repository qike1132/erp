{% extends 'base.html' %}

{% block content %}
    <h2>编辑备货记录</h2>
    <div class="card mt-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-edit me-2"></i>编辑备货信息</span>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="customer" class="form-label">客户名称</label>
                            <select class="form-select" id="customer" name="customer" required>
                                <option value="">请选择客户</option>
                                {% for c in customers %}
                                <option value="{{ c.name }}" {{ 'selected' if stockin.customer == c.name else '' }}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="stockin_date" class="form-label">备货时间</label>
                            <input type="date" class="form-control" id="stockin_date" name="stockin_date" value="{{ stockin.stockin_date.strftime('%Y-%m-%d') }}">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="stockin_no" class="form-label">备货编号</label>
                            <input type="text" class="form-control" id="stockin_no" name="stockin_no" value="{{ stockin.stockin_no }}" required placeholder="例如：STK-IN-2025001">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="quantity" class="form-label">备货数量</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ stockin.quantity }}" min="1" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="product_id" class="form-label">产品</label>
                            <select class="form-select" id="product_id" name="product_id" required>
                                <option value="">请选择产品</option>
                                {% for product in products %}
                                    <option value="{{ product.id }}" {{ 'selected' if product.id == stockin.product_id else '' }}>{{ product.name }} - 当前库存：{{ product.current_stock }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="note" class="form-label">备注</label>
                            <textarea class="form-control" id="note" name="note" rows="2" placeholder="例如：批量备货">{{ stockin.note }}</textarea>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>保存修改</button>
                <a href="{{ url_for('stock.stockins') }}" class="btn btn-secondary"><i class="fas fa-times me-1"></i>取消</a>
            </form>
        </div>
    </div>
{% endblock %}
