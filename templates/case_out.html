{% extends 'base.html' %}
{% block content %}
    <h2><i class="fas fa-shipping-fast text-danger me-2"></i>皮套出库管理</h2>
    
    <div class="row">
        <div class="col-lg-6">
            <div class="card mt-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>皮套出库信息录入</span>
                    <span class="badge bg-info" id="stagedCountBadge" style="display: none;">已暂存: 0</span>
                </div>
                <div class="card-body">
                    <form id="stockoutForm">
                        <input type="hidden" id="product_id" name="product_id">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="customer" class="form-label">客户名称</label>
                                <select class="form-select" id="customer" name="customer">
                                    <option value="">请选择客户</option>
                                    {% for c in customers %}
                                    <option value="{{ c }}">{{ c }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="stockout_date" class="form-label">出库时间</label>
                                <input type="date" class="form-control" id="stockout_date" name="stockout_date">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="product_search" class="form-label">产品名称</label>
                                <input type="text" class="form-control" id="product_search" name="product_search" placeholder="输入产品名称或69码搜索" autocomplete="off" list="product_list" required>
                                <datalist id="product_list"></datalist>
                                <small class="text-muted" id="currentStock">当前库存: -</small>
                            </div>
                            <div class="col-md-4">
                                <label for="quantity" class="form-label">出库数量</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="note" class="form-label">备注</label>
                            <textarea class="form-control" id="note" name="note" rows="2" placeholder="例如：批量出库"></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary" id="addNewStockoutBtn" disabled>
                                <i class="fas fa-plus-circle me-1"></i>新增出库
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-6">
            <div class="card mt-3">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <span>暂存出库列表</span>
                        <span id="totalStagedCount">共 0 个</span>
                    </div>
                </div>
                <div class="card-body">
                    <div id="stagedStockoutsList" style="max-height: 400px; overflow-y: auto;">
                        <div class="text-center text-muted py-4">
                            <i class="fas fa-shipping-fast fa-3x mb-3" style="opacity: 0.3;"></i>
                            <p>暂无暂存出库</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header d-flex justify-content-between align-items-center collapse-trigger" style="cursor: pointer;" id="batchUploadHeader">
                    <h6 class="mb-0 fw-bold">批量导出出库</h6>
                    <i class="fas fa-chevron-down collapse-arrow"></i>
                </div>
                <div class="collapse-content" id="collapseBatchUpload">
                    <div class="card-body">
                        <div id="excel-upload-area" class="border border-dashed p-4 text-center rounded" 
                             style="min-height: 150px; cursor: pointer; background: #fafafa; border-color: #dee2e6 !important;">
                            <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100px;">
                                <i class="fas fa-file-excel fa-2x text-success mb-2" style="opacity: 0.8;"></i>
                                <p class="text-muted mb-0 small">拖拽 Excel 文件到这里，或者点击选择文件</p>
                                <p class="text-muted mb-0 small" style="font-size: 11px; color: #6c757d;">支持格式：.xlsx, .xls</p>
                            </div>
                            <input type="file" id="excel-input" style="display: none;" accept=".xlsx,.xls">
                            <div id="excel-preview" class="mt-3"></div>
                            <div id="upload-status" class="mt-3"></div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button id="download-template" class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-file-excel me-2"></i>下载模板
                            </button>
                            <button id="batch-import" class="btn btn-success btn-sm" disabled>
                                <i class="fas fa-upload me-2"></i>开始导入
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card mt-4">
        <div class="card-body text-center py-4">
            <button type="button" class="btn btn-danger btn-lg" id="submitAllStockoutsBtn" disabled style="min-width: 200px;">
                <i class="fas fa-paper-plane me-2"></i>
                <span id="submitBtnText">提交出库</span>
                <span id="submitBtnSpinner" class="spinner-border spinner-border-sm" style="display: none;"></span>
            </button>
        </div>
    </div>
    
    <div class="card mt-4">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <span>出库记录列表</span>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#searchPanel">
                        <i class="fas fa-filter me-1"></i>筛选
                    </button>
                </div>
            </div>
        </div>
        <div class="collapse" id="searchPanel">
            <div class="card-body border-bottom">
                <form id="searchForm" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">客户</label>
                        <select class="form-select" id="searchCustomer" name="customer">
                            <option value="">全部</option>
                            {% for c in customers %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">开始日期</label>
                        <input type="date" class="form-control" id="searchStartDate" name="start_date">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">结束日期</label>
                        <input type="date" class="form-control" id="searchEndDate" name="end_date">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-1"></i>查询
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-body">
            <div id="stockoutListTable">
                <div class="text-center text-muted py-4">
                    <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                    <p>加载中...</p>
                </div>
            </div>
            <nav id="pagination" class="mt-3">
                <ul class="pagination justify-content-center"></ul>
            </nav>
        </div>
    </div>
    
    <div class="modal fade" id="editStagedStockoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑暂存出库</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="editStagedStockoutContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEditStagedStockoutBtn">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="editStockoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑出库记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editStockoutId">
                    <div class="mb-3">
                        <label class="form-label">客户名称</label>
                        <select class="form-select" id="editStockoutCustomer">
                            <option value="">无</option>
                            {% for c in customers %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">出库日期</label>
                        <input type="date" class="form-control" id="editStockoutDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">产品名称</label>
                        <input type="text" class="form-control" id="editStockoutProductName" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">出库数量</label>
                        <input type="number" class="form-control" id="editStockoutQuantity" min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea class="form-control" id="editStockoutNote" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEditStockoutBtn">保存</button>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
let stagedStockouts = [];
let currentPage = 1;
let currentFilters = {};
let editingStagedIndex = -1;
let currentProductStock = 0;

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('stockout_date').value = new Date().toISOString().split('T')[0];
    initProductSearch();
    initFormHandlers();
    initBatchUpload();
    loadStockoutList();
});

function initProductSearch() {
    const searchInput = document.getElementById('product_search');
    let searchTimeout;
    
    searchInput.addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const query = e.target.value.trim();
            if (query.length >= 1) {
                fetch(`/api/v1/case/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        const datalist = document.getElementById('product_list');
                        datalist.innerHTML = '';
                        data.forEach(product => {
                            const option = document.createElement('option');
                            option.value = product.name;
                            option.setAttribute('data-id', product.id);
                            option.setAttribute('data-stock', product.current_stock);
                            datalist.appendChild(option);
                        });
                    });
            }
        }, 300);
        updateAddButtonState();
    });
    
    searchInput.addEventListener('change', function() {
        const datalist = document.getElementById('product_list');
        const selectedOption = Array.from(datalist.options).find(opt => opt.value === this.value);
        if (selectedOption) {
            document.getElementById('product_id').value = selectedOption.getAttribute('data-id');
            currentProductStock = parseInt(selectedOption.getAttribute('data-stock')) || 0;
            document.getElementById('currentStock').textContent = `当前库存: ${currentProductStock}`;
        }
        updateAddButtonState();
    });
}

function initFormHandlers() {
    ['customer', 'quantity', 'stockout_date'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateAddButtonState);
        document.getElementById(id).addEventListener('input', updateAddButtonState);
    });
    
    document.getElementById('addNewStockoutBtn').addEventListener('click', addStagedStockout);
    document.getElementById('submitAllStockoutsBtn').addEventListener('click', submitAllStockouts);
    document.getElementById('saveEditStagedStockoutBtn').addEventListener('click', saveEditStagedStockout);
    document.getElementById('saveEditStockoutBtn').addEventListener('click', saveEditStockout);
    
    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        currentFilters = {
            customer: document.getElementById('searchCustomer').value,
            start_date: document.getElementById('searchStartDate').value,
            end_date: document.getElementById('searchEndDate').value
        };
        currentPage = 1;
        loadStockoutList();
    });
}

function updateAddButtonState() {
    const productId = document.getElementById('product_id').value;
    const quantity = parseInt(document.getElementById('quantity').value) || 0;
    const stockoutDate = document.getElementById('stockout_date').value;
    const addBtn = document.getElementById('addNewStockoutBtn');
    
    if (productId && quantity > 0 && stockoutDate && quantity <= currentProductStock) {
        addBtn.disabled = false;
        addBtn.classList.add('btn-primary');
        addBtn.classList.remove('btn-secondary');
    } else {
        addBtn.disabled = true;
        addBtn.classList.remove('btn-primary');
        addBtn.classList.add('btn-secondary');
    }
}

function addStagedStockout() {
    const quantity = parseInt(document.getElementById('quantity').value) || 1;
    if (quantity > currentProductStock) {
        GlobalNotification.error(`库存不足，当前库存: ${currentProductStock}`);
        return;
    }
    
    const stockout = {
        productId: document.getElementById('product_id').value,
        productName: document.getElementById('product_search').value,
        customer: document.getElementById('customer').value,
        stockoutDate: document.getElementById('stockout_date').value,
        quantity: quantity,
        note: document.getElementById('note').value,
        id: Date.now()
    };
    
    stagedStockouts.push(stockout);
    currentProductStock -= quantity;
    document.getElementById('currentStock').textContent = `当前库存: ${currentProductStock}`;
    updateStagedList();
    clearForm();
}

function updateStagedList() {
    const container = document.getElementById('stagedStockoutsList');
    const countBadge = document.getElementById('stagedCountBadge');
    const totalCount = document.getElementById('totalStagedCount');
    const submitBtn = document.getElementById('submitAllStockoutsBtn');
    
    if (stagedStockouts.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-4">
                <i class="fas fa-shipping-fast fa-3x mb-3" style="opacity: 0.3;"></i>
                <p>暂无暂存出库</p>
            </div>
        `;
        countBadge.style.display = 'none';
        totalCount.textContent = '共 0 个';
        submitBtn.disabled = true;
    } else {
        countBadge.style.display = 'inline-block';
        countBadge.textContent = `已暂存: ${stagedStockouts.length}`;
        totalCount.textContent = `共 ${stagedStockouts.length} 个`;
        submitBtn.disabled = false;
        
        container.innerHTML = stagedStockouts.map((item, index) => `
            <div class="card mb-2" style="border: 2px solid #f8d7da;">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1"><i class="fas fa-cubes text-danger me-1"></i>${item.productName}</h6>
                            <p class="mb-1 text-muted small"><i class="fas fa-user me-1"></i>${item.customer || '无客户'}</p>
                            <p class="mb-0 small">
                                <span class="badge bg-danger me-1">数量: ${item.quantity}</span>
                                <span class="badge bg-secondary">${item.stockoutDate}</span>
                            </p>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-warning" onclick="editStagedStockout(${index})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStagedStockout(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }
}

function editStagedStockout(index) {
    editingStagedIndex = index;
    const item = stagedStockouts[index];
    
    document.getElementById('editStagedStockoutContent').innerHTML = `
        <div class="mb-3">
            <label class="form-label">客户名称</label>
            <select class="form-select" id="editStagedCustomer">
                <option value="">无</option>
                {% for c in customers %}
                <option value="{{ c }}" ${item.customer === '{{ c }}' ? 'selected' : ''}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">出库日期</label>
            <input type="date" class="form-control" id="editStagedDate" value="${item.stockoutDate}">
        </div>
        <div class="mb-3">
            <label class="form-label">产品名称</label>
            <input type="text" class="form-control" value="${item.productName}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">出库数量</label>
            <input type="number" class="form-control" id="editStagedQuantity" value="${item.quantity}" min="1">
        </div>
        <div class="mb-3">
            <label class="form-label">备注</label>
            <textarea class="form-control" id="editStagedNote" rows="2">${item.note || ''}</textarea>
        </div>
    `;
    
    new bootstrap.Modal(document.getElementById('editStagedStockoutModal')).show();
}

function saveEditStagedStockout() {
    if (editingStagedIndex !== -1) {
        stagedStockouts[editingStagedIndex].customer = document.getElementById('editStagedCustomer').value;
        stagedStockouts[editingStagedIndex].stockoutDate = document.getElementById('editStagedDate').value;
        stagedStockouts[editingStagedIndex].quantity = parseInt(document.getElementById('editStagedQuantity').value) || 1;
        stagedStockouts[editingStagedIndex].note = document.getElementById('editStagedNote').value;
        
        updateStagedList();
        bootstrap.Modal.getInstance(document.getElementById('editStagedStockoutModal')).hide();
        editingStagedIndex = -1;
    }
}

function deleteStagedStockout(index) {
    if (confirm('确定要删除这个暂存出库吗？')) {
        stagedStockouts.splice(index, 1);
        updateStagedList();
    }
}

function clearForm() {
    document.getElementById('customer').value = '';
    document.getElementById('product_search').value = '';
    document.getElementById('product_id').value = '';
    document.getElementById('quantity').value = '1';
    document.getElementById('note').value = '';
    document.getElementById('stockout_date').value = new Date().toISOString().split('T')[0];
    document.getElementById('currentStock').textContent = '当前库存: -';
    currentProductStock = 0;
    updateAddButtonState();
}

async function submitAllStockouts() {
    if (stagedStockouts.length === 0) return;
    
    const btn = document.getElementById('submitAllStockoutsBtn');
    const btnText = document.getElementById('submitBtnText');
    const btnSpinner = document.getElementById('submitBtnSpinner');
    
    btn.disabled = true;
    btnText.textContent = '提交中...';
    btnSpinner.style.display = 'inline-block';
    
    try {
        const response = await fetch('/api/batch-submit-case-stockouts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                stockouts: stagedStockouts.map(s => ({
                    productId: s.productId,
                    customer: s.customer,
                    quantity: s.quantity,
                    stockout_date: s.stockoutDate,
                    note: s.note
                }))
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            const failed = result.results.filter(r => !r.success);
            if (failed.length > 0) {
                GlobalNotification.warning(`成功 ${result.results.length - failed.length} 条，失败 ${failed.length} 条`);
            } else {
                GlobalNotification.success('出库成功');
            }
            stagedStockouts = [];
            updateStagedList();
            loadStockoutList();
        } else {
            GlobalNotification.error(result.error || '提交失败');
        }
    } catch (error) {
        GlobalNotification.error('提交失败: ' + error.message);
    } finally {
        btn.disabled = false;
        btnText.textContent = '提交出库';
        btnSpinner.style.display = 'none';
    }
}

async function loadStockoutList(page = 1) {
    const container = document.getElementById('stockoutListTable');
    container.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin fa-2x mb-3"></i><p>加载中...</p></div>';
    
    const params = new URLSearchParams({ page, per_page: 10, ...currentFilters });
    
    try {
        const response = await fetch(`/api/v1/case/out/list?${params}`);
        const data = await response.json();
        
        if (data.stockouts && data.stockouts.length > 0) {
            container.innerHTML = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>出库编号</th>
                            <th>出库日期</th>
                            <th>客户</th>
                            <th>产品名称</th>
                            <th>69码</th>
                            <th>数量</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.stockouts.map(item => `
                            <tr>
                                <td><small>${item.stockout_no}</small></td>
                                <td>${item.stockout_date}</td>
                                <td>${item.customer || '-'}</td>
                                <td>${item.case_name}</td>
                                <td><small>${item.case_barcode || '-'}</small></td>
                                <td><strong class="text-danger">${item.quantity}</strong></td>
                                <td><small>${item.note || '-'}</small></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-warning me-1" onclick="openEditStockoutModal(${item.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteStockout(${item.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            renderPagination(data.current_page, data.pages);
        } else {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-shipping-fast fa-3x mb-3" style="opacity: 0.3;"></i>
                    <p>暂无出库记录</p>
                </div>
            `;
        }
    } catch (error) {
        container.innerHTML = `<div class="alert alert-danger">加载失败: ${error.message}</div>`;
    }
}

function renderPagination(current, total) {
    const pagination = document.querySelector('#pagination ul');
    if (total <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    html += `<li class="page-item ${current === 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadStockoutList(${current - 1}); return false;">上一页</a>
    </li>`;
    
    for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || (i >= current - 2 && i <= current + 2)) {
            html += `<li class="page-item ${i === current ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadStockoutList(${i}); return false;">${i}</a>
            </li>`;
        } else if (i === current - 3 || i === current + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }
    
    html += `<li class="page-item ${current === total ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadStockoutList(${current + 1}); return false;">下一页</a>
    </li>`;
    
    pagination.innerHTML = html;
}

async function openEditStockoutModal(id) {
    try {
        const response = await fetch(`/api/case-stockout/${id}`);
        const data = await response.json();
        
        document.getElementById('editStockoutId').value = id;
        document.getElementById('editStockoutCustomer').value = data.customer || '';
        document.getElementById('editStockoutDate').value = data.stockout_date;
        document.getElementById('editStockoutProductName').value = data.case_name;
        document.getElementById('editStockoutQuantity').value = data.quantity;
        document.getElementById('editStockoutNote').value = data.note || '';
        
        new bootstrap.Modal(document.getElementById('editStockoutModal')).show();
    } catch (error) {
        GlobalNotification.error('获取数据失败');
    }
}

async function saveEditStockout() {
    const id = document.getElementById('editStockoutId').value;
    const data = {
        customer: document.getElementById('editStockoutCustomer').value,
        stockout_date: document.getElementById('editStockoutDate').value,
        quantity: parseInt(document.getElementById('editStockoutQuantity').value),
        note: document.getElementById('editStockoutNote').value
    };
    
    try {
        const response = await fetch(`/api/case-stockout/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            GlobalNotification.success('更新成功');
            bootstrap.Modal.getInstance(document.getElementById('editStockoutModal')).hide();
            loadStockoutList(currentPage);
        } else {
            GlobalNotification.error(result.message);
        }
    } catch (error) {
        GlobalNotification.error('更新失败');
    }
}

async function deleteStockout(id) {
    if (!confirm('确定要删除这条出库记录吗？')) return;
    
    try {
        const response = await fetch(`/api/case-stockout/${id}`, { method: 'DELETE' });
        const result = await response.json();
        
        if (result.success) {
            GlobalNotification.success('删除成功');
            loadStockoutList(currentPage);
        } else {
            GlobalNotification.error(result.message);
        }
    } catch (error) {
        GlobalNotification.error('删除失败');
    }
}

function initBatchUpload() {
    const uploadArea = document.getElementById('excel-upload-area');
    const fileInput = document.getElementById('excel-input');
    const downloadBtn = document.getElementById('download-template');
    const importBtn = document.getElementById('batch-import');
    let selectedFile = null;
    
    uploadArea.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
            fileInput.click();
        }
    });
    
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('border-success', 'bg-success', 'bg-opacity-10');
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('border-success', 'bg-success', 'bg-opacity-10');
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('border-success', 'bg-success', 'bg-opacity-10');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });
    
    function handleFile(file) {
        if (!file.name.match(/\.(xlsx|xls)$/i)) {
            GlobalNotification.error('请选择Excel文件');
            return;
        }
        selectedFile = file;
        document.getElementById('excel-preview').innerHTML = `
            <div class="alert alert-info py-2">
                <i class="fas fa-file-excel me-2"></i>${file.name}
            </div>
        `;
        importBtn.disabled = false;
    }
    
    downloadBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        downloadBtn.disabled = true;
        downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>下载中...';
        
        try {
            const response = await fetch('/api/v1/batch/download-template');
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '皮套出库模板.xlsx';
            a.click();
            window.URL.revokeObjectURL(url);
        } catch (error) {
            GlobalNotification.error('下载失败');
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '<i class="fas fa-file-excel me-2"></i>下载模板';
        }
    });
    
    importBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        
        importBtn.disabled = true;
        importBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>导入中...';
        
        const formData = new FormData();
        formData.append('file', selectedFile);
        
        try {
            const response = await fetch('/api/v1/batch/import-case-stockouts', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            
            if (result.success) {
                GlobalNotification.success(`成功导入 ${result.imported} 条记录`);
                loadStockoutList();
            } else {
                GlobalNotification.error(result.message || '导入失败');
            }
        } catch (error) {
            GlobalNotification.error('导入失败');
        } finally {
            importBtn.disabled = false;
            importBtn.innerHTML = '<i class="fas fa-upload me-2"></i>开始导入';
        }
    });
}
</script>
{% endblock %}
