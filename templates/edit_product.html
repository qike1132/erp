{% extends 'base.html' %}
{% block content %}
    <h2>编辑产品</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">产品名称</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="barcode" class="form-label">69码/商品条码</label>
                    <input type="text" class="form-control" id="barcode" name="barcode" value="{{ product.barcode or '' }}" placeholder="例如：6958085574210">
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">产品价格</label>
                    <input type="number" class="form-control" id="price" name="price" value="{{ product.price or 0 }}" step="0.01" min="0" placeholder="请输入产品价格">
                </div>
                <div class="mb-3">
                    <label class="form-label">产品图片</label>
                    <div id="image-upload-area" class="border border-dashed p-4 text-center" style="min-height: 100px;">
                        <p>拖拽图片到这里，或者点击选择图片</p>
                        <input type="file" id="image-input" style="display: none;" accept="image/*">
                        <input type="hidden" id="image-url" name="image" value="{{ product.image or '' }}">
                        <div id="image-preview" class="mt-2">
                            {% if product.image %}
                                <img src="{{ product.image }}" class="product-thumbnail" data-src="{{ product.image }}" style="max-width: 250px; max-height: 250px; object-fit: contain; cursor: pointer; border-radius: 4px;">
                            {% endif %}
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a href="/product/list?page={{ request.args.get('page', 1) }}" class="btn btn-secondary">取消</a>
            </form>
        </div>
    </div>
    
    <!-- 图片查看模态框 -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">产品图片</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" style="max-width: 100%; max-height: 80vh;" class="img-fluid">
                </div>
            </div>
        </div>
    </div>
    
    <script>
    // 图片上传区域
    const uploadArea = document.getElementById('image-upload-area');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const imageUrlInput = document.getElementById('image-url');
    let uploadProgress;
    
    // 创建上传进度元素
    function createProgressElement() {
        uploadProgress = document.createElement('div');
        uploadProgress.className = 'mt-2';
        uploadProgress.innerHTML = `
            <div class="progress" style="height: 20px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
            <p class="mt-1 text-muted small">上传中...</p>
        `;
        uploadArea.appendChild(uploadProgress);
    }
    
    function removeProgressElement() {
        if (uploadProgress) {
            uploadProgress.remove();
            uploadProgress = null;
        }
    }
    
    function updateProgress(percent, message) {
        if (uploadProgress) {
            const progressBar = uploadProgress.querySelector('.progress-bar');
            const progressText = uploadProgress.querySelector('p');
            if (progressBar) progressBar.style.width = percent + '%';
            if (progressText) progressText.textContent = message;
        }
    }
    
    // 点击上传区域选择图片
    uploadArea.addEventListener('click', () => {
        imageInput.click();
    });
    
    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10');
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            uploadImage(files[0]);
        }
    });
    
    // 选择图片
    imageInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files.length > 0) {
            uploadImage(files[0]);
        }
    });
    
    // 上传图片
    async function uploadImage(file) {
        // 检查文件类型
        const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
        if (!allowedTypes.includes(file.type)) {
            alert('只支持 JPG、PNG、GIF 格式的图片');
            return;
        }
        
        // 检查文件大小（2MB）
        const maxSize = 2 * 1024 * 1024;
        if (file.size > maxSize) {
            alert('文件大小不能超过 2MB');
            return;
        }
        
        createProgressElement();
        updateProgress(0, '准备上传...');
        
        try {
            const formData = new FormData();
            formData.append('file', file);
            
            updateProgress(30, '上传中...');
            
            const response = await fetch('/api/v1/auth/upload', {
                method: 'POST',
                body: formData
            });
            
            updateProgress(80, '处理中...');
            
            const data = await response.json();
            
            if (data.url) {
                imageUrlInput.value = data.url;
                imagePreview.innerHTML = `<img src="${data.url}" style="max-width: 250px; max-height: 250px; object-fit: contain; border-radius: 4px;">`;
                updateProgress(100, '上传成功！');
                setTimeout(() => {
                    removeProgressElement();
                }, 1500);
            } else {
                alert(data.error || '上传失败');
                removeProgressElement();
            }
        } catch (error) {
            console.error('上传错误:', error);
            alert('上传失败：' + error.message);
            removeProgressElement();
        }
    }
    
    // 图片查看功能
    document.addEventListener('DOMContentLoaded', function() {
        const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
        const modalImage = document.getElementById('modalImage');
        
        // 点击缩略图打开大图
        document.querySelectorAll('.product-thumbnail').forEach(thumbnail => {
            thumbnail.addEventListener('click', function() {
                const imageSrc = this.getAttribute('data-src');
                modalImage.src = imageSrc;
                imageModal.show();
            });
        });
        
        // 上传预览中的图片也支持点击查看
        const previewObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.tagName === 'IMG') {
                        node.style.cursor = 'pointer';
                        node.addEventListener('click', function() {
                            modalImage.src = this.src;
                            imageModal.show();
                        });
                    }
                });
            });
        });
        
        if (imagePreview) {
            previewObserver.observe(imagePreview, { childList: true });
        }
    });
    </script>
{% endblock %}
