{% extends 'base.html' %}
{% block content %}
<div class="pod-container">
    <div class="pod-header">
        <div class="pod-header-left">
            <a href="/material/orders" class="pod-back-btn">
                <i class="fas fa-arrow-left"></i>
                返回列表
            </a>
            <div class="pod-title-group">
                <h1 class="pod-title">
                    <i class="fas fa-file-invoice-dollar"></i>
                    采购订单详情
                </h1>
                <p class="pod-subtitle" id="orderNo">加载中...</p>
            </div>
        </div>
        <div class="pod-header-right">
            <button class="pod-btn-print" onclick="printOrder()">
                <i class="fas fa-print"></i>
                <span>打印订单</span>
            </button>
        </div>
    </div>

    <div class="pod-body">
        <div class="pod-main-grid">
            <div class="pod-section">
                <div class="pod-card">
                    <div class="pod-card-header">
                        <div class="pod-card-title-group">
                            <div class="pod-icon-box pod-icon-blue">
                                <i class="fas fa-info-circle"></i>
                            </div>
                            <div>
                                <h3>订单信息</h3>
                                <small>基本信息与状态</small>
                            </div>
                        </div>
                        <span class="pod-status-badge" id="orderStatus">-</span>
                    </div>
                    <div class="pod-card-body">
                        <div class="pod-info-grid" id="orderInfo">
                            <div class="pod-info-skeleton"></div>
                            <div class="pod-info-skeleton"></div>
                            <div class="pod-info-skeleton"></div>
                            <div class="pod-info-skeleton"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pod-section">
                <div class="pod-card">
                    <div class="pod-card-header">
                        <div class="pod-card-title-group">
                            <div class="pod-icon-box pod-icon-green">
                                <i class="fas fa-boxes"></i>
                            </div>
                            <div>
                                <h3>物料清单</h3>
                                <small>采购物料明细</small>
                            </div>
                        </div>
                        <span class="pod-item-count" id="itemCount">0 种</span>
                    </div>
                    <div class="pod-card-body">
                        <div class="pod-materials-table" id="materialsTable">
                            <div class="pod-loading-state">
                                <div class="pod-spinner"></div>
                                <span>加载物料清单...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pod-card pod-remark-card" id="remarkSection" style="display:none;">
            <div class="pod-card-header">
                <div class="pod-card-title-group">
                    <div class="pod-icon-box pod-icon-purple">
                        <i class="fas fa-comment-alt"></i>
                    </div>
                    <div>
                        <h3>备注信息</h3>
                        <small>订单相关说明</small>
                    </div>
                </div>
            </div>
            <div class="pod-card-body">
                <div class="pod-remark-content" id="remarkContent">-</div>
            </div>
        </div>
    </div>
</div>

<div class="pod-print-template" id="printTemplate" style="display:none;">
    <div class="print-page">
        <div class="print-header">
            <div class="print-company">东莞市滨发玩具有限公司</div>
            <div class="print-title">采购订单</div>
            <div class="print-order-no" id="printOrderNo"></div>
        </div>
        <div class="print-info">
            <div class="print-info-row">
                <div class="print-info-item">
                    <span class="print-label">供应商：</span>
                    <span class="print-value" id="printSupplier"></span>
                </div>
                <div class="print-info-item">
                    <span class="print-label">下单日期：</span>
                    <span class="print-value" id="printDate"></span>
                </div>
            </div>
        </div>
        <table class="print-table" id="printTable">
            <thead>
                <tr>
                    <th style="width:40px;">序号</th>
                    <th style="width:120px;">物料编码</th>
                    <th style="width:180px;">物料名称</th>
                    <th style="width:100px;">规格</th>
                    <th style="width:50px;">单位</th>
                    <th style="width:90px;">采购数量</th>
                </tr>
            </thead>
            <tbody id="printTableBody"></tbody>
        </table>
        <div class="print-footer">
            <div class="print-remark" id="printRemark"></div>
            <div class="print-signatures">
                <div class="print-sign-item">
                    <span>制单人：</span>
                    <div class="print-sign-line"></div>
                </div>
                <div class="print-sign-item">
                    <span>审核人：</span>
                    <div class="print-sign-line"></div>
                </div>
                <div class="print-sign-item">
                    <span>供应商确认：</span>
                    <div class="print-sign-line"></div>
                </div>
            </div>
            <div class="print-date">
                <span>打印时间：</span>
                <span id="printTime"></span>
            </div>
        </div>
    </div>
</div>

<style>
:root {
    --pod-blue-50: #E6F7FA;
    --pod-blue-100: #CCEFF5;
    --pod-blue-200: #99D9E8;
    --pod-blue-300: #66C2DB;
    --pod-blue-400: #33ABCD;
    --pod-blue-500: #0094BF;
    --pod-blue-600: #007A9F;
    
    --pod-green-50: #E8F5E9;
    --pod-green-100: #C8E6C9;
    --pod-green-200: #A5D6A7;
    
    --pod-purple-50: #F3E5F5;
    --pod-purple-100: #E1BEE7;
    --pod-purple-200: #CE93D8;
    
    --pod-gray-50: #F8FAFC;
    --pod-gray-100: #F1F5F9;
    --pod-gray-200: #E2E8F0;
    --pod-gray-300: #CBD5E1;
    --pod-gray-400: #94A3B8;
    --pod-gray-500: #64748B;
    --pod-gray-600: #475569;
    --pod-gray-700: #334155;
    --pod-gray-800: #1E293B;
}

.pod-container {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
}

.pod-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding: 24px 28px;
    background: linear-gradient(135deg, var(--pod-blue-50) 0%, #FFFFFF 100%);
    border-radius: 18px;
    border: 2px solid var(--pod-blue-100);
    box-shadow: 0 4px 24px rgba(0, 148, 191, 0.08);
}

.pod-header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.pod-back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: white;
    border: 2px solid var(--pod-blue-200);
    border-radius: 10px;
    color: var(--pod-blue-600);
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: all 0.25s ease;
}

.pod-back-btn:hover {
    background: var(--pod-blue-50);
    border-color: var(--pod-blue-400);
    transform: translateX(-3px);
}

.pod-title-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.pod-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: var(--pod-gray-800);
    margin: 0;
}

.pod-title i {
    color: var(--pod-blue-500);
}

.pod-subtitle {
    font-size: 14px;
    color: var(--pod-gray-500);
    margin: 0;
    font-family: 'Consolas', 'Monaco', monospace;
}

.pod-btn-print {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--pod-blue-500), var(--pod-blue-600));
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(0, 148, 191, 0.25);
}

.pod-btn-print:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 148, 191, 0.35);
}

.pod-body {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.pod-main-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
}

@media (max-width: 1200px) {
    .pod-main-grid {
        grid-template-columns: 1fr;
    }
}

.pod-section {
    display: flex;
    flex-direction: column;
}

.pod-card {
    background: white;
    border-radius: 16px;
    border: 2px solid var(--pod-gray-200);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    overflow: hidden;
}

.pod-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    background: linear-gradient(to bottom, #FAFBFC, #FFFFFF);
    border-bottom: 1px solid var(--pod-gray-200);
}

.pod-card-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.pod-card-title-group h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--pod-gray-800);
    margin: 0;
}

.pod-card-title-group small {
    font-size: 12px;
    color: var(--pod-gray-500);
    display: block;
    margin-top: 2px;
}

.pod-icon-box {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.pod-icon-blue {
    background: linear-gradient(135deg, var(--pod-blue-100), var(--pod-blue-200));
    color: var(--pod-blue-600);
}

.pod-icon-green {
    background: linear-gradient(135deg, var(--pod-green-100), var(--pod-green-200));
    color: #2E7D32;
}

.pod-icon-purple {
    background: linear-gradient(135deg, var(--pod-purple-100), var(--pod-purple-200));
    color: #6A1B9A;
}

.pod-status-badge {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
}

.pod-status-badge.pending {
    background: #FFF3CD;
    color: #856404;
}

.pod-status-badge.completed {
    background: var(--pod-green-100);
    color: #155724;
}

.pod-status-badge.cancelled {
    background: #F8D7DA;
    color: #721C24;
}

.pod-item-count {
    padding: 5px 12px;
    background: var(--pod-blue-500);
    color: white;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
}

.pod-card-body {
    padding: 22px;
}

.pod-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.pod-info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.pod-info-label {
    font-size: 12px;
    color: var(--pod-gray-500);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.pod-info-value {
    font-size: 15px;
    color: var(--pod-gray-800);
    font-weight: 600;
}

.pod-info-skeleton {
    height: 48px;
    background: linear-gradient(90deg, var(--pod-gray-100) 25%, var(--pod-gray-50) 50%, var(--pod-gray-100) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.pod-materials-table {
    overflow-x: auto;
}

.pod-mat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.pod-mat-table th {
    background: var(--pod-gray-50);
    padding: 12px 14px;
    text-align: left;
    font-weight: 700;
    color: var(--pod-gray-600);
    border-bottom: 2px solid var(--pod-gray-200);
    white-space: nowrap;
}

.pod-mat-table td {
    padding: 14px;
    border-bottom: 1px solid var(--pod-gray-100);
    color: var(--pod-gray-700);
}

.pod-mat-table tr:hover td {
    background: var(--pod-blue-50);
}

.pod-mat-name {
    font-weight: 650;
    color: var(--pod-gray-800);
}

.pod-mat-total {
    font-weight: 750;
    color: var(--pod-blue-600);
}

.pod-remark-card {
    margin-top: 0;
}

.pod-remark-content {
    font-size: 14px;
    color: var(--pod-gray-700);
    line-height: 1.6;
    white-space: pre-wrap;
}

.pod-loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--pod-gray-500);
    gap: 14px;
}

.pod-spinner {
    width: 36px;
    height: 36px;
    border: 4px solid var(--pod-gray-200);
    border-top-color: var(--pod-blue-500);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.pod-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--pod-gray-400);
}

.pod-empty-state i {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.25;
}

/* Print Styles */
.pod-print-template {
    position: absolute;
    left: -9999px;
    top: 0;
}

.print-page {
    width: 210mm;
    padding: 15mm;
    background: white;
    font-family: 'Microsoft YaHei', 'SimSun', sans-serif;
    font-size: 12pt;
    color: #000;
}

.print-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #000;
}

.print-company {
    font-size: 18pt;
    font-weight: 700;
    margin-bottom: 8px;
}

.print-title {
    font-size: 16pt;
    font-weight: 700;
    margin-bottom: 8px;
}

.print-order-no {
    font-size: 11pt;
    color: #666;
}

.print-info {
    margin-bottom: 15px;
}

.print-info-row {
    display: flex;
    gap: 40px;
}

.print-info-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.print-label {
    font-weight: 600;
}

.print-value {
    border-bottom: 1px solid #333;
    min-width: 150px;
    padding: 0 8px;
}

.print-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

.print-table th,
.print-table td {
    border: 1px solid #333;
    padding: 8px 6px;
    text-align: center;
}

.print-table th {
    background: #f0f0f0;
    font-weight: 600;
}

.print-table td {
    font-size: 11pt;
}

.print-footer {
    margin-top: 30px;
}

.print-remark {
    margin-bottom: 20px;
    font-size: 11pt;
}

.print-signatures {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.print-sign-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.print-sign-line {
    width: 120px;
    border-bottom: 1px solid #333;
}

.print-date {
    text-align: right;
    font-size: 11pt;
}

@media print {
    body * {
        visibility: hidden;
    }
    
    .pod-print-template,
    .pod-print-template * {
        visibility: visible;
    }
    
    .pod-print-template {
        position: absolute;
        left: 0;
        top: 0;
        display: block !important;
    }
    
    .print-page {
        page-break-after: always;
    }
}
</style>

<script>
let currentOrderId = null;
let orderData = null;

document.addEventListener('DOMContentLoaded', async function() {
    const pathParts = window.location.pathname.split('/');
    currentOrderId = parseInt(pathParts[pathParts.length - 1]);
    
    if (!currentOrderId || isNaN(currentOrderId)) {
        showError('无效的订单ID');
        return;
    }
    
    await loadOrderDetail();
});

async function loadOrderDetail() {
    try {
        const response = await fetch(`/api/v1/purchase-center/orders/${currentOrderId}`);
        
        if (!response.ok) {
            if (response.status === 404) {
                showError('订单不存在');
            } else {
                throw new Error(`HTTP ${response.status}`);
            }
            return;
        }
        
        const result = await response.json();
        
        if (result.success) {
            orderData = result.data;
            renderOrderDetail();
        } else {
            showError(result.error || '加载订单详情失败');
        }
    } catch (error) {
        console.error('Load order detail error:', error);
        showError('网络错误，无法加载订单详情');
    }
}

function renderOrderDetail() {
    document.getElementById('orderNo').textContent = orderData.order_no;
    
    const statusEl = document.getElementById('orderStatus');
    const statusLabels = {
        'pending': '待处理',
        'completed': '已完成',
        'cancelled': '已取消'
    };
    statusEl.textContent = statusLabels[orderData.status] || orderData.status;
    statusEl.className = `pod-status-badge ${orderData.status}`;
    
    document.getElementById('orderInfo').innerHTML = `
        <div class="pod-info-item">
            <span class="pod-info-label">订单编号</span>
            <span class="pod-info-value">${orderData.order_no}</span>
        </div>
        <div class="pod-info-item">
            <span class="pod-info-label">供应商</span>
            <span class="pod-info-value">${orderData.supplier_name || '未指定'}</span>
        </div>
        <div class="pod-info-item">
            <span class="pod-info-label">下单日期</span>
            <span class="pod-info-value">${orderData.order_date || '-'}</span>
        </div>
        <div class="pod-info-item">
            <span class="pod-info-label">创建时间</span>
            <span class="pod-info-value">${orderData.create_time || '-'}</span>
        </div>
    `;
    
    const items = orderData.items || [];
    document.getElementById('itemCount').textContent = `${items.length} 种`;
    
    if (items.length === 0) {
        document.getElementById('materialsTable').innerHTML = `
            <div class="pod-empty-state">
                <i class="fas fa-inbox"></i>
                <p>暂无物料数据</p>
            </div>
        `;
    } else {
        let tableHtml = `
            <table class="pod-mat-table">
                <thead>
                    <tr>
                        <th style="width:50px;">序号</th>
                        <th style="width:100px;">物料编码</th>
                        <th>物料名称</th>
                        <th style="width:100px;">规格</th>
                        <th style="width:60px;">单位</th>
                        <th style="width:100px;">采购数量</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        items.forEach((item, index) => {
            tableHtml += `
                <tr>
                    <td style="text-align:center;">${index + 1}</td>
                    <td>${item.material_code || '-'}</td>
                    <td class="pod-mat-name">${escapeHtml(item.material_name)}</td>
                    <td>${item.specification || '-'}</td>
                    <td style="text-align:center;">${item.unit || '-'}</td>
                    <td class="pod-mat-total" style="text-align:right;">${Number(item.quantity || 0).toFixed(2)}</td>
                </tr>
            `;
        });
        
        tableHtml += '</tbody></table>';
        document.getElementById('materialsTable').innerHTML = tableHtml;
    }
    
    if (orderData.remark) {
        document.getElementById('remarkSection').style.display = 'block';
        document.getElementById('remarkContent').textContent = orderData.remark;
    }
}

function printOrder() {
    if (!orderData) {
        alert('订单数据未加载，无法打印');
        return;
    }
    
    preparePrintTemplate();
    
    window.print();
}

function preparePrintTemplate() {
    const printTemplate = document.getElementById('printTemplate');
    
    document.getElementById('printOrderNo').textContent = `订单编号：${orderData.order_no}`;
    document.getElementById('printSupplier').textContent = orderData.supplier_name || '未指定';
    document.getElementById('printDate').textContent = orderData.order_date || '-';
    
    const items = orderData.items || [];
    let tbodyHtml = '';
    items.forEach((item, index) => {
        tbodyHtml += `
            <tr>
                <td style="text-align:center;">${index + 1}</td>
                <td>${item.material_code || ''}</td>
                <td style="text-align:left;">${escapeHtml(item.material_name)}</td>
                <td>${item.specification || ''}</td>
                <td>${item.unit || ''}</td>
                <td style="font-weight:600;">${Number(item.quantity || 0).toFixed(2)}</td>
            </tr>
        `;
    });
    document.getElementById('printTableBody').innerHTML = tbodyHtml;
    
    document.getElementById('printRemark').textContent = orderData.remark ? `备注：${orderData.remark}` : '';
    
    document.getElementById('printTime').textContent = new Date().toLocaleString('zh-CN');
    
    printTemplate.style.display = 'block';
}

function showError(message) {
    document.querySelector('.pod-body').innerHTML = `
        <div class="pod-empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#E57373;"></i>
            <p style="color:#C62828;">${message}</p>
            <a href="/material/orders" class="pod-back-btn" style="margin-top:20px;">
                <i class="fas fa-arrow-left"></i>
                返回订单列表
            </a>
        </div>
    `;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
