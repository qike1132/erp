{% extends 'base.html' %}

{% block content %}
    <h2>编辑出货记录</h2>
    <div class="card mt-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-edit me-2"></i>编辑出货信息</span>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="customer" class="form-label">客户名称</label>
                            <select class="form-select" id="customer" name="customer" required>
                                <option value="">请选择客户</option>
                                {% for c in customers %}
                                <option value="{{ c.name }}" {{ 'selected' if stockout.customer == c.name else '' }}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="stockout_date" class="form-label">出货时间</label>
                            <input type="date" class="form-control" id="stockout_date" name="stockout_date" value="{{ stockout.stockout_date.strftime('%Y-%m-%d') }}">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="stockout_no" class="form-label">出货编号</label>
                            <input type="text" class="form-control" id="stockout_no" name="stockout_no" value="{{ stockout.stockout_no }}" required placeholder="例如：STK-OUT-2025001">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="quantity" class="form-label">出货数量</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ stockout.quantity }}" min="1" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="product_id" class="form-label">产品</label>
                            <select class="form-select" id="product_id" name="product_id" required>
                                <option value="">请选择产品</option>
                                {% for product in products %}
                                    <option value="{{ product.id }}" {{ 'selected' if product.id == stockout.product_id else '' }}>{{ product.name }} - 当前库存：{{ product.current_stock }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="note" class="form-label">备注</label>
                            <textarea class="form-control" id="note" name="note" rows="2" placeholder="例如：批量出货">{{ stockout.note }}</textarea>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>保存修改</button>
                <a href="{{ url_for('stock.stockouts') }}" class="btn btn-secondary"><i class="fas fa-times me-1"></i>取消</a>
            </form>
        </div>
    </div>
{% endblock %}
