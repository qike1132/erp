{% extends 'base.html' %}

{% block content %}
    <h2>编辑用户</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">新密码（留空则不修改）</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="留空则不修改密码">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="is_super" name="is_super" {{ 'checked' if user.is_super else '' }}>
                    <label class="form-check-label" for="is_super">超级用户</label>
                </div>
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a href="/user/list" class="btn btn-secondary">取消</a>
            </form>
        </div>
    </div>
{% endblock %}
