{% extends 'base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="/static/purchase-center.css">
{% endblock %}
{% block content %}
<div class="pc-container">
    <div class="pc-header">
        <div class="pc-header-content">
            <div class="pc-header-left">
                <h1><i class="fas fa-store"></i> 采购中心</h1>
                <p>用料计算 · 采购订单</p>
            </div>
        </div>
    </div>

    <div class="pc-body">
        <div class="pc-tabs">
            <button class="pc-tab active" data-tab="orders" onclick="switchTab('orders')">
                <i class="fas fa-file-invoice-dollar"></i> 采购订单
                <span class="badge-count" id="unprocessedBadge">0</span>
            </button>
            <button class="pc-tab" data-tab="history" onclick="switchTab('history')">
                <i class="fas fa-check-circle"></i> 下单查询
            </button>
        </div>

        <!-- 采购订单面板（合并后：待采购 + 采购中） -->
        <div class="pc-panel active" id="panel-orders">
            <!-- 上区：审核订单（原待采购订单） -->
            <div class="pc-card pc-pending-section" id="pending-purchase-section">
                <div class="pc-card-header">
                    <div class="pc-card-title"><i class="fas fa-inbox"></i> 审核订单</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                        <button class="pc-btn pc-btn-success pc-btn-sm" id="btnOneClickGenerate" onclick="oneClickGenerateOrder()" disabled style="background: linear-gradient(135deg, #28C76F 0%, #1E9E55 100%); border: none; box-shadow: 0 2px 8px rgba(40,199,111,0.3);">
                            <i class="fas fa-magic"></i> 一键审核订单 <span id="oneClickCount">(0)</span>
                        </button>
                    </div>
                </div>
                <div class="pc-card-body">
                    <div id="unprocessedList">
                        <div class="pc-loading"><div class="spinner"></div> 加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 分隔线 -->
            <div class="pc-section-divider"></div>

            <!-- 下区：采购中订单 -->
            <div class="pc-card">
                <div class="pc-card-header">
                    <div class="pc-card-title"><i class="fas fa-list"></i> 采购中订单</div>
                    <div style="display:flex;gap:6px;">
                        <button class="pc-btn pc-btn-primary" id="btnSummaryOrder" onclick="processSummaryOrder()" disabled style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;">
                            <i class="fas fa-clipboard-list"></i> 汇总下单 <span id="summaryOrderCount">(0)</span>
                        </button>
                        <button class="pc-btn pc-btn-success pc-btn-sm" id="btnBatchComplete" onclick="batchCompleteOrders()" disabled>
                            <i class="fas fa-check-double"></i> 批量确认订单 <span id="batchCompleteCount">(0)</span>
                        </button>
                        <span class="pc-badge pc-badge-pending" id="orderTotalBadge">0 个订单</span>
                    </div>
                </div>
                <div class="pc-card-body">
                    <div id="orderList">
                        <div class="pc-loading"><div class="spinner"></div> 加载中...</div>
                    </div>
                    <div class="pc-pagination" id="orderPagination"></div>
                </div>
            </div>
        </div>

        <!-- 下单查询面板 -->
        <div class="pc-panel" id="panel-history">
            <div class="pc-card">
                <div class="pc-card-header">
                    <div class="pc-card-title"><i class="fas fa-check-circle"></i> 下单查询</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                        <button class="pc-btn pc-btn-outline pc-btn-sm" onclick="toggleHistoryFilterPanel()">
                            <i class="fas fa-filter"></i> <span id="historyFilterToggleText">展开筛选</span>
                        </button>
                        <button class="pc-btn pc-btn-primary pc-btn-sm" onclick="exportCompletedOrders()">
                            <i class="fas fa-file-excel"></i> 导出
                        </button>
                    </div>
                </div>
                
                <!-- 快捷筛选栏 -->
                <div class="pc-card-body" style="padding-bottom:0;">
                    <div id="historyQuickFilters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                    </div>
                </div>
                
                <!-- 高级筛选折叠面板 -->
                <div id="historyFilterPanel" style="display:none;">
                    <div class="pc-card-body" style="padding-top:0;">
                        <div class="pc-grid pc-grid-2" style="gap:16px;">
                            <!-- 基本条件 -->
                            <div class="pc-card" style="margin-bottom:0;">
                                <div class="pc-card-header" style="padding:12px 16px;">
                                    <div class="pc-card-title" style="font-size:14px;"><i class="fas fa-info-circle"></i> 基本条件</div>
                                </div>
                                <div class="pc-card-body" style="padding:16px;">
                                    <div class="pc-grid pc-grid-2" style="gap:12px;">
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">订单号</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-search"></i>
                                                <input type="text" class="pc-form-input" id="completedOrderNo" placeholder="输入订单号" autocomplete="off">
                                                <div class="autocomplete-dropdown" id="autocomplete-order_no" style="display:none;"></div>
                                            </div>
                                        </div>
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">客户名称</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-search"></i>
                                                <input type="text" class="pc-form-input" id="completedCustomer" placeholder="输入客户名称" autocomplete="off">
                                                <div class="autocomplete-dropdown" id="autocomplete-customer_name" style="display:none;"></div>
                                            </div>
                                        </div>
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">产品名称</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-search"></i>
                                                <input type="text" class="pc-form-input" id="completedProduct" placeholder="输入产品名称" autocomplete="off">
                                                <div class="autocomplete-dropdown" id="autocomplete-product_name" style="display:none;"></div>
                                            </div>
                                        </div>
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">供应商名称</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-search"></i>
                                                <input type="text" class="pc-form-input" id="completedSupplier" placeholder="输入供应商名称" autocomplete="off">
                                                <div class="autocomplete-dropdown" id="autocomplete-supplier_name" style="display:none;"></div>
                                            </div>
                                        </div>
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">69码</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-barcode"></i>
                                                <input type="text" class="pc-form-input" id="completedBarcode" placeholder="输入69码查询对应SKU" autocomplete="off">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 时间和物料条件 -->
                            <div class="pc-card" style="margin-bottom:0;">
                                <div class="pc-card-header" style="padding:12px 16px;">
                                    <div class="pc-card-title" style="font-size:14px;"><i class="fas fa-calendar-alt"></i> 时间与物料</div>
                                </div>
                                <div class="pc-card-body" style="padding:16px;">
                                    <div class="pc-grid pc-grid-2" style="gap:12px;">
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">开始日期</label>
                                            <input type="date" class="pc-form-input" id="completedStartDate">
                                        </div>
                                        <div class="pc-form-group">
                                            <label class="pc-form-label">结束日期</label>
                                            <input type="date" class="pc-form-input" id="completedEndDate">
                                        </div>
                                        <div class="pc-form-group" style="grid-column:1 / -1;">
                                            <label class="pc-form-label">物料名称</label>
                                            <div class="pc-search-input-wrapper">
                                                <i class="fas fa-search"></i>
                                                <input type="text" class="pc-form-input" id="completedMaterial" placeholder="输入物料名称" autocomplete="off">
                                                <div class="autocomplete-dropdown" id="autocomplete-material_name" style="display:none;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 操作按钮 -->
                        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
                            <button class="pc-btn pc-btn-outline" onclick="resetCompletedFilters()">
                                <i class="fas fa-redo"></i> 重置
                            </button>
                            <button class="pc-btn pc-btn-primary" onclick="filterCompletedOrders()">
                                <i class="fas fa-search"></i> 查询
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 查询结果区域 -->
                <div class="pc-card-body" style="padding-top:0;">
                    <div id="completedOrderList" style="min-height:200px;">
                        <div class="pc-loading"><div class="spinner"></div> 加载中...</div>
                    </div>
                    <div class="pc-pagination" id="completedOrderPagination"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 确认弹窗 -->
<div class="pc-modal-overlay pc-confirm-dialog" id="confirmModal">
    <div class="pc-modal">
        <div class="pc-modal-body" style="padding:32px;">
            <div class="pc-confirm-icon" id="confirmIcon"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="pc-confirm-text" id="confirmText"></div>
            <div class="pc-confirm-sub" id="confirmSub"></div>
        </div>
        <div class="pc-modal-footer">
            <button class="pc-btn pc-btn-outline" onclick="closeConfirm(false)">取消</button>
            <button class="pc-btn pc-btn-danger" id="confirmBtn" onclick="closeConfirm(true)">确认</button>
        </div>
    </div>
</div>

<!-- 订单详情弹窗 -->
<div class="pc-modal-overlay" id="orderDetailModal">
    <div class="pc-modal" style="max-width:800px;">
        <div class="pc-modal-header">
            <h3><i class="fas fa-file-invoice-dollar"></i> 采购订单详情</h3>
            <button class="pc-modal-close" onclick="closeModal('orderDetailModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="pc-modal-body" id="orderDetailContent"></div>
        <div class="pc-modal-footer">
            <button class="pc-btn pc-btn-outline" onclick="closeModal('orderDetailModal')">关闭</button>
        </div>
    </div>
</div>

<!-- 导出预览确认弹窗 -->
<div class="pc-modal-overlay" id="exportPreviewModal">
    <div class="pc-modal" style="max-width:1100px;">
        <div class="pc-modal-header">
            <h3><i class="fas fa-file-excel"></i> 导出格式预览</h3>
            <button class="pc-modal-close" onclick="closeModal('exportPreviewModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="pc-modal-body" style="padding:0;">
            <div id="exportPreviewContent"></div>
        </div>
        <div class="pc-modal-footer" style="justify-content:space-between;">
            <div style="font-size:12px;color:var(--pc-text-secondary);">
                <i class="fas fa-info-circle"></i> 请确认以下导出格式是否符合预期
            </div>
            <div style="display:flex;gap:8px;">
                <button class="pc-btn pc-btn-outline" onclick="closeModal('exportPreviewModal')">取消</button>
                <button class="pc-btn pc-btn-success" id="confirmExportBtn" onclick="confirmExportFromPreview()">
                    <i class="fas fa-download"></i> 确认导出
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 汇总打印弹窗（复用，工厂/供应商汇总共用） -->
<div class="pc-modal-overlay" id="statusHistoryModal">
    <div class="pc-modal" style="max-width:1000px;">
        <div class="pc-modal-header">
            <h3><i class="fas fa-history"></i> 订单汇总</h3>
            <button class="pc-modal-close" onclick="closeModal('statusHistoryModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="pc-modal-body">
            <div id="statusHistoryContent">
                <div class="pc-loading"><div class="spinner"></div> 加载中...</div>
            </div>
        </div>
    </div>
</div>

<script src="/static/purchase-center.js"></script>
{% endblock %}
