<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Binfa ERP · 数据看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Binfa ERP Dashboard - Design System
     Pattern: Enterprise Gateway
     Style: Data-Dense Dashboard
     Stack: HTML-Tailwind (APK-ready for React Native migration)
     ============================================================ */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* === Primary: Navy Blue - Enterprise reliability === */
    --primary-50: #EFF6FF;
    --primary-100: #DBEAFE;
    --primary-200: #BFDBFE;
    --primary-300: #93C5FD;
    --primary-400: #60A5FA;
    --primary-500: #3B82F6;
    --primary-600: #2563EB;
    --primary-700: #1D4ED8;
    --primary-800: #1E40AF;
    --primary-900: #1E3A8A;

    /* === Semantic Colors === */
    --success-50: #ECFDF5;
    --success-100: #D1FAE5;
    --success-500: #10B981;
    --success-600: #059669;
    --warning-50: #FFFBEB;
    --warning-100: #FEF3C7;
    --warning-500: #F59E0B;
    --warning-600: #D97706;
    --danger-50: #FEF2F2;
    --danger-100: #FEE2E2;
    --danger-500: #EF4444;
    --danger-600: #DC2626;
    --info-50: #ECFEFF;
    --info-500: #06B6D4;

    /* === Neutral Scale === */
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-400: #94A3B8;
    --gray-500: #64748B;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1E293B;
    --gray-900: #0F172A;

    /* === Surface Colors === */
    --bg-deep: #F1F5F9;
    --bg-surface: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-grouped: #F8FAFC;
    --bg-overlay: rgba(15, 23, 42, 0.45);

    /* === Text Colors - WCAG 2.1 AA compliant === */
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-tertiary: #64748B;
    --text-quaternary: #94A3B8;
    --text-inverse: #FFFFFF;

    /* === Border === */
    --border-subtle: rgba(148, 163, 184, 0.15);
    --border-default: rgba(148, 163, 184, 0.25);
    --border-active: rgba(59, 130, 246, 0.4);

    /* === Accent === */
    --accent-primary: #1E40AF;
    --accent-secondary: #3B82F6;
    --accent-tertiary: #60A5FA;
    --accent-glow: rgba(30, 64, 175, 0.08);

    /* === Chart Colors === */
    --chart-1: #1E40AF;
    --chart-2: #3B82F6;
    --chart-3: #60A5FA;
    --chart-4: #93C5FD;
    --chart-5: #BFDBFE;
    --chart-success: #10B981;
    --chart-warning: #F59E0B;
    --chart-danger: #EF4444;

    /* === Radius === */
    --radius-xs: 8px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --radius-xl: 24px;
    --radius-full: 9999px;

    /* === Shadows - Layered for depth === */
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.03);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.06), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
    --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
    --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
    --shadow-card-hover: 0 4px 12px rgba(15, 23, 42, 0.06), 0 2px 4px rgba(15, 23, 42, 0.03);
    --shadow-accent: 0 4px 14px rgba(30, 64, 175, 0.18);
    --shadow-drawer: 0 -4px 24px rgba(15, 23, 42, 0.12);

    /* === Transitions === */
    --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
    --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

    /* === Spacing Scale === */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* === Typography Scale === */
    --text-xs: 11px;
    --text-sm: 12px;
    --text-base: 13px;
    --text-md: 14px;
    --text-lg: 15px;
    --text-xl: 17px;
    --text-2xl: 20px;
    --text-3xl: 24px;
    --text-4xl: 28px;

    /* === Touch Target === */
    --touch-min: 44px;
  }

  html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* ============================================================
     Phone Frame - Mobile Simulation
     ============================================================ */
  .phone-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
  }

  .phone-frame {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 932px;
    background: var(--bg-surface);
    border-radius: 44px;
    overflow: hidden;
    box-shadow:
      0 0 0 0.5px rgba(15, 23, 42, 0.06),
      var(--shadow-xl);
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 430px) {
    .phone-wrapper { padding: 0; }
    .phone-frame {
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }

  /* ============================================================
     Status Bar
     ============================================================ */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 6px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    flex-shrink: 0;
    letter-spacing: -0.2px;
  }

  .status-bar .time { font-weight: 700; }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; fill: currentColor; }

  /* ============================================================
     Notch
     ============================================================ */
  .notch-area {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
    margin-top: -2px;
  }
  .notch {
    width: 126px;
    height: 28px;
    background: #0F172A;
    border-radius: 0 0 18px 18px;
    position: relative;
  }
  .notch::after {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    background: #1E293B;
    border-radius: 50%;
  }

  /* ============================================================
     App Header
     ============================================================ */
  .app-header {
    padding: var(--space-3) var(--space-5) var(--space-2);
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(255,255,255,0.95) 100%);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-1);
  }

  .header-greeting {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .header-title {
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    font-size: var(--text-4xl);
    font-weight: 800;
    letter-spacing: -0.6px;
    color: var(--text-primary);
    margin-top: 2px;
    line-height: 1.2;
  }

  .header-title .accent { color: var(--accent-primary); }

  .header-sub {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
    font-weight: 500;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-sub .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success-500);
    display: inline-block;
    animation: pulse-dot 2s ease-in-out infinite;
    box-shadow: 0 0 4px rgba(16, 185, 129, 0.3);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .header-actions {
    display: flex;
    gap: var(--space-2);
    align-items: center;
  }

  .header-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--bg-grouped);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s var(--ease-smooth);
    color: var(--text-secondary);
    min-width: var(--touch-min);
    min-height: var(--touch-min);
  }

  .header-btn:hover {
    background: var(--gray-100);
    border-color: var(--border-default);
  }

  .header-btn:active { transform: scale(0.92); }
  .header-btn svg { width: 18px; height: 18px; }

  /* ============================================================
     Scroll Content
     ============================================================ */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-1) var(--space-4) var(--space-6);
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .scroll-content::-webkit-scrollbar { width: 3px; }
  .scroll-content::-webkit-scrollbar-track { background: transparent; }
  .scroll-content::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 10px; }

  /* ============================================================
     Refresh Bar
     ============================================================ */
  .refresh-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-1) 0 var(--space-3);
    font-size: var(--text-xs);
    color: var(--text-quaternary);
    font-weight: 500;
  }

  .refresh-left { display: flex; align-items: center; gap: 10px; }

  .sync-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    transition: all 0.3s var(--ease-smooth);
    letter-spacing: 0.2px;
  }

  .sync-status::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }

  .sync-status-connected {
    background: var(--success-50);
    color: var(--success-500);
  }
  .sync-status-connected::before {
    background: var(--success-500);
    animation: syncPulse 2s ease-in-out infinite;
  }

  .sync-status-connecting {
    background: var(--primary-50);
    color: var(--primary-500);
  }
  .sync-status-connecting::before {
    background: var(--primary-500);
    animation: syncBounce 1s ease-in-out infinite;
  }

  .sync-status-disconnected {
    background: var(--danger-50);
    color: var(--danger-500);
  }
  .sync-status-disconnected::before { background: var(--danger-500); }

  @keyframes syncPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  @keyframes syncBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.4); }
  }

  /* ============================================================
     Section Label
     ============================================================ */
  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-4) var(--space-1) var(--space-2);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }

  .section-label-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label .bar {
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
  }

  .section-action {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--accent-secondary);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .section-action:hover { background: var(--primary-50); }

  /* ============================================================
     Cards
     ============================================================ */
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
    position: relative;
    overflow: hidden;
    transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-smooth);
    cursor: default;
    opacity: 0;
    transform: translateY(16px) scale(0.97);
    box-shadow: var(--shadow-card);
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .card:hover {
    box-shadow: var(--shadow-card-hover);
  }

  .card.clickable { cursor: pointer; }
  .card.clickable:hover { transform: translateY(-2px) scale(1.01); }
  .card.clickable:active { transform: scale(0.98); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: var(--space-3);
  }

  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary-50), var(--primary-100));
    color: var(--accent-primary);
  }

  .card-icon svg { width: 20px; height: 20px; }

  .card-title {
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }

  .card-badge {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card-badge-live {
    background: var(--success-50);
    color: var(--success-500);
  }

  .card-badge-err {
    background: var(--danger-50);
    color: var(--danger-500);
  }

  /* ============================================================
     KPI Cards Grid
     ============================================================ */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }

  .kpi-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.4s var(--ease-spring);
    box-shadow: var(--shadow-card);
  }

  .kpi-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .kpi-card:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }

  .kpi-card-primary::before { background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); }
  .kpi-card-success::before { background: linear-gradient(90deg, var(--success-500), #34D399); }
  .kpi-card-warning::before { background: linear-gradient(90deg, var(--warning-500), #FBBF24); }
  .kpi-card-info::before { background: linear-gradient(90deg, var(--info-500), #22D3EE); }

  .kpi-label {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--text-quaternary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: var(--space-2);
  }

  .kpi-value {
    font-family: 'JetBrains Mono', 'Inter', sans-serif;
    font-size: var(--text-3xl);
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .kpi-value.primary { color: var(--accent-primary); }
  .kpi-value.success { color: var(--success-500); }
  .kpi-value.warning { color: var(--warning-500); }

  .kpi-change {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: var(--text-xs);
    font-weight: 600;
    margin-top: var(--space-1);
    padding: 2px 6px;
    border-radius: var(--radius-full);
  }

  .kpi-change.up {
    color: var(--success-500);
    background: var(--success-50);
  }

  .kpi-change.down {
    color: var(--danger-500);
    background: var(--danger-50);
  }

  .kpi-change svg { width: 10px; height: 10px; }

  /* ============================================================
     Charts
     ============================================================ */
  .chart-container {
    position: relative;
    width: 100%;
    height: 180px;
    margin-top: var(--space-2);
  }

  .chart-legend {
    display: flex;
    gap: var(--space-3);
    margin-top: var(--space-2);
    flex-wrap: wrap;
  }

  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: var(--text-xs);
    font-weight: 500;
    color: var(--text-tertiary);
  }

  .chart-legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ============================================================
     Inventory Grid (Order Overview)
     ============================================================ */
  .inventory-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .inventory-block {
    background: var(--bg-grouped);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: var(--space-4);
    text-align: center;
    transition: all 0.3s var(--ease-spring);
  }

  .inventory-block:hover {
    transform: scale(1.02);
    box-shadow: var(--shadow-sm);
  }

  .inventory-label {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
    font-weight: 600;
    margin-bottom: var(--space-2);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .inventory-value {
    font-family: 'JetBrains Mono', 'Inter', sans-serif;
    font-size: var(--text-2xl);
    font-weight: 800;
    color: var(--accent-primary);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  /* ============================================================
     Stock Card
     ============================================================ */
  .stock-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .stock-section { margin-bottom: var(--space-3); }
  .stock-section:last-child { margin-bottom: 0; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: var(--space-2);
  }

  .section-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-primary);
  }

  .stock-package {
    background: var(--bg-grouped);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .stock-metric {
    background: var(--bg-surface);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    position: relative;
    border: 1px solid var(--border-subtle);
    min-height: 64px;
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s;
  }

  .stock-metric:hover {
    transform: scale(1.02);
    box-shadow: var(--shadow-sm);
  }

  .metric-label {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
    font-weight: 600;
    margin-bottom: var(--space-2);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .metric-value {
    font-family: 'JetBrains Mono', 'Inter', sans-serif;
    font-size: var(--text-2xl);
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.2;
    word-wrap: normal;
    white-space: nowrap;
    color: var(--text-primary);
  }

  .metric-value.primary { color: var(--accent-primary); }

  .metric-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--text-xs);
    font-weight: 500;
    color: var(--text-quaternary);
    margin-top: 2px;
  }

  /* ============================================================
     Production Card
     ============================================================ */
  .prod-total-row {
    display: flex;

<script>
  // ============================================================
  // Binfa ERP Dashboard - JavaScript
  // Architecture: Component-based (Vue-ready for migration)
  // ============================================================

  // === Configuration ===
  const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? ''
    : 'http://192.168.0.95:5002';
  const API_V1 = API_BASE + '/api/v1';
  const WS_BASE = API_BASE ? 'ws://192.168.0.95:5002' : 'ws://' + window.location.host;

  // === State Management (Vue Pinia-ready) ===
  const store = {
    auth: {
      token: localStorage.getItem('token') || '',
      csrf: localStorage.getItem('csrf_token') || ''
    },
    dashboard: {
      overview: null,
      loading: false,
      lastUpdate: null
    },
    sync: {
      wsConnected: false,
      pollTimer: null
    }
  };

  // === Helpers ===
  function fmtNum(n) {
    if (n === null || n === undefined) return '--';
    if (typeof n === 'number') return n.toLocaleString('zh-CN');
    return String(n);
  }

  function fmtMoney(n) {
    if (n === null || n === undefined) return '--';
    if (typeof n === 'number') {
      if (Math.abs(n) >= 10000) return '¥' + n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
      return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    return String(n);
  }

  function updateTime() {
    const now = new Date();
    document.getElementById('statusTime').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const hour = now.getHours();
    let greeting = '早上好';
    if (hour >= 12 && hour < 14) greeting = '中午好';
    else if (hour >= 14 && hour < 18) greeting = '下午好';
    else if (hour >= 18) greeting = '晚上好';
    const el = document.getElementById('headerGreeting');
    if (el) el.textContent = greeting;
  }
  updateTime();
  setInterval(updateTime, 10000);

  // === Counter Animation ===
  function animateCounter(el, target, formatter, duration) {
    if (!el) return;
    if (duration === undefined) duration = 800;
    const current = parseFloat(el.textContent.replace(/[^0-9.\-]/g, '')) || 0;
    const targetNum = typeof target === 'number' ? target : (parseFloat(String(target || '0').replace(/[^0-9.\-]/g, '')) || 0);
    if (Math.abs(current - targetNum) < 0.01) { el.textContent = formatter(targetNum); return; }
    const diff = targetNum - current;
    const startTime = performance.now();
    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatter(current + diff * eased);
      if (progress < 1) requestAnimationFrame(tick);
      else el.textContent = formatter(targetNum);
    }
    requestAnimationFrame(tick);
  }

  // === Chart Drawing ===
  function drawTrendChart(canvas, data) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    const pad = { top: 10, right: 10, bottom: 30, left: 40 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;
    if (!data || data.length < 2) return;
    const values = data.map(d => d.value);
    const maxVal = Math.max(...values) * 1.1;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.top + (ch / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    }
    const stepX = cw / (data.length - 1);
    const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
    grad.addColorStop(0, 'rgba(30, 64, 175, 0.12)');
    grad.addColorStop(1, 'rgba(30, 64, 175, 0.01)');
    ctx.beginPath(); ctx.moveTo(pad.left, h - pad.bottom);
    data.forEach((d, i) => {
      const x = pad.left + i * stepX;
      const y = pad.top + ch - (d.value / maxVal) * ch;
      if (i === 0) ctx.lineTo(x, y);
      else {
        const px = pad.left + (i - 1) * stepX;
        const py = pad.top + ch - (data[i-1].value / maxVal) * ch;
        const cpx = (px + x) / 2;
        ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
      }
    });
    ctx.lineTo(w - pad.right, h - pad.bottom); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    data.forEach((d, i) => {
      const x = pad.left + i * stepX;
      const y = pad.top + ch - (d.value / maxVal) * ch;
      if (i === 0) ctx.moveTo(x, y);
      else {
        const px = pad.left + (i - 1) * stepX;
        const py = pad.top + ch - (data[i-1].value / maxVal) * ch;
        const cpx = (px + x) / 2;
        ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
      }
    });
    ctx.strokeStyle = '#1E40AF'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    data.forEach((d, i) => {
      const x = pad.left + i * stepX;
      const y = pad.top + ch - (d.value / maxVal) * ch;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.strokeStyle = '#1E40AF'; ctx.lineWidth = 2; ctx.stroke();
    });
    ctx.fillStyle = '#94A3B8'; ctx.font = '500 10px Inter, sans-serif'; ctx.textAlign = 'center';
    data.forEach((d, i) => {
      if (i % Math.ceil(data.length / 6) === 0 || i === data.length - 1) {
        ctx.fillText(d.label, pad.left + i * stepX, h - 8);
      }
    });
    ctx.textAlign = 'right'; ctx.fillStyle = '#94A3B8';
    for (let i = 0; i <= 4; i++) {
      const val = Math.round((maxVal / 4) * (4 - i));
      ctx.fillText(val >= 10000 ? (val/10000).toFixed(1) + '万' : String(val), pad.left - 6, pad.top + (ch / 4) * i + 3);
    }
  }

  // === API ===
  async function fetchWithTimeout(url, timeout, headers, forceFresh) {
    if (timeout === undefined) timeout = 6000;
    if (headers === undefined) headers = {};
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      let finalUrl = url;
      if (forceFresh) finalUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
      const mergedHeaders = { ...headers, 'Cache-Control': 'no-cache, no-store, must-revalidate' };
      const token = store.auth.token;
      const csrf = store.auth.csrf;
      if (token) mergedHeaders['Authorization'] = 'Bearer ' + token;
      if (csrf) mergedHeaders['X-CSRF-Token'] = csrf;
      const res = await fetch(finalUrl, { signal: controller.signal, mode: 'cors', headers: mergedHeaders });
      clearTimeout(timer);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem('token'); localStorage.removeItem('csrf_token');
        store.auth.token = ''; store.auth.csrf = '';
        alert('登录已过期，请重新登录');
        throw new Error('AUTH_EXPIRED');
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  // === Load Data ===
  async function loadDashboardData() {
    const lastUpdateEl = document.getElementById('lastUpdate');
    if (lastUpdateEl) lastUpdateEl.textContent = '正在加载...';
    try {
      const data = await fetchWithTimeout(API_V1 + '/dashboard/mobile', 8000, {}, true);
      if (!data || !data.success || !data.data) throw new Error('invalid response');
      const d = data.data;
      store.dashboard.overview = d;
      store.dashboard.lastUpdate = new Date();

      // Update KPIs
      if (d.orders) {
        animateCounter(document.getElementById('kpiOrdersValue'), d.orders.total_qty || 0, fmtNum);
        animateCounter(document.getElementById('kpiRevenueValue'), d.orders.total_amount || 0, fmtMoney);
      }
      if (d.production) {
        animateCounter(document.getElementById('kpiProductionValue'), d.production.total_output || 0, fmtNum);
      }
      if (d.warehouse) {
        const ratio = d.warehouse.in_qty > 0 ? Math.round((d.warehouse.out_qty / d.warehouse.in_qty) * 100) : 0;
        document.getElementById('kpiWarehouseValue').textContent = ratio + '%';
        document.getElementById('kpiWarehouseProgress').style.width = Math.min(ratio, 100) + '%';
      }

      // Draw chart
      const canvas = document.getElementById('trendCanvas');
      if (canvas) {
        const trendData = d.trend || [
          { label: '周一', value: 120 }, { label: '周二', value: 180 },
          { label: '周三', value: 150 }, { label: '周四', value: 220 },
          { label: '周五', value: 280 }, { label: '周六', value: 200 },
          { label: '周日', value: 250 }
        ];
        drawTrendChart(canvas, trendData);
      }

      if (lastUpdateEl) {
        const now = new Date();
        lastUpdateEl.textContent = '更新于 ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      }
      document.getElementById('syncStatus').className = 'sync-status sync-status-connected';
      document.getElementById('syncStatus').textContent = '已连接';
      document.getElementById('connStatusText').textContent = '数据实时同步中';
    } catch (e) {
      console.warn('[Dashboard] 加载失败:', e.message);
      if (lastUpdateEl) lastUpdateEl.textContent = '数据加载失败';
      document.getElementById('syncStatus').className = 'sync-status sync-status-disconnected';
      document.getElementById('syncStatus').textContent = '已断开';
      document.getElementById('connStatusText').textContent = '同步已断开';
    }
  }

  // === Reveal Cards ===
  function revealCards() {
    document.querySelectorAll('.card, .kpi-card').forEach((card, i) => {
      setTimeout(() => card.classList.add('visible'), 60 + i * 50);
    });
  }

  // === Refresh ===
  function refreshAll() {
    const btn = document.querySelector('.header-btn');
    if (btn) {
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
      setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 600);
    }
    loadDashboardData();
  }

  // === Page Switch ===
  function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const pageEl = document.getElementById('page-' + page);
    if (pageEl) pageEl.classList.add('active');
    const navEl = document.querySelector('.nav-item[data-page="' + page + '"]');
    if (navEl) navEl.classList.add('active');
  }

  // === Init ===
  function init() {
    updateTime();
    loadDashboardData();
    setTimeout(revealCards, 200);
    // Polling
    store.sync.pollTimer = setInterval(() => {
      if (!document.hidden) loadDashboardData();
    }, 30000);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadDashboardData();
  });

  init();
</script>
