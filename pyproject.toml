# ============================================================
# 本文件只承载「代码质量门禁」的阈值配置。
#
# ⚠️ 它刻意**不包含** [build-system] / [project]：
#    - 依赖管理的唯一来源仍是 requirements/*.txt（见 requirements.txt 的分拆说明）
#    - 本文件不参与打包，不改变 pip 的依赖解析行为
#    - pytest 配置在 pytest.ini（优先于本文件），ruff 在 ruff.toml，mypy 在 mypy.ini
#
# 阈值被 scripts/quality_gate.py 读取；缺失时回落到脚本内置默认值。
# 任务来源：.codeartsdoer/specs/code_quality_opt/tasks.md 1.2
# ============================================================

[tool.code-quality]
# 单个函数/方法最大有效行数（剔除空行与纯注释行）
max_function_length = 80

# 单个 .vue 组件最大行数
max_vue_component_length = 400

# 单个 .py 文件最大行数（由 scripts/file_size_gate.py 使用，仅对 git 变更文件生效）
# 定档依据：受扫描的 777 个 .py 中仅 2 个超过 1200
# （test_purchase_center.py 1497、recovery_test_service.py 1353），1200 会让这两处
# 存量文件一旦被改动就阻断提交。1600 仍能拦住新增的上帝类。
# 本值是唯一来源：file_size_gate.py 与 CI 均从此处读取，不再各自硬编码。
max_file_size = 1600

# ------------------------------------------------------------
# pip-audit 豁免清单（P0-11 ④）
#
# 每条豁免必须回答三个问题：豁免哪个漏洞（id）、为什么能豁免（reason）、
# 最迟到什么时候必须处理掉（expires，ISO 日期）。由 scripts/quality_gate.py 的
# pip_audit 门禁校验，判定规则：
#   - 缺 id / 缺 reason / expires 非 ISO 日期 / id 重复 → 失败；
#   - expires 已过期 → 失败；expires 距今超过 pip_audit_max_days → 失败
#     （不允许用远期日期变相永久豁免）；
#   - 僵尸条目（当前漏洞库里匹配不到该 id）→ 失败：漏洞已消失/依赖已升级，
#     豁免必须删掉。该判定需要漏洞库数据，CI 用 --audit-report 传入现场
#     `pip-audit --format json` 的结果；本地无数据时门禁会如实 WARN 并跳过。
#   - 门禁同时打印豁免条数与 ≤30 天内即将到期的条目。
#
# 当前清单为**空**。172 条的历史口径（de963b00 查明）：其中 151 条属系统 python
# 的 AI 工具依赖（非本项目暴露面），venv 真实暴露面 21 条（PyJWT 13 + pip 8）已于
# 2026-10-02 升级清零并复扫通过；2026-10-11 复扫 venv 全量（= 锁内容）仍为 0 漏洞，
# CI 该步骤已恢复判定（见 .github/workflows/ci-cd.yml）。机制本身由
# `python scripts/quality_gate.py --self-test --only pip_audit` 用合成 fixture 证明。
#
# 新增条目的写法（示例，勿直接启用）：
#   [[tool.code-quality.pip-audit-ignores]]
#   id = "PYSEC-2025-00001"
#   reason = "上游修复版未发布，已在该服务入口做输入校验（跟踪 INC-1234）"
#   expires = "2026-12-31"
# ------------------------------------------------------------
