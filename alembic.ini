# Alembic configuration (added 2026-09-30)
#
# Background: this repository previously had NO alembic.ini. Migrations could only
# be run by hand-building a Config object
#   Config(); cfg.set_main_option('script_location', 'migrations')
# so the two most common commands, `alembic current` and `alembic upgrade head`,
# were documented but not actually usable. This file closes that gap.
#
# IMPORTANT: keep this file pure ASCII.
#   alembic reads the ini file with encoding="locale"
#   (alembic/util/compat.py: read_config_parser -> file_config.read(path, encoding="locale")).
#   On a zh-CN Windows host the locale codec is GBK, so any non-ASCII byte here
#   raises UnicodeDecodeError before the command even starts.
#
# Conventions:
#   1. sqlalchemy.url below is only a PLACEHOLDER. At runtime
#      migrations/env.py:56 overwrites it with
#      fastapi_app.core.database.get_sync_engine() (i.e. DATABASE_URL from .env).
#      Changing it here has no effect on any connection.
#   2. Run every alembic command from the repository root, so that
#      prepend_sys_path lets migrations/env.py import fastapi_app.
#   3. The migration graph is not a linear chain: 102 revisions, exactly one head
#      (pg_standalone_063_fix_order_status_check) and 4 roots.
#      The shape is enforced by scripts/check_alembic_heads.py; the history is
#      documented in migrations/versions/README.md.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# placeholder, overwritten by migrations/env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
