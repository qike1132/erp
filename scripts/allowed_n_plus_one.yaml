# scripts/allowed_n_plus_one.yaml
# N+1 查询扫描白名单
#
# 支持三种键（2026-09-14 起）：
#   path/to/file.py                 —— 整个文件豁免（最粗，慎用）
#   path/to/file.py:123             —— 指定行（**行号随编辑漂移即整批失效，已实际踩到**）
#   path/to/file.py::function_name  —— 指定函数（**推荐**，不随行号漂移）
#
# ⚠️ 就地标注优先于白名单
#   若违规只发生在某个具体调用上，直接在源码对应行加 `# batch-loop: <理由>` 更好：
#   局部、自解释、不会腐烂。2026-09-14 已把 6 处此类站点改为就地标注。
#
# 准入标准：仅豁免经评审确认可接受的循环内 await db.execute ——
#   ① 遍历的是**固定集合**（常量语句表 / manifest 表集合 / 固定模型类集合）
#   ② 或**业务必需**的逐条独立事务（逐条提交，避免后续失败回滚已成功项）
#   Web 业务请求路径上的数据量级 N+1 **不得豁免**，必须改写为批量查询。

# === 备份/恢复域：遍历固定集合，或逐条独立事务（2026-09-14 改为函数级）===
# ro_grants: 遍历 _RESET_GRANTS_SQL / _DEFAULT_PRIVILEGES_SQL 两个常量语句表
fastapi_app/services/backup/ro_grants.py::ensure_readonly_grants
# restore_plan: 遍历 manifest 中的固定表集合（约 30 张），逐表 COUNT 供还原预览
fastapi_app/services/backup/restore_plan.py::build_restore_plan
# records: 逐条补录/清理孤立/修正僵尸，每条独立提交，避免后续失败回滚已成功项
fastapi_app/services/backup/records.py::sync_backup_records
# 以下为备份域整文件豁免（按固定表名集合遍历，表数量固定 ~30，非数据量 N+1）
fastapi_app/services/backup/verify/core.py
fastapi_app/services/backup/verify/query_service.py
fastapi_app/services/backup/json_backup.py
fastapi_app/services/backup/orchestration/core.py
fastapi_app/services/backup/orchestration/recovery_test_service.py
fastapi_app/services/backup/incremental.py

# === 启动预热：固定 5 次连接池预热，非请求路径 ===
fastapi_app/main.py

# === 审计中间件缓冲区刷写：按缓冲条目遍历，批写场景 ===
fastapi_app/core/audit_middleware.py

# === 乐观锁重试循环：冲突时重试，非数据量 N+1 ===
fastapi_app/shared/stock_concurrency.py
fastapi_app/services/purchase_plan_crud.py

# === BOM 保存：按固定物料类别集合遍历（类别数固定）===
fastapi_app/services/bom_service.py

# === 供应商信息同步：按固定模型类集合遍历 ===
fastapi_app/services/purchase_supplier_service.py

