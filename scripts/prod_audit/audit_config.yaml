# 生产代码审核流程配置
# 12 层审核 pipeline 的统一配置：层开关 / 白名单 / 阈值 / 审核员 / 权重 / 惩罚 / 压测阈值 / 覆盖率阈值
#
# 约束：
#   - weights 各层权重 Σweight = 1.0（加载时校验，误差 ≤ 1e-9）
#   - enabled=false 的层必须附 disable_reason 说明字段
#   - severity_threshold 为阻断上线阈值（含该级别及以上）
schema_version: "1.0"

# ---------------------------------------------------------------------------
# 12 层权重（Σweight = 1.0，安全层 L6 权重最高 0.15）
# ---------------------------------------------------------------------------
weights:
  L1: 0.10
  L2: 0.08
  L3: 0.12
  L4: 0.10
  L5: 0.08
  L6: 0.15
  L7: 0.10
  L8: 0.07
  L9: 0.08
  L10: 0.05
  L11: 0.04
  L12: 0.03

# ---------------------------------------------------------------------------
# 严重度阈值与问题惩罚
# ---------------------------------------------------------------------------
severity_threshold: "high"      # 阻断上线阈值（含 critical 与 high）
readiness_threshold: 85         # 生产就绪评分阈值，≥ 85 为就绪

issue_penalty:                  # 各严重度问题对层得分的扣分值（生产级校准）
  critical: 25                  # 严重安全问题，立即阻断
  high: 15                      # 高危问题，阻断上线
  medium: 1                     # 中等问题，记录但不过度扣分（代码质量/可改进项）
  low: 0                        # 低优先级，不扣分（仅记录跟踪）
  info: 0                       # 信息性，不扣分

# ---------------------------------------------------------------------------
# 压测阈值
# ---------------------------------------------------------------------------
perf_thresholds:
  core_list_p95_ms: 300         # 核心列表 P95 ≤ 300ms
  aggregate_p95_ms: 500         # 聚合查询 P95 ≤ 500ms
  min_rps: 500                  # 并发吞吐量 ≥ 500 RPS
  max_error_rate: 0.001         # 错误率 ≤ 0.1%
  cold_start_s: 10              # 冷启动 ≤ 10s
  max_memory_mb: 1024           # 内存 ≤ 1GB
  max_conn_pool_util: 0.80      # 连接池利用率 ≤ 80%
  lcp_s: 2.5                    # LCP ≤ 2.5s
  fid_ms: 100                   # FID ≤ 100ms
  cls: 0.1                      # CLS ≤ 0.1
  max_bundle_size_mb: 2         # 产物体积 ≤ 2MB

# ---------------------------------------------------------------------------
# 覆盖率分级阈值
# ---------------------------------------------------------------------------
coverage_thresholds:
  core: 85                      # 核心模块覆盖率 ≥ 85%
  backup: 80                    # 备份模块覆盖率 ≥ 80%
  inbound: 75                   # 来料模块覆盖率 ≥ 75%
  dashboard: 70                 # 仪表盘模块覆盖率 ≥ 70%

# ---------------------------------------------------------------------------
# 断点恢复
# ---------------------------------------------------------------------------
resume_from: null               # 可选层 ID（如 "L4"），null 表示从头开始

# ---------------------------------------------------------------------------
# 白名单豁免说明
# ---------------------------------------------------------------------------
whitelist_explanations:
  - file: "server_manager.py"
    layer: "L1"
    rule_id: "L1-BROAD-EXCEPT-001"
    count: 39
    reason: "桌面壳（PyInstaller 打包的 server_manager.exe）入口模块，需捕获所有异常以防止 GUI 崩溃；39 处宽泛 except 已逐一审查并附说明，不纳入后端服务审核范围。"

# ---------------------------------------------------------------------------
# 12 层配置
# ---------------------------------------------------------------------------
layers:
  L1:
    enabled: true
    reviewer: "static-analysis-bot"
    layer_name: "静态分析门禁审核"
    whitelist:
      - "server_manager.py"
    thresholds:
      max_func_lines: 80
      max_component_lines: 300
      ruff_select: ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]

  L2:
    enabled: true
    reviewer: "architecture-reviewer"
    layer_name: "架构与分层审核"
    whitelist: []
    thresholds:
      max_service_lines: 500
      max_endpoint_body_lines: 30

  L3:
    enabled: true
    reviewer: "business-logic-reviewer"
    layer_name: "业务逻辑与正确性审核"
    whitelist:
      - "server_manager.py"
    thresholds:
      max_loop_query_count: 0

  L4:
    enabled: true
    reviewer: "data-access-reviewer"
    layer_name: "数据访问层审核"
    whitelist:
      - "fastapi_app/main.py"
      - "fastapi_app/core/audit_middleware.py"
      - "fastapi_app/shared/stock_concurrency.py"
      - "fastapi_app/services/purchase_plan_crud.py"
      - "fastapi_app/services/bom_service.py"
      - "fastapi_app/services/purchase_supplier_service.py"
      - "fastapi_app/services/staging_service.py"
      - "fastapi_app/services/purchase_order_crud.py"
      - "fastapi_app/services/order_batch_create.py"
      - "fastapi_app/services/purchase_bom_copy_service.py"
      - "fastapi_app/services/notification_service.py"
    thresholds:
      max_big_tx_rows: 1000
      max_big_tx_seconds: 1

  L5:
    enabled: true
    reviewer: "api-contract-reviewer"
    layer_name: "API 契约与版本兼容审核"
    whitelist: []
    thresholds:
      contract_snapshot_dir: "evidence/contract_snapshots"

  L6:
    enabled: true
    reviewer: "security-blue-team"
    layer_name: "安全审核（蓝队 + 红队）"
    whitelist: []
    thresholds:
      pip_audit_severity: "high"
      trivy_severity: "HIGH,CRITICAL"

  L7:
    enabled: true
    reviewer: "performance-reviewer"
    layer_name: "性能与可扩展性审核"
    whitelist: []
    thresholds:
      perf_report_dir: "evidence/perf_reports"

  L8:
    enabled: true
    reviewer: "observability-reviewer"
    layer_name: "可观测性审核"
    whitelist: []
    thresholds:
      required_log_fields: ["request_id", "user_id", "timestamp", "level"]

  L9:
    enabled: true
    reviewer: "test-quality-reviewer"
    layer_name: "测试质量审核"
    whitelist: []
    thresholds:
      coverage_report_dir: "evidence/coverage_reports"

  L10:
    enabled: true
    reviewer: "frontend-mobile-reviewer"
    layer_name: "前端与移动端审核"
    whitelist: []
    thresholds:
      max_component_lines: 300
      max_bundle_size_mb: 2

  L11:
    enabled: true
    reviewer: "deploy-readiness-reviewer"
    layer_name: "部署就绪与配置审核"
    whitelist: []
    thresholds:
      require_health_check: true
      require_rollback_plan: true
      require_lockfile: true

  L12:
    enabled: true
    reviewer: "release-manager"
    layer_name: "审核报告与上线决策"
    whitelist: []
    thresholds:
      min_readiness_score: 85