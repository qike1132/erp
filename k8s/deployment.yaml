apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-app
  namespace: erp-system
  labels:
    app: erp-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: erp-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: erp-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5002"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: erp-system:latest
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/startup
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: uploads
              mountPath: /app/static/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: erp-app
  namespace: erp-system
spec:
  selector:
    app: erp-app
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
