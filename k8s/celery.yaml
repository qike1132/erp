apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-celery-worker
  namespace: erp-system
  labels:
    app: erp-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-celery-worker
  template:
    metadata:
      labels:
        app: erp-celery-worker
    spec:
      containers:
        - name: worker
          image: erp-system:latest
          command: ["celery"]
          args:
            - -A
            - fastapi_app.core.celery_app:celery_app
            - worker
            - -Q
            - celery,batch,reports
            - -c
            - "4"
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-celery-beat
  namespace: erp-system
  labels:
    app: erp-celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-celery-beat
  template:
    metadata:
      labels:
        app: erp-celery-beat
    spec:
      containers:
        - name: beat
          image: erp-system:latest
          command: ["celery"]
          args:
            - -A
            - fastapi_app.core.celery_app:celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
