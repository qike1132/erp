# ============================================================
# ERP System - 蓝绿部署 Service
# 通过修改 selector.version 切换流量: blue <-> green
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: erp-backend
  namespace: erp-production
  labels:
    app: erp-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: erp-backend
    version: blue    # ← 切换为 green 即可完成蓝绿切换
---
# ============================================================
# ERP System - 蓝绿部署切换脚本 (ConfigMap)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-switch
  namespace: erp-production
data:
  switch.sh: |
    #!/bin/bash
    # 蓝绿部署切换脚本
    # 用法: kubectl exec -n erp-production configmap/blue-green-switch -- switch.sh [blue|green]
    
    TARGET_VERSION="${1:-green}"
    NAMESPACE="erp-production"
    
    echo "切换流量到 ${TARGET_VERSION}..."
    
    # 1. 等待目标版本就绪
    echo "检查 ${TARGET_VERSION} Deployment 就绪状态..."
    kubectl -n ${NAMESPACE} rollout status deployment/erp-backend-${TARGET_VERSION}
    
    if [ $? -ne 0 ]; then
      echo "错误: ${TARGET_VERSION} Deployment 未就绪，切换中止"
      exit 1
    fi
    
    # 2. 切换 Service selector
    echo "切换 Service selector 到 ${TARGET_VERSION}..."
    kubectl -n ${NAMESPACE} patch service erp-backend -p "{\"spec\":{\"selector\":{\"version\":\"${TARGET_VERSION}\"}}}"
    
    # 3. 验证
    echo "验证流量已切换..."
    kubectl -n ${NAMESPACE} get service erp-backend -o jsonpath='{.spec.selector}'
    echo ""
    echo "蓝绿切换完成！当前活跃版本: ${TARGET_VERSION}"
