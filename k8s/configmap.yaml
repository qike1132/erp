apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  namespace: erp-system
data:
  APP_ENV: production
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_TYPE: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: binfa-erp
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-system
type: Opaque
stringData:
  # 生产部署时必须通过外部 Secret 管理器（Sealed Secrets / External Secrets Operator / Vault）
  # 注入真实值，禁止使用占位符。部署前校验脚本会拒绝包含 CHANGE_ME 的值。
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
