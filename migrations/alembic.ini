# A generic, single database configuration.

[alembic]
# NOTE: use %(here)s (the directory containing THIS ini file), never ".".
#   "." is resolved by Alembic against the CURRENT WORKING DIRECTORY, so running
#   `alembic -c migrations/alembic.ini ...` from the repo root resolves to the repo
#   root, which has no env.py / versions/, and raises:
#       ImportError: Can't find Python file env.py
#   %(here)s decouples the path from CWD while KEEPING cwd unchanged. Do NOT switch
#   to `cd migrations`: that would shift relative resolution of .env / settings.
# KEEP THIS FILE ASCII-ONLY: Alembic reads it with the system locale encoding
# (GBK on zh-CN Windows), so non-ASCII bytes here break every alembic command.
script_location = %(here)s
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
