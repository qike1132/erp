[pytest]
# 测试路径配置 - 包含新版和旧版测试
testpaths = tests fastapi_app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio 配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 命令行选项 (coverage plugin optional - install pytest-cov to enable)
addopts = 
    -v
    --strict-markers
    --tb=short

# 标记配置
markers =
    unit: 单元测试
    integration: 集成测试
    functional: 功能测试
    boundary: 边界条件测试
    slow: 慢速测试
    api: API测试
    model: 模型测试
    db: 数据库测试
    contract: 接口契约快照比对（需真实后端；未设置 CONTRACT_BASE_URL 时整文件跳过）

# 最小Python版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告配置
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
