[pytest]
# 测试路径配置 - 包含新版和旧版测试
testpaths = tests fastapi_app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio 配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 命令行选项 (coverage plugin optional - install pytest-cov to enable)
# 2026-10-06：-v 改为 --tb=short + -q 语境可控。根因：全量 -v 的 live-log 逐条回显
# 让 stdout 达 2.1MB，超出工作流编排器的 256KB 捕获上限（exit=-999 假失败）。
# 本地/CI 想看逐条进度仍可显式传 -v / -vv 覆盖。
addopts =
    --tb=short
    --strict-markers

# 标记配置
markers =
    unit: 单元测试
    integration: 集成测试
    functional: 功能测试
    boundary: 边界条件测试
    slow: 慢速测试
    api: API测试
    model: 模型测试
    db: 数据库测试
    contract: 接口契约快照比对（需真实后端；未设置 CONTRACT_BASE_URL 时整文件跳过）
    experimental: 已实现但生产导入图不可达的待接线特性，不计入现役业务覆盖率

# 最小Python版本
minversion = 7.0

# 日志配置
# 2026-10-06：log_cli 改 false。根因：live-log 把每条 HTTP/业务日志逐条回显到
# stdout，全量 pytest -q 仍产出 ~2MB（超工作流编排器 262144 字节捕获上限，
# exit=-999 假失败）。需要实时日志时显式加 -o log_cli=true。
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
# 注意：log_cli_level 保留，仅当用 -o log_cli=true 打开时生效

# 警告配置
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
