name: ERP System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_USER: erp_test
      DB_PASSWORD: erp_test_pass
      DB_NAME: erp_test
      DB_PORT: "5432"
      SECRET_KEY: "ci-test-secret-key-with-sufficient-length-for-validation-checks"
      COVERAGE_MIN: "40"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/**/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit ruff
    
    - name: Verify Alembic migrations
      run: |
        python -m alembic -c migrations/alembic.ini upgrade head
        python -m alembic -c migrations/alembic.ini check
    
    - name: Run gated test suite
      # 注意：tests/contract 未被 --ignore 排除，会随本步骤执行。
      #   其中两条静态守卫（快照存在性、不得夹带原始响应体）在本 job 真的会跑；
      #   "与真实后端比对"那条因 CI 无常驻后端而自动 skip。
      #   本地要跑完整契约比对：CONTRACT_BASE_URL=http://127.0.0.1:5002 pytest tests/contract -v
      run: |
        pytest \
          tests fastapi_app/tests \
          --ignore=tests/qa \
          --ignore=tests/e2e \
          --ignore=tests/stress \
          --ignore=tests/performance \
          -m "not flask_legacy" \
          --cov=fastapi_app \
          --cov=utils \
          --cov-report=xml \
          --cov-report=html \
          --html=test-report.html \
          --junitxml=test-results.xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: |
          test-report.html
          htmlcov/
          coverage.xml
          test-results.xml
    
    - name: Security scan with Bandit
      run: |
        bandit -r fastapi_app/ utils/ -f json -o security-report.json -ii
    
    - name: Dependency vulnerability scan
      run: |
        pip-audit --format json > dependency-audit.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          security-report.json
          dependency-audit.json
    
    - name: Check coverage threshold
      run: |
        python -c "import os; import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.attrib['line-rate']) * 100; print(f'Coverage: {coverage:.2f}%'); threshold = float(os.getenv('COVERAGE_MIN', '20')); (print(f'Coverage below threshold: {coverage:.2f}% < {threshold:.2f}%') or exit(1)) if coverage < threshold else None"
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    
    # 统一代码质量门禁（基线棘轮）：存量违规不阻断，新增即拦截。
    # 置于 ruff 之前，确保即使 ruff 步骤因存量告警失败，本步骤的结果仍然可见。
    - name: Run code quality gate (baseline ratchet)
      run: python scripts/quality_gate.py --verbose

    - name: Run Ruff gate
      run: ruff check fastapi_app tests fastapi_app/tests utils

    - name: Run scoped mypy gate
      run: python -m mypy --config-file mypy.ini

    - name: Run file size gate (block new god-classes)
      run: python scripts/file_size_gate.py --threshold 1200

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-vite

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # Node 22：与本地开发环境一致，且满足 @capacitor/cli@8 (>=22) 与 vite@7 (^20.19 || >=22.12) 的要求
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run frontend lint
      run: npm run lint

    - name: Run frontend build
      run: npm run build

    # 原为 `npm run test:e2e` —— 该脚本在 package.json 中不存在、也没有
    # playwright.config.* 与 e2e/ 目录，步骤必然失败。改为执行真实存在的跨端
    # 对齐检查；Playwright e2e 落地后恢复（见 ITER-4 决策项 D-2）。
    - name: Run frontend cross-layer alignment checks
      run: |
        npm run check:api
        npm run check:routes

    - name: Upload frontend test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-artifacts
        path: |
          frontend-vite/playwright-report/
          frontend-vite/test-results/
  
  build:
    needs: [test, lint, frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Validate source tree
      run: |
        python -m pip install --upgrade pip
        python -m compileall fastapi_app utils tests fastapi_app/tests
  
  deploy-staging:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging (Windows native)
      run: |
        echo "Deploying to staging environment (Windows native)..."
        .\deploy-windows.ps1 -Env staging
      env:
        APP_ENV: staging
    
  deploy-production:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production (Windows native)
      run: |
        echo "Deploying to production environment (Windows native)..."
        .\deploy-windows.ps1 -Env production
      env:
        APP_ENV: production
