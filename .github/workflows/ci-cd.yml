name: ERP System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_USER: erp_test
      DB_PASSWORD: erp_test_pass
      DB_NAME: erp_test
      DB_PORT: "5432"
      SECRET_KEY: "ci-test-secret-key-with-sufficient-length-for-validation-checks"
      COVERAGE_MIN: "40"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/**/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit ruff
    
    - name: Verify Alembic migrations
      run: |
        python -m alembic -c migrations/alembic.ini upgrade head
        python -m alembic -c migrations/alembic.ini check
    
    - name: Run gated test suite
      run: |
        pytest \
          tests fastapi_app/tests \
          --ignore=tests/qa \
          --ignore=tests/e2e \
          --ignore=tests/stress \
          --ignore=tests/performance \
          -m "not flask_legacy" \
          --cov=fastapi_app \
          --cov=utils \
          --cov-report=xml \
          --cov-report=html \
          --html=test-report.html \
          --junitxml=test-results.xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: |
          test-report.html
          htmlcov/
          coverage.xml
          test-results.xml
    
    - name: Security scan with Bandit
      run: |
        bandit -r fastapi_app/ utils/ -f json -o security-report.json -ii
    
    - name: Dependency vulnerability scan
      run: |
        pip-audit --format json > dependency-audit.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          security-report.json
          dependency-audit.json
    
    - name: Check coverage threshold
      run: |
        python -c "import os; import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.attrib['line-rate']) * 100; print(f'Coverage: {coverage:.2f}%'); threshold = float(os.getenv('COVERAGE_MIN', '20')); (print(f'Coverage below threshold: {coverage:.2f}% < {threshold:.2f}%') or exit(1)) if coverage < threshold else None"
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    
    - name: Run Ruff gate
      run: ruff check fastapi_app tests fastapi_app/tests utils

    - name: Run scoped mypy gate
      run: python -m mypy --config-file mypy.ini

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-vite

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run frontend lint
      run: npm run lint

    - name: Run frontend build
      run: npm run build

    - name: Run frontend E2E tests
      run: npm run test:e2e

    - name: Upload frontend test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-artifacts
        path: |
          frontend-vite/playwright-report/
          frontend-vite/test-results/
  
  build:
    needs: [test, lint, frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Validate source tree
      run: |
        python -m pip install --upgrade pip
        python -m compileall fastapi_app utils tests fastapi_app/tests
  
  deploy-staging:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging (Windows native)
      run: |
        echo "Deploying to staging environment (Windows native)..."
        .\deploy-windows.ps1 -Env staging
      env:
        APP_ENV: staging
    
  deploy-production:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production (Windows native)
      run: |
        echo "Deploying to production environment (Windows native)..."
        .\deploy-windows.ps1 -Env production
      env:
        APP_ENV: production
