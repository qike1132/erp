name: ERP System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/**/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit ruff
    
    - name: Run gated test suite
      run: |
        pytest \
          tests/test_cache.py \
          tests/test_config.py \
          tests/test_stock_concurrency.py \
          tests/test_base_search_service.py \
          tests/test_customer_search_service.py \
          tests/test_product_search_service.py \
          tests/test_case_service.py \
          tests/test_ocr_service.py \
          tests/test_finance_service.py \
          tests/test_purchase_supplier_service.py \
          tests/test_production_plan_service.py \
          fastapi_app/tests/test_integration_smoke.py \
          --cov=fastapi_app \
          --cov=utils \
          --cov-report=xml \
          --cov-report=html \
          --html=test-report.html \
          --junitxml=test-results.xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: |
          test-report.html
          htmlcov/
          coverage.xml
          test-results.xml
    
    - name: Security scan with Bandit
      run: |
        bandit -r fastapi_app/ utils/ -f json -o security-report.json || true
    
    - name: Dependency vulnerability scan
      run: |
        pip-audit --format json > dependency-audit.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          security-report.json
          dependency-audit.json
    
    - name: Check coverage threshold
      run: |
        python -c "
import os
import xml.etree.ElementTree as ET
tree = ET.parse('coverage.xml')
root = tree.getroot()
coverage = float(root.attrib['line-rate']) * 100
print(f'Coverage: {coverage:.2f}%')
threshold = float(os.getenv('COVERAGE_MIN', '20'))
if coverage < threshold:
    print(f'Coverage below threshold: {coverage:.2f}% < {threshold:.2f}%')
    raise SystemExit(1)
        "
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    
    - name: Run Ruff gate
      run: ruff check fastapi_app tests fastapi_app/tests utils --select E9

    - name: Run scoped mypy gate
      run: python -m mypy --config-file mypy.ini

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-vite

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run frontend lint
      run: npm run lint

    - name: Run frontend build
      run: npm run build

    - name: Run frontend E2E tests
      run: npm run test:e2e

    - name: Upload frontend test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-artifacts
        path: |
          frontend-vite/playwright-report/
          frontend-vite/test-results/
  
  build:
    needs: [test, lint, frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Validate source tree
      run: |
        python -m pip install --upgrade pip
        python -m compileall fastapi_app utils tests fastapi_app/tests
  
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        docker compose -f docker-compose.yml up -d --build app celery-worker celery-beat
      env:
        APP_ENV: staging
    
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        kubectl apply -f k8s/configmap.yaml -f k8s/infra.yaml -f k8s/deployment.yaml -f k8s/celery.yaml -f k8s/hpa.yaml -f k8s/ingress.yaml
        kubectl rollout status deployment/erp-app -n erp-system --timeout=300s
