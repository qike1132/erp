name: ERP System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 最小权限：本工作流只读仓库，不发布、不推送镜像、不写 PR。
# 显式声明可避免继承仓库默认 token 权限（fork PR 尤其敏感）。
permissions:
  contents: read

jobs:
  # ── runner 镜像固定 ubuntu-24.04（noble），**不要**用 ubuntu-latest ──────────
  # ubuntu-latest 自 2026-10-19 起迁往 Ubuntu 26.04（resolute），而 frontend-vite 钉的
  # Playwright 1.60.0 没有 ubuntu26.04-x64 的 Chromium 构建，安装浏览器那一步直接 abort：
  #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
  # （run 42557016138 实测：test job step 14、frontend job step 9 同一条错误。）
  # 代价不是「少跑一条用例」，而是**该步骤之后的门禁全部变 skipped**：test job 的
  # step 15-22（全栈浏览器冒烟、OpenAPI 端点对齐、prod_audit 自检、junit 上传、
  # bandit、pip-audit、覆盖率判定），frontend job 的 step 10-11（浏览器 E2E、跨端
  # 四件套 check:api / api:pc / routes / dto / types）都没跑，build job 整体 skipped，
  # 而失败的只是一个与业务无关的「装浏览器」步骤。
  # 解除条件：Playwright 发布带 26.04 构建的版本 → 升 playwright（含 package-lock）
  # 并在本地跑通 `npm run test:e2e` 后，四个 job **一起**改回 ubuntu-latest。
  # 不要逐 job 改：只固定用到浏览器的两个，会让 lint/build 在下次镜像迁移时单独变红。
  test:
    runs-on: ubuntu-24.04
    # 全量 pytest（5124 条）+ 隔离 API E2E + 契约 + 全栈浏览器冒烟已超过 10 分钟；
    # 基线 job 恰好在 10:00 完成，新增用例后会被 job 超时截断（表现为无失败步骤的 failure）。
    timeout-minutes: 25

    services:
      # 限流（slowapi）与缓存走 Redis；缺 Redis 时 slowapi 会静默回退内存存储并丢弃
      # 路由级限额（见 fastapi_app/core/limiter.py 的 in_memory_fallback），使「N 次后应
      # 429」的限流回归在 CI 上误报通过（2026-10-08 实测）。故 test job 需要 redis service。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_USER: erp_test
      DB_NAME: erp_test
      DB_PORT: "5432"
      COVERAGE_MIN: "40"

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    # services 会在步骤之前启动，无法读取本次作业生成的密码。PostgreSQL 改在步骤内启动，
    # 保持与生产同一大版本（18），仅发布到 runner 回环地址。
    - name: Generate CI credentials and start PostgreSQL
      shell: bash
      run: |
        DB_PASSWORD=$(openssl rand -hex 24)
        SECRET_KEY=$(openssl rand -hex 32)
        # 显式指向容器创建的 erp_test，避免 tests/conftest.py 再追加 _test。
        TEST_DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        ci_e2e_dsn="postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        printf '::add-mask::%s\n' "$DB_PASSWORD" "$SECRET_KEY" "$TEST_DATABASE_URL" "$ci_e2e_dsn"
        # 环境变量文件按「键=值」逐行写入；每行单独 printf，值只来自运行时生成，
        # 不写成内联赋值形式（避免被提交钩子的口令规则误判）。
        printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> "$GITHUB_ENV"
        printf 'SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"
        printf 'TEST_DATABASE_URL=%s\n' "$TEST_DATABASE_URL" >> "$GITHUB_ENV"
        printf 'CI_E2E_DSN=%s\n' "$ci_e2e_dsn" >> "$GITHUB_ENV"

        # 容器凭据经 --env-file 传入，不在命令行里以 KEY=value 形式出现。
        container_env=$(mktemp)
        trap 'rm -f "$container_env"' EXIT
        chmod 600 "$container_env"
        printf 'POSTGRES_PASSWORD=%s\n' "$DB_PASSWORD" >> "$container_env"
        printf 'POSTGRES_USER=%s\n' "$DB_USER" >> "$container_env"
        printf 'POSTGRES_DB=%s\n' "$DB_NAME" >> "$container_env"
        docker run --detach --name erp-ci-postgres \
            --env-file "$container_env" \
            --publish "127.0.0.1:${DB_PORT}:5432" \
            --health-cmd "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            postgres:18-alpine > /dev/null
        for attempt in $(seq 1 60); do
          status=$(docker inspect --format '{{ .State.Health.Status }}' erp-ci-postgres)
          case "$status" in
            healthy) exit 0 ;;
            unhealthy) break ;;
          esac
          sleep 1
        done
        echo 'PostgreSQL 测试容器未就绪' >&2
        exit 1

    - name: Set up Node.js for full-stack browser E2E
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    # pg_dump 必须与服务端同一个大版本：service 是 postgres:18-alpine（刻意对齐生产
    # 的 18.x），而 runner 自带的 pg_dump 是 16（pgdg24.04）。大版本不匹配时 pg_dump
    # 直接 abort，让 test_restore_real_roundtrip 这类真跑 dump/restore 的用例在 CI 上
    # 必然失败（2026-10-12 实测：server version 18.6 / pg_dump version 16.15）。
    # ⚠️ Ubuntu 24.04 (noble) 默认源**没有** postgresql-client-18（只有 16），必须先加
    # PGDG 官方源，否则 `E: Unable to locate package postgresql-client-18`
    # （2026-10-12 CI run 38218718141 实测）。装 18 客户端即可（postgresql-common 的
    # pg_wrapper 默认取最新版）；末行把版本打进日志，日后回归时一眼能看出。
    # 仓库地址用 ${VERSION_CODENAME} 推导、不写死 noble：本工作流当前把 job 固定
    # 在 ubuntu-24.04（原因见 jobs 顶部注释），但解除固定后该替换在 24.04 / 26.04
    # 上都成立——apt.postgresql.org 已有 resolute-pgdg 且含 postgresql-client-18
    # （2026-10-12 实测），无需按 codename 分支。
    - name: Install PostgreSQL 18 client (must match the service major)
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y postgresql-client-18
        pg_dump --version

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'

    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/**/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 用锁文件（B1）：钉死全部传递依赖，与本地 venv 一致
        # --require-hashes：锁内每个包都带 sha256，安装时强制校验，防镜像/中间人换包
        pip install --require-hashes -r requirements/base.lock -r requirements/dev.lock -r requirements/test.lock
        pip install bandit==1.9.4 pip-audit==2.10.1
    
    - name: Verify Alembic migrations
      run: |
        python -m alembic -c migrations/alembic.ini upgrade head
        python -m alembic -c migrations/alembic.ini check
    
    - name: Run gated test suite (Linux 恒 skip 的 Windows-only 用例见 tests/test_windows_only_skip_inventory.py)
      # 注意：tests/contract 未被 --ignore 排除，会随本步骤执行。
      #   其中两条静态守卫（快照存在性、不得夹带原始响应体）在本 job 真的会跑；
      #   "与真实后端比对"那条因 CI 无常驻后端而自动 skip。
      #   本地要跑完整契约比对：CONTRACT_BASE_URL=http://127.0.0.1:5002 pytest tests/contract -v
      # 2026-10-27：自建 Flask/SQLite 模型、不触达生产代码的旧“功能测试”已删除，
      #   避免绿色假覆盖。仍在收集的 Flask 路由兼容用例会按具体 reason skip，
      #   skip 计数保留在 CI 日志与 junit xml 中。tests/e2e 只含 fail-closed 目标
      #   守卫（无 Selenium、无默认生产地址），因此不再整目录忽略。
      # 2026-11-18（审计 TEST 区，批次 8）：不再 --ignore=tests/qa。
      #   原先的理由是「该目录混入 import 即连库的造数/基准脚本，不能在收集期放进主套件」，
      #   但 pytest 只收集 test_*.py，data_generator*/_bench*/perf_final.py 这些都不匹配，
      #   根本不会被 import。实际被跳过的只有 3 个真用例文件，其中 test_database(10 条) 与
      #   test_forms(22 条) 此前**从未在 CI 跑过**（test_smoke 另有独立 -v 步骤）。
      #   tests/qa 整目录本地实测 51 passed / 40s。
      # 2026-11-03 审查 M16：tests/performance 空目录（仅剩 9 个已删文件的陈旧 pyc）已删除，
      #   因此不再需要 --ignore=tests/performance；性能改由 latency_budget 用例把守。
      # 2026-11-19（审计 TEST 区 1.7）：本 step 在 ubuntu runner 上恒 skip 的 Windows-only 用例
      #   共 20 条（server_manager 的 NSSM 启停、PowerShell 迁移脚本 dry-run、Windows Job Object
      #   与信号处理）。清单由 tests/test_windows_only_skip_inventory.py 冻结，增减必须显式登记。
      #   **CI 绿 ≠ 这些用例被覆盖**：它们只在生产机（Windows）本地跑，改动 server_manager/
      #   或 prod_runner 的 Windows 分支时，CI 给不了任何证据。
      # tests/stress（批次 8 复核）：保留 --ignore，因为它确实是**压测脚本目录**，
      #   0 个 pytest 用例（`def test_` 计数为 0）；那些脚本是 `python tests/stress/xx.py`
      #   手工跑的，生产回环口守卫由 fastapi_app/tests/test_stress_scripts_have_prod_guard.py
      #   的棘轮看住。**不要**往这里加 pytest 用例——加了也不会被执行（就是本 ignore）。
      run: |
        pytest \
          tests fastapi_app/tests \
          --ignore=tests/stress \
          --cov=fastapi_app \
          --cov=utils \
          --cov-report=xml \
          --cov-report=html \
          --html=test-report.html \
          --junitxml=test-results.xml

    - name: Run 19-section route smoke
      # 2026-11-03 审查 S6（白樾 P6 = 闻朔 P2）：本文件自建 admin、幂等、不依赖 tests/qa 里
      #   任何造数脚本，可独立进程执行。它的语义是「36 个路由组里这 19 个板块的只读端点
      #   能通且鉴权活着」——路由误删/权限码错配在这一层当场红，不再只靠浏览器冒烟兜。
      # KNOWN_ENV_401（数据备份）是已知环境性豁免；CI 有 Redis service，若该豁免将来失效，
      # 用例会如实变红，不要用放宽白名单的方式消音。
      run: pytest tests/qa/test_smoke.py -v

    - name: Run isolated API E2E and live contract checks
      # 真实进程 + 真实 PostgreSQL/Redis：不得把默认环境中的 E2E skip 当成业务写路径已验证。
      # 5502 是 CI 专用端口；e2e-identity 会证明目标确实为 APP_ENV=test 且连接 erp_test。
      env:
        APP_ENV: test
        REDIS_CACHE_URL: redis://localhost:6379/15
        REDIS_URL: redis://localhost:6379/15
        REDIS_DB: "15"
        E2E_API_BASE_URL: http://127.0.0.1:5502
        CONTRACT_BASE_URL: http://127.0.0.1:5502
      run: |
        export ERP_E2E_REAL_DATABASE_URL="$CI_E2E_DSN"
        # 空库没有导航/权限行：/dashboard/nav-sections 只剩 core，前端左栏空白，
        # 契约基线也无法复现（实测丢 35 个字段签名）。seed_nav.py 是「新库补齐导航」
        # 的权威幂等来源；ERP_ALLOW_PROD_WRITE 仅用于放行本步骤指向的 CI *_test 库
        # （写保护脚本按环境保守拒绝，不是指向生产）。
        ERP_ALLOW_PROD_WRITE=1 PYTHONPATH=scripts python scripts/seed_nav.py
        python -m uvicorn fastapi_app.main:app --host 127.0.0.1 --port 5502 &
        E2E_PID=$!
        trap 'kill $E2E_PID 2>/dev/null || true' EXIT
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:5502/api/health >/dev/null; then
            break
          fi
          if ! kill -0 $E2E_PID 2>/dev/null; then
            echo "隔离后端提前退出"
            exit 1
          fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:5502/api/health/e2e-identity
        # 禁止加载根 tests/conftest.py：它会清空并重建共享测试库，和运行中的隔离后端争用同一 DB。
        #
        # 2026-10-30：两条都恢复为**阻塞式门禁**。此前挂成报告项的三个原因已解决：
        #   1) 出库可用量取「生产日报 department=packaging」，E2E 造数已按真实口径补包装部入库；
        #   2) 下单后 post-commit 自动生成采购单，一键生成返回 created_count=0 属幂等语义，
        #      用例改为断言「恰好一张采购单 + 订单已备货」；
        #   3) 契约基线改为 `--record --merge`（只增不减），空库比对靠 array[0]/object{} 容差
        #      通过；实测有数据与空库两种环境均 22/22 一致、0 漂移。
        pytest --confcutdir=tests/e2e_api tests/e2e_api -v
        pytest --confcutdir=tests/contract tests/contract -v
        # 性能延迟预算门禁（2026-11-03 审查 S3）：5 条主链路 × 20 采样，阈值见 docs/slo.md。
        # 复用本步骤已就绪的 5502 隔离后端与 *_test 库，不需要新基础设施。
        pytest --confcutdir=tests/e2e_api tests/e2e_api/test_latency_budget.py -v

    - name: Build frontend for real full-stack browser E2E
      working-directory: frontend-vite
      run: |
        npm ci
        npm run build

    - name: Install Chromium for full-stack browser E2E
      working-directory: frontend-vite
      run: npx playwright install --with-deps chromium

    - name: Run real full-stack browser smoke
      # 2026-10-30 审计 B-M2：断言已从录入页 /customer-order 改到订单流水 /report，
      # 该步骤恢复为阻塞门禁（失败必须红掉 test job）。
      env:
        APP_ENV: test
        ALLOWED_HOSTS: '["127.0.0.1","localhost"]'
        CORS_ORIGINS: http://127.0.0.1:5600
        WS_ALLOWED_ORIGINS: http://127.0.0.1:5600
        REDIS_CACHE_URL: redis://localhost:6379/15
        REDIS_URL: redis://localhost:6379/15
        REDIS_DB: "15"
        E2E_FULLSTACK_BASE_URL: http://127.0.0.1:5502
        E2E_FULLSTACK_USER: admin
      shell: bash
      run: |
        export ERP_E2E_REAL_DATABASE_URL="$CI_E2E_DSN"
        E2E_FULLSTACK_PASSWORD=$(openssl rand -hex 24)
        printf '::add-mask::%s\n' "$E2E_FULLSTACK_PASSWORD"
        export E2E_FULLSTACK_PASSWORD
        # 浏览器与 ORM 共享本步骤生成的口令；前序冒烟若已创建管理员，也要更新密码。
        python - <<'PY'
        import asyncio
        import os

        from sqlalchemy import select

        from fastapi_app.core.database import (
            ensure_engine_for_current_loop,
            require_async_session_local,
        )
        from fastapi_app.core.security import hash_password
        from fastapi_app.shared_models.user import User

        async def main() -> None:
            username = os.environ['E2E_FULLSTACK_USER']
            await ensure_engine_for_current_loop()
            async with require_async_session_local()() as session:
                user = (
                    await session.execute(select(User).where(User.username == username))
                ).scalars().first()
                if user is None:
                    user = User(username=username, is_super=True, status=True)
                    session.add(user)
                user.password = hash_password(os.environ['E2E_FULLSTACK_PASSWORD'])
                await session.commit()

        asyncio.run(main())
        PY
        python -m uvicorn fastapi_app.main:app --host 127.0.0.1 --port 5502 &
        E2E_PID=$!
        trap 'kill $E2E_PID 2>/dev/null || true' EXIT
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:5502/api/health >/dev/null; then
            break
          fi
          if ! kill -0 $E2E_PID 2>/dev/null; then
            echo "全栈浏览器 E2E 后端提前退出"
            exit 1
          fi
          sleep 1
        done
        node --test frontend-vite/tests/e2e/fullstack-business.e2e.mjs

    # P1-12 前端契约真校验：把 frontend-vite/src/api/*.ts 里真实调用的端点与后端
    # fastapi_app.main:app.openapi() 的路径逐条比对（字面量端点断言，模板端点只列出）。
    # 端点来源全部现算（app.openapi()）；另用 --snapshot 校验已提交的 frontend-vite/openapi.json
    # 是否与本后端规范一致，快照过期即判红——堵住前端类型生成器只读快照引入的假绿灯。
    # 放在本 job（而非 lint job）：这里装了 requirements.txt，import fastapi_app 才可行。
    - name: Check frontend endpoints against backend OpenAPI
      # --strict-allowlist（2026-11-03 审查 M7）：KNOWN_ABSENT 里「后端已补齐」的僵尸
      # 豁免必须判红，否则豁免表能只增不减地烂掉。当前清单为空，开启零成本。
      run: python scripts/check_openapi_frontend_alignment.py --verbose --snapshot frontend-vite/openapi.json --strict-allowlist

    - name: Run prod_audit self-test suite
      # 与上面的「gated test suite」分开**独立进程**运行，原因有二：
      #   1) 该套件有独立 conftest（scripts/prod_audit/tests/conftest.py），
      #      与主套件混跑会触发已知的 conftest event-loop 污染；
      #   2) 独立步骤让它在 CI 日志中单独可见，失败定位更快。
      # 覆盖 L1~L12 审核层的加载 / 评分 / 上线决策 / 证据归档；其中
      # test_l11_deployment.py 是 L11 部署就绪判据的回归锁
      # （迁移路径须识别 migrations/、部署就绪须接受 Windows 原生 NSSM）。
      # 注意：**不加 --cov** —— 覆盖率门槛针对 fastapi_app/utils，
      # 把 scripts 计入会污染该指标。
      run: pytest scripts/prod_audit/tests -q
    
    # 2026-09-30：已删除 codecov 上传步骤。仓库内无 codecov.yml，且原步骤未设
    #   fail_ci_if_error: true —— 既无配置、又永远不可能让 CI 变红，属形同虚设的
    #   门面步骤（唯一的实际效果是把覆盖率推给一个未配置的外部服务）。
    #   coverage.xml 仍由下方 artifact 归档，覆盖率门槛由后面的
    #   "Check coverage threshold" 步骤就地判定，信号没有丢失。
    - name: Upload test report
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: test-report
        path: |
          test-report.html
          htmlcov/
          coverage.xml
          test-results.xml
    
    # Bandit 安全扫描（第五轮审计修复）：此前缺 `-c bandit.yaml`，bandit 不会自动
    # 加载该文件（--configfile 默认为 None，只自动发现目录里的 .bandit），导致
    # 配置里的 skips（B101/B105/B106/B107/B108）**从未生效**，全仓扫出 5k+ 条并退出非 0。
    # 现显式 -c 加载配置；`--exit-zero` 与 pip-audit 同口径 —— 只产出 security-report.json，
    # 不因存量发现红掉 CI。
    #
    # 2026-10-17 审计 F3-2：此前**只产出报告、没有任何判定步骤**——注释里承诺的
    # 「判定另行处理」从未落地，扫描与判定之间是断的。现把判定接进 quality_gate：
    # 发现数进基线棘轮（scripts/gate_baseline.json 的 "bandit"），新增发现即 FAIL。
    - name: Security scan with Bandit
      run: |
        bandit -c bandit.yaml -r fastapi_app/ utils/ -f json -o security-report.json -ii --exit-zero
        python scripts/quality_gate.py --only bandit --security-report security-report.json --verbose
    
    # 依赖漏洞扫描（P0-11⑨）：豁免清单在 pyproject.toml 的
    # [[tool.code-quality.pip-audit-ignores]]（每条含 id / expires（单条 ≤180 天）/ reason）。
    # pip-audit 自身有发现时退出码非 0，故用 `|| true` 只取 JSON 产物，把判定统一交给
    # quality_gate.py 的 pip_audit 门禁：过期 / 僵尸条目（漏洞已消失）/ 超过有效期上限 /
    # 缺 reason / 未豁免漏洞 一律 FAIL 并退出码非 0。
    #
    # 2026-10-11 起恢复判定：de963b00（2026-10-02）已查明 172 条中 151 条属系统 python
    # 的 AI 工具依赖（非本项目暴露面），venv 真实暴露面 21 条（PyJWT 13 + pip 8）当天
    # 已升级清零并复扫通过。本日复扫 venv 全量（= 锁内容）仍为 0 漏洞，门禁判定模式
    # 实测 PASS（exit 0），故拆除 report-only 降级。若未来出现新漏洞：对确无法升级的
    # 条目按 pyproject [[tool.code-quality.pip-audit-ignores]] 登记豁免（≤180 天 + reason）。
    - name: Dependency vulnerability scan
      run: |
        pip-audit --format json > dependency-audit.json || true
        python scripts/quality_gate.py --only pip_audit --audit-report dependency-audit.json --verbose
    
    - name: Upload security reports
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: security-reports
        path: |
          security-report.json
          dependency-audit.json
    
    - name: Check coverage threshold
      run: |
        python -c "import os; import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.attrib['line-rate']) * 100; print(f'Coverage: {coverage:.2f}%'); threshold = float(os.getenv('COVERAGE_MIN', '20')); (print(f'Coverage below threshold: {coverage:.2f}% < {threshold:.2f}%') or exit(1)) if coverage < threshold else None"
    
    - name: Remove isolated PostgreSQL test container
      if: always()
      shell: bash
      run: |
        if docker container inspect --format '{{ .Id }}' erp-ci-postgres >/dev/null 2>&1; then
          docker rm --force --volumes erp-ci-postgres >/dev/null
        fi

  lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        # fetch-depth: 0：file_size_gate 需对比 PR 基线（origin/<base_ref>...HEAD）。
        # 默认浅检出(depth 1)取不到基线 ref → 门禁回落「无扫描文件」空转。
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'

    # 代码评审包（advisory，不阻断）：把风险标记、必查项、必跑命令写进 PR 的
    # Step Summary，让评审者有统一输入而不是靠翻 diff 猜重点。
    # 放在装依赖之前：脚本只用标准库，且这样即使后面的门禁红了，评审包仍然可见。
    # continue-on-error：脚本自身故障（如 base ref 解析失败 exit 2）不得红掉 lint job
    # ——「播报」与「判定」必须分开，否则与 rollout 承诺的「不挡 PR」矛盾。
    # 先观察 2 周：确认无误报、且团队真的在看，再考虑加 --fail-on-blocker 并去掉本行。
    - name: Review packet (advisory, PR only)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      run: |
        python scripts/review_packet.py \
          --base "origin/${{ github.base_ref }}" \
          --out "$RUNNER_TEMP/review-packet.md"
        cat "$RUNNER_TEMP/review-packet.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Install linters
      # 装项目 dev 依赖（requirements/dev.lock = base 的钉版 + ruff / mypy + 全部传递依赖）。
      # 必须走 requirements，不能用裸 `pip install sqlalchemy`：项目钉 sqlalchemy==2.0.49，
      # 裸装会拉到 2.1.x，其 typing 收窄会让 mypy 在 12 处报错（本地 dev 环境 368 文件全绿）。
      # alembic（quality_gate 的 alembic_heads 门禁需要）已随 base 一并安装。
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements/dev.lock
        pip install uv==0.12.5

    # 锁同步门禁（B1）：requirements/<tier>.txt 改了必须重跑 uv pip compile 刷新 .lock，
    # 否则锁会悄悄与声明脱节（改了依赖却不生效）。
    # C3：本步骤同时做**闭包校验**——锁内每个包都必须能从声明经 # via 图推导出来，
    # 拦住「往 .lock 里塞一行任意包」的绕过。刻意不用 --strict：它会重新联网解析，
    # 上游每发一个补丁就让全档同时失配（2026-10-26 已因此改判据）。
    - name: Check requirements lock freshness
      # 七档（N1 修复后 DEFAULT_TIERS 扩到全档）：缺 .lock 现在判失败而非跳过。
      run: python scripts/check_requirements_lock.py
    
    # 密钥扫描（CI 侧第二道防线）：`.githooks/pre-commit` 只在本地跑、且可被
    # `git commit --no-verify` 绕过 —— 该文件头部已把「CI 侧必须另有一道独立扫描」
    # 列为审计行动项。本步骤扫**全部受版本控制的文件**（hook 只看暂存），
    # 因此能发现历史上已入库的可疑文件。置于最前，确保密钥问题优先可见。
    - name: Run secret scan (whole tree)
      run: python scripts/scan_secrets.py --verbose

    # 统一代码质量门禁（基线棘轮）：存量违规不阻断，新增即拦截。
    # 置于 ruff 之前，确保即使 ruff 步骤因存量告警失败，本步骤的结果仍然可见。
    - name: Run code quality gate (baseline ratchet)
      env:
        # P1-23（2026-11-17 上线前审计）：直推 main 时 origin/main 与 HEAD 都等于本次
        # 推送的提交，棘轮会自比自恒绿；只有事件里的 before SHA 是真正的上一提交。
        # 取不到该 SHA 的基线时门禁**失败**而非跳过（浅克隆 = 没证据），故上面的
        # checkout 必须 fetch-depth: 0。
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      run: python scripts/quality_gate.py --verbose

    # P0-11⑦ 恒失败自检：在临时目录里人为制造真实违规，断言门禁退出码非 0；
    # 再移除违规，断言退出码回到 0。全程用 `--only` 隔离在单个门禁上，
    # 不依赖任何存量基线（否则基线漂移会把「门禁能拦违规」这件事掩盖掉）。
    - name: Gate self-test (prove bypasses fail, not just pass)
      run: python scripts/quality_gate.py --self-test

    # 2026-11-18（审计 TEST 区，批次 8）：`scripts/_selftest_gate.py` 此前没有任何调用方
    #   —— CI 不跑它、quality_gate 不能递归自调、只由一个测 stderr 编码的用例 import 了
    #   它两个函数，于是 18 项自检里绝大部分从未被流水线执行过。与上面的 --self-test 互补：
    #     --self-test   → 逐门禁端到端（probe-dir：人为违规→非 0 + REGRESS，移除→0）
    #     _selftest_gate→ 跨门禁语义面：N+1 判定不退化（真 N+1 必报 / for..in iterable
    #                     不得报 / 就地标注必须带理由 / 白名单 file::func 生效 / 僵尸键必报）、
    #                     子进程中文 stderr 必须按 UTF-8 读回、语法错误文件与无效路径必须
    #                     发 WARN 而不是静默 PASS。
    #   成本：本自检内部两处 quality_gate 调用已用 `--only function_length` 隔离（探针是
    #   90 行函数 + 裸 except，单门禁同样能判 REGRESS/PASS），实测 220 秒 → 3.9 秒；
    #   此前跑两遍**完整** quality_gate 还会在无报告时现场联网跑 pip_audit，CI 里等于
    #   多两条可 flake 的联网路径。正因为降到 4 秒，它才适合放进 CI 而不是攒到手工跑。
    - name: Gate self-test (cross-gate semantics - N+1, whitelist zombies, stderr)
      run: python scripts/_selftest_gate.py

    # P0-11⑧ ruff 区间扩到 scripts/ 与 server_manager/：存量违规按 scripts/gate_baseline.json
    # 的棘轮计数（只降不升）看住，新增即 FAIL。单独跑一次便于在 CI 日志直接看到新范围计数。
    - name: Ruff ratchet for scripts/ + server_manager/
      run: python scripts/quality_gate.py --only ruff --verbose

    # P0-11⑩ 孤儿/死模块检查（janitor 交付；纯 exit-code 语义，无 stdout 解析）。
    - name: Check orphan modules
      run: python scripts/check_orphan_modules.py

    - name: Run Ruff gate
      run: ruff check fastapi_app tests fastapi_app/tests utils

    - name: Run scoped mypy gate
      run: python -m mypy --config-file mypy.ini

    - name: Run file size gate (block new god-classes)
      # 阈值取自 pyproject.toml [tool.code-quality] max_file_size，此处不再硬编码。
      # PR 事件：对比 PR 基线取变更文件（CI 干净检出里工作树 == HEAD，原先的 git-diff 模式
      #   恒为空 = 空转）。仓库根与 server_manager/ 随变更集进入扫描范围(T6 的目标)。
      #   基线 ref 解析不了时脚本会**失败**而非静默跳过 —— 这正是 fetch-depth: 0 的意义所在。
      # push 事件：无 GITHUB_BASE_REF，传 --base 只会得到一个解析不了的 ref，故改走 --all
      #   全量报告（不阻断，仅让超限文件在日志里可见）。
      run: |
        if [ -n "${{ github.base_ref }}" ]; then
          python scripts/file_size_gate.py --base "origin/${{ github.base_ref }}"
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          # I1-03（2026-10-24 审计）：直推 main 也要拦新增巨型文件——对比事件
          # 的上一提交（push 事件带 before SHA；删除分支的全零 before 回落 --all）。
          git diff --name-only "${{ github.event.before }}" HEAD > /tmp/changed.txt || true
          python scripts/file_size_gate.py --base "${{ github.event.before }}"
        else
          echo "[file-size-gate] 非 PR 事件且无 before SHA：改走全量报告，不阻断"
          python scripts/file_size_gate.py --all
        fi

    # 12 层审计的静态层接进 CI。定位是**播报**：continue-on-error 保证审计红了
    # 不挡 PR/推送，与上面 review_packet 同一口径（播报与判定分离）；证据落
    # artifact 供人工评审引用。放行判据仍然只有 quality_gate + pytest。
    # 关掉的 L7/L9/L11 是「本机能做、runner 不能做」的三层，理由写在
    # audit_config_ci.yaml 的 disable_reason 里（ConfigLoader 会校验非空）。
    - name: Run prod_audit static layers (advisory)
      continue-on-error: true
      run: |
        python scripts/run_prod_audit.py           --config scripts/prod_audit/audit_config_ci.yaml           --evidence-dir "$RUNNER_TEMP/prod_audit_evidence"           || echo "[prod_audit] 有层被阻断（advisory，不阻断 CI），详见 evidence artifact"

    - name: Upload prod_audit evidence (advisory)
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: prod-audit-evidence
        path: ${{ runner.temp }}/prod_audit_evidence
        if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend-vite

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        # Node 22：与本地开发环境一致，且满足 @capacitor/cli@8 (>=22) 与 vite@7 (^20.19 || >=22.12) 的要求
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    # M10（2026-10-26 上线前检查）：依赖审计必须可判定，且只针对**生产依赖树**。
    # 此前前端 job 完全没有审计步骤：axios→follow-redirects 的 high 级公告
    # 一直留在生产依赖里（能随 bundle 进浏览器），而「全量 npm audit」又被
    # Vite/Vitest 等**只在开发服务器/构建期**存在的公告长期染红——两个方向都
    # 无法作为发布判据。现按暴露面拆开：
    #   · 本步骤走 `scripts/audit-with-ignore.mjs`：生产树出现 high/critical 即失败，
    #     除非该公告被**逐条具名**豁免（GHSA id + 可达性论证 + 复核日，见该脚本
    #     IGNORES 表）；豁免到期脚本自己失败，不会变成永久后门；
    #   · 开发树（Vite/Vitest/launch-editor）不阻断发布，其风险面是开发服务器与
    #     CI 构建输入，不随静态产物进浏览器；升级走独立 PR（跨 major 需验证构建）。
    # 为什么不用 `npm audit ... --audit-level=high` 裸跑：它**没有 ignore 机制**，
    # 一条「上游暂无修复版本」的高危公告就会让整个流水线永久红（2026-11-18 的
    # picomatch GHSA-fc5q-39xc-vjpf 即此情形，npm 的"修复"是降级 vue-router 大版本）。
    # 为什么不用 `|| true`：那会把这一步变成永远绿的空操作，比不做更糟。
    - name: Audit production dependencies
      run: node scripts/audit-with-ignore.mjs

    - name: Run frontend lint
      run: npm run lint

    # 此前 CI 从不执行前端单测，行为回归只有类型检查兜底（revert 修复也不会红）。
    # 2026-09-29：加 `--reporter=junit --outputFile.junit=test-results.xml`，
    # 让单测结果成为可下载的 CI 产物（原先下游 artifact 步骤上传的 Playwright
    # playwright-report/ 与 test-results/ 两个目录从来不存在 —— 见下方说明）。
    # 注意：这里**直接调 vitest 而不是 `npm run test --`** —— 实测 npm 会把
    # `--outputFile.junit=...` 当成它自己的 cli config 吞掉
    # （打印 "npm warn Unknown cli config \"--outputFile.junit\"" 且不产出报告），
    # 故必须绕开 npm 的参数解析。`test` 脚本本身就是 `vitest run`，二者等价。
    # 覆盖率阈值定义在 vitest.config.ts；低于阈值直接失败，避免只产出报告不判定。
    - name: Run frontend unit tests with coverage
      run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml

    - name: Run frontend build
      run: npm run build

    # 使用真实构建产物 + 模拟 API 的浏览器 E2E。路由拦截保证不触达真实账号、
    # 后端或数据库；tests/e2e 的 Python 目标守卫另由上面的 pytest job 执行。
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run browser E2E
      run: npm run test:e2e

    # P1-12：跨层对齐四件套。check:dto 此前只写在 package.json 里、CI 从不执行，
    # 移动端重复声明 DTO（绕过 @/types）就能一路绿灯；这里补上引用。
    - name: Run frontend cross-layer alignment checks
      run: |
        npm run check:api
        npm run check:api:pc
        npm run check:routes
        npm run check:dto
        npm run check:types

    # 上传上面单测步骤产出的 junit 报告（真实存在；`if: always()` 保证测试失败时也能取到）。
    # 原先上传的 frontend-vite/playwright-report/ 与 frontend-vite/test-results/ 两个路径
    # 永不存在：vitest.config.ts 未配置 junit reporter，且 CI 以 `vitest run` 不带 --coverage
    # 运行（`reporter` 只配在 coverage 段内），故 upload-artifact 的
    # if-no-files-found 默认 warn 会让它静默空转。
    - name: Upload frontend test artifacts
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: frontend-test-artifacts
        if-no-files-found: error
        path: |
          frontend-vite/test-results.xml
          frontend-vite/coverage/

  windows-verification:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json
    - name: Verify portable deployment helpers without installing services
      shell: pwsh
      run: ./deploy/tests/test_lib.ps1
    - name: Install Windows frontend dependencies
      working-directory: frontend-vite
      run: npm ci
    - name: Verify Windows production dependency audit
      working-directory: frontend-vite
      run: node scripts/audit-with-ignore.mjs
    - name: Verify frontend regression on Windows
      working-directory: frontend-vite
      run: npm test

  build:
    needs: [test, lint, frontend, windows-verification]
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
    
    - name: Validate source tree
      run: |
        python -m pip install --upgrade pip
        python -m compileall fastapi_app utils tests fastapi_app/tests
  
  # ---------------------------------------------------------------------------
  # 部署阶段已移除（2026-09-24）—— 原 deploy-staging / deploy-production 两个 job
  #
  # 移除原因（三条，任一都足以让它们不可能成功）：
  #   1) 架构不通：生产机是内网 192.168.0.95，而本 workflow 全部使用 GitHub 托管的
  #      runner（ubuntu-latest / windows-latest）。托管 runner 无法访问内网主机，
  #      因此这里**不可能**完成真实部署。本仓库未配置 self-hosted runner。
  #   2) 依赖已删：两个 job 都执行 `.\deploy-windows.ps1`，该脚本已在 commit 15e13a79
  #      （「上线前审核整改——安全加固、危险操作面收敛」）中作为「必然 exit 1 的过时
  #      脚本」被**有意删除**（见 deliverables/audit-2026-09-17/上线前问题修复报告-20260917.md
  #      的 M9 项、上线前审核总报告 C-M7）。不要为了过 CI 而复活它。
  #   3) 分支不存在：deploy-staging 的 if 条件是 `refs/heads/develop`，而本仓库从未
  #      有过 develop 分支（只有 main / fix-v533-sentinel 等）⇒ 该 job 永不执行。
