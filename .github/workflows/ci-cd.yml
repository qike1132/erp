name: ERP System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 对齐生产版本（第七轮审计 2026-10-03）：生产实测 PostgreSQL 18.3
        # （`show server_version`），此前 CI 用 16 —— 迁移门禁在 16 上验证，
        # 与 18 存在保真度缺口（PG18 专有行为/语法测不出）。
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_pass  # secret-scan:allow CI 测试库口令，仅 Actions 内部网络
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 限流（slowapi）与缓存走 Redis；缺 Redis 时 slowapi 会静默回退内存存储并丢弃
      # 路由级限额（见 fastapi_app/core/limiter.py 的 in_memory_fallback），使「N 次后应
      # 429」的限流回归在 CI 上误报通过（2026-10-08 实测）。故 test job 需要 redis service。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_USER: erp_test
      DB_PASSWORD: erp_test_pass  # secret-scan:allow CI 测试库口令，仅 Actions 内部网络
      DB_NAME: erp_test
      DB_PORT: "5432"
      # 显式给出测试库 URL，绕开 tests/conftest.py 的「{DB_NAME}_test」派生：
      # 派生会把 DB_NAME=erp_test 拼成 erp_test_test，而本 job 的 postgres 只创建了
      # erp_test（POSTGRES_DB），派生库不存在 → tests/ 整棵树的 fixtures 报错。
      TEST_DATABASE_URL: postgresql+asyncpg://erp_test:erp_test_pass@localhost:5432/erp_test  # secret-scan:allow CI 测试库口令，仅 Actions 内部网络
      # CI 专用固定密钥：仅供 test job 启动校验，不连任何真实环境
      SECRET_KEY: "ci-test-secret-key-with-sufficient-length-for-validation-checks"  # secret-scan:allow CI 固定值
      COVERAGE_MIN: "40"

    steps:
    - uses: actions/checkout@v5

    # pg_dump 必须与服务端同一个大版本：service 是 postgres:18-alpine（刻意对齐生产
    # 的 18.x），而 runner 自带的 pg_dump 是 16（pgdg24.04）。大版本不匹配时 pg_dump
    # 直接 abort，让 test_restore_real_roundtrip 这类真跑 dump/restore 的用例在 CI 上
    # 必然失败（2026-10-12 实测：server version 18.6 / pg_dump version 16.15）。
    # ⚠️ Ubuntu 24.04 (noble) 默认源**没有** postgresql-client-18（只有 16），必须先加
    # PGDG 官方源，否则 `E: Unable to locate package postgresql-client-18`
    # （2026-10-12 CI run 38218718141 实测）。装 18 客户端即可（postgresql-common 的
    # pg_wrapper 默认取最新版）；末行把版本打进日志，日后回归时一眼能看出。
    # Ubuntu 26.04 (resolute) 同理：ubuntu-latest 自 2026-10-19 起迁往 26.04，而
    # apt.postgresql.org 已发布 resolute-pgdg 且含 postgresql-client-18（2026-10-12 实测），
    # 故 ${VERSION_CODENAME} 替换在 24.04 / 26.04 上都能解析到正确仓库，无需按 codename 分支。
    - name: Install PostgreSQL 18 client (must match the service major)
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y postgresql-client-18
        pg_dump --version

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/**/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 用锁文件（B1）：钉死全部传递依赖，与本地 venv 一致
        pip install -r requirements/base.lock -r requirements/dev.lock -r requirements/test.lock
        pip install bandit==1.9.4 pip-audit==2.10.1
    
    - name: Verify Alembic migrations
      run: |
        python -m alembic -c migrations/alembic.ini upgrade head
        python -m alembic -c migrations/alembic.ini check
    
    - name: Run gated test suite
      # 注意：tests/contract 未被 --ignore 排除，会随本步骤执行。
      #   其中两条静态守卫（快照存在性、不得夹带原始响应体）在本 job 真的会跑；
      #   "与真实后端比对"那条因 CI 无常驻后端而自动 skip。
      #   本地要跑完整契约比对：CONTRACT_BASE_URL=http://127.0.0.1:5002 pytest tests/contract -v
      # 2026-09-29 收口：已移除 `-m "not flask_legacy"`。该标记原先把 9 个测试文件整批反选，
      #   连 skip 记录都不出现在日志里（掩盖，而非挂起）。现状：
      #     · 5 个文件（test_{api,order,product,customer}_routes、performance/test_performance）
      #       改为带具体 reason 的 `pytest.mark.skip` —— 其被测目标根 `app/`（Flask 应用）
      #       已在 Flask→FastAPI 迁移中删除，reason 里写明跟踪项；
      #     · 4 个文件（test_{order,product,approval}_management、test_models_coverage）
      #       摘除标记，恢复被 pytest 正常收集。
      #   注意：requirements/*.txt 内**没有任何 Flask 条目**，故上述 4 个文件在 CI 里仍会
      #   自行 skip（只有装了残留 Flask 的本地开发机才真正执行）。收口后这些 skip 计数
      #   在 CI 日志与 junit xml 中真实可见，是有效信号而不是被 marker 反选隐藏。
      run: |
        pytest \
          tests fastapi_app/tests \
          --ignore=tests/qa \
          --ignore=tests/e2e \
          --ignore=tests/stress \
          --ignore=tests/performance \
          --cov=fastapi_app \
          --cov=utils \
          --cov-report=xml \
          --cov-report=html \
          --html=test-report.html \
          --junitxml=test-results.xml

    # P1-12 前端契约真校验：把 frontend-vite/src/api/*.ts 里真实调用的端点与后端
    # fastapi_app.main:app.openapi() 的路径逐条比对（字面量端点断言，模板端点只列出）。
    # 端点来源全部现算（app.openapi()）；另用 --snapshot 校验已提交的 frontend-vite/openapi.json
    # 是否与本后端规范一致，快照过期即判红——堵住前端类型生成器只读快照引入的假绿灯。
    # 放在本 job（而非 lint job）：这里装了 requirements.txt，import fastapi_app 才可行。
    - name: Check frontend endpoints against backend OpenAPI
      run: python scripts/check_openapi_frontend_alignment.py --verbose --snapshot frontend-vite/openapi.json

    - name: Run prod_audit self-test suite
      # 与上面的「gated test suite」分开**独立进程**运行，原因有二：
      #   1) 该套件有独立 conftest（scripts/prod_audit/tests/conftest.py），
      #      与主套件混跑会触发已知的 conftest event-loop 污染；
      #   2) 独立步骤让它在 CI 日志中单独可见，失败定位更快。
      # 覆盖 L1~L12 审核层的加载 / 评分 / 上线决策 / 证据归档；其中
      # test_l11_deployment.py 是 L11 部署就绪判据的回归锁
      # （迁移路径须识别 migrations/、部署就绪须接受 Windows 原生 NSSM）。
      # 注意：**不加 --cov** —— 覆盖率门槛针对 fastapi_app/utils，
      # 把 scripts 计入会污染该指标。
      run: pytest scripts/prod_audit/tests -q
    
    # 2026-09-30：已删除 codecov 上传步骤。仓库内无 codecov.yml，且原步骤未设
    #   fail_ci_if_error: true —— 既无配置、又永远不可能让 CI 变红，属形同虚设的
    #   门面步骤（唯一的实际效果是把覆盖率推给一个未配置的外部服务）。
    #   coverage.xml 仍由下方 artifact 归档，覆盖率门槛由后面的
    #   "Check coverage threshold" 步骤就地判定，信号没有丢失。
    - name: Upload test report
      uses: actions/upload-artifact@v6
      with:
        name: test-report
        path: |
          test-report.html
          htmlcov/
          coverage.xml
          test-results.xml
    
    # Bandit 安全扫描（第五轮审计修复）：此前缺 `-c bandit.yaml`，bandit 不会自动
    # 加载该文件（--configfile 默认为 None，只自动发现目录里的 .bandit），导致
    # 配置里的 skips（B101/B105/B106/B107/B108）**从未生效**，全仓扫出 5k+ 条并退出非 0。
    # 现显式 -c 加载配置；`--exit-zero` 与 pip-audit 同口径 —— 只产出 security-report.json，
    # 不因存量发现红掉 CI。
    #
    # 2026-10-17 审计 F3-2：此前**只产出报告、没有任何判定步骤**——注释里承诺的
    # 「判定另行处理」从未落地，扫描与判定之间是断的。现把判定接进 quality_gate：
    # 发现数进基线棘轮（scripts/gate_baseline.json 的 "bandit"），新增发现即 FAIL。
    - name: Security scan with Bandit
      run: |
        bandit -c bandit.yaml -r fastapi_app/ utils/ -f json -o security-report.json -ii --exit-zero
        python scripts/quality_gate.py --only bandit --security-report security-report.json --verbose
    
    # 依赖漏洞扫描（P0-11⑨）：豁免清单在 pyproject.toml 的
    # [[tool.code-quality.pip-audit-ignores]]（每条含 id / expires（单条 ≤180 天）/ reason）。
    # pip-audit 自身有发现时退出码非 0，故用 `|| true` 只取 JSON 产物，把判定统一交给
    # quality_gate.py 的 pip_audit 门禁：过期 / 僵尸条目（漏洞已消失）/ 超过有效期上限 /
    # 缺 reason / 未豁免漏洞 一律 FAIL 并退出码非 0。
    #
    # 2026-10-11 起恢复判定：de963b00（2026-10-02）已查明 172 条中 151 条属系统 python
    # 的 AI 工具依赖（非本项目暴露面），venv 真实暴露面 21 条（PyJWT 13 + pip 8）当天
    # 已升级清零并复扫通过。本日复扫 venv 全量（= 锁内容）仍为 0 漏洞，门禁判定模式
    # 实测 PASS（exit 0），故拆除 report-only 降级。若未来出现新漏洞：对确无法升级的
    # 条目按 pyproject [[tool.code-quality.pip-audit-ignores]] 登记豁免（≤180 天 + reason）。
    - name: Dependency vulnerability scan
      run: |
        pip-audit --format json > dependency-audit.json || true
        python scripts/quality_gate.py --only pip_audit --audit-report dependency-audit.json --verbose
    
    - name: Upload security reports
      uses: actions/upload-artifact@v6
      with:
        name: security-reports
        path: |
          security-report.json
          dependency-audit.json
    
    - name: Check coverage threshold
      run: |
        python -c "import os; import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.attrib['line-rate']) * 100; print(f'Coverage: {coverage:.2f}%'); threshold = float(os.getenv('COVERAGE_MIN', '20')); (print(f'Coverage below threshold: {coverage:.2f}% < {threshold:.2f}%') or exit(1)) if coverage < threshold else None"
    
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # fetch-depth: 0：file_size_gate 需对比 PR 基线（origin/<base_ref>...HEAD）。
        # 默认浅检出(depth 1)取不到基线 ref → 门禁回落「无扫描文件」空转。
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    # 代码评审包（advisory，不阻断）：把风险标记、必查项、必跑命令写进 PR 的
    # Step Summary，让评审者有统一输入而不是靠翻 diff 猜重点。
    # 放在装依赖之前：脚本只用标准库，且这样即使后面的门禁红了，评审包仍然可见。
    # continue-on-error：脚本自身故障（如 base ref 解析失败 exit 2）不得红掉 lint job
    # ——「播报」与「判定」必须分开，否则与 rollout 承诺的「不挡 PR」矛盾。
    # 先观察 2 周：确认无误报、且团队真的在看，再考虑加 --fail-on-blocker 并去掉本行。
    - name: Review packet (advisory, PR only)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      run: |
        python scripts/review_packet.py \
          --base "origin/${{ github.base_ref }}" \
          --out "$RUNNER_TEMP/review-packet.md"
        cat "$RUNNER_TEMP/review-packet.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Install linters
      # 装项目 dev 依赖（requirements/dev.lock = base 的钉版 + ruff / mypy + 全部传递依赖）。
      # 必须走 requirements，不能用裸 `pip install sqlalchemy`：项目钉 sqlalchemy==2.0.49，
      # 裸装会拉到 2.1.x，其 typing 收窄会让 mypy 在 12 处报错（本地 dev 环境 368 文件全绿）。
      # alembic（quality_gate 的 alembic_heads 门禁需要）已随 base 一并安装。
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.lock
        pip install uv==0.12.5

    # 锁同步门禁（B1）：requirements/<tier>.txt 改了必须重跑 uv pip compile 刷新 .lock，
    # 否则锁会悄悄与声明脱节（改了依赖却不生效）。
    - name: Check requirements lock freshness
      # 七档（N1 修复后 DEFAULT_TIERS 扩到全档）：缺 .lock 现在判失败而非跳过。
      run: python scripts/check_requirements_lock.py
    
    # 密钥扫描（CI 侧第二道防线）：`.githooks/pre-commit` 只在本地跑、且可被
    # `git commit --no-verify` 绕过 —— 该文件头部已把「CI 侧必须另有一道独立扫描」
    # 列为审计行动项。本步骤扫**全部受版本控制的文件**（hook 只看暂存），
    # 因此能发现历史上已入库的可疑文件。置于最前，确保密钥问题优先可见。
    - name: Run secret scan (whole tree)
      run: python scripts/scan_secrets.py --verbose

    # 统一代码质量门禁（基线棘轮）：存量违规不阻断，新增即拦截。
    # 置于 ruff 之前，确保即使 ruff 步骤因存量告警失败，本步骤的结果仍然可见。
    - name: Run code quality gate (baseline ratchet)
      run: python scripts/quality_gate.py --verbose

    # P0-11⑦ 恒失败自检：在临时目录里人为制造真实违规，断言门禁退出码非 0；
    # 再移除违规，断言退出码回到 0。全程用 `--only` 隔离在单个门禁上，
    # 不依赖任何存量基线（否则基线漂移会把「门禁能拦违规」这件事掩盖掉）。
    - name: Gate self-test (prove bypasses fail, not just pass)
      run: python scripts/quality_gate.py --self-test

    # P0-11⑧ ruff 区间扩到 scripts/ 与 server_manager/：存量违规按 scripts/gate_baseline.json
    # 的棘轮计数（只降不升）看住，新增即 FAIL。单独跑一次便于在 CI 日志直接看到新范围计数。
    - name: Ruff ratchet for scripts/ + server_manager/
      run: python scripts/quality_gate.py --only ruff --verbose

    # P0-11⑩ 孤儿/死模块检查（janitor 交付；纯 exit-code 语义，无 stdout 解析）。
    - name: Check orphan modules
      run: python scripts/check_orphan_modules.py

    - name: Run Ruff gate
      run: ruff check fastapi_app tests fastapi_app/tests utils

    - name: Run scoped mypy gate
      run: python -m mypy --config-file mypy.ini

    - name: Run file size gate (block new god-classes)
      # 阈值取自 pyproject.toml [tool.code-quality] max_file_size，此处不再硬编码。
      # PR 事件：对比 PR 基线取变更文件（CI 干净检出里工作树 == HEAD，原先的 git-diff 模式
      #   恒为空 = 空转）。仓库根与 server_manager/ 随变更集进入扫描范围(T6 的目标)。
      #   基线 ref 解析不了时脚本会**失败**而非静默跳过 —— 这正是 fetch-depth: 0 的意义所在。
      # push 事件：无 GITHUB_BASE_REF，传 --base 只会得到一个解析不了的 ref，故改走 --all
      #   全量报告（不阻断，仅让超限文件在日志里可见）。
      run: |
        if [ -n "${{ github.base_ref }}" ]; then
          python scripts/file_size_gate.py --base "origin/${{ github.base_ref }}"
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          # I1-03（2026-10-24 审计）：直推 main 也要拦新增巨型文件——对比事件
          # 的上一提交（push 事件带 before SHA；删除分支的全零 before 回落 --all）。
          git diff --name-only "${{ github.event.before }}" HEAD > /tmp/changed.txt || true
          python scripts/file_size_gate.py --base "${{ github.event.before }}"
        else
          echo "[file-size-gate] 非 PR 事件且无 before SHA：改走全量报告，不阻断"
          python scripts/file_size_gate.py --all
        fi

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-vite

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        # Node 22：与本地开发环境一致，且满足 @capacitor/cli@8 (>=22) 与 vite@7 (^20.19 || >=22.12) 的要求
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    # M10（2026-10-26 上线前检查）：依赖审计必须可判定，且只针对**生产依赖树**。
    # 此前前端 job 完全没有审计步骤：axios→follow-redirects 的 high 级公告
    # 一直留在生产依赖里（能随 bundle 进浏览器），而「全量 npm audit」又被
    # Vite/Vitest 等**只在开发服务器/构建期**存在的公告长期染红——两个方向都
    # 无法作为发布判据。现按暴露面拆开：
    #   · 本步骤 `--omit=dev --audit-level=high`：生产树出现 high/critical 即失败；
    #   · 开发树（Vite/Vitest/launch-editor）不阻断发布，其风险面是开发服务器与
    #     CI 构建输入，不随静态产物进浏览器；升级走独立 PR（跨 major 需验证构建）。
    # 需要临时豁免时，必须在 PR 描述里写明公告 ID、可达性论证与到期日，并同步
    # 加 `|| true` 的仅为**该条**的显式白名单——不允许整步跳过。
    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    # 原为 `npx playwright install --with-deps chromium`（:211-212）—— 已删除。
    # 全仓库无 playwright.config.*、无 e2e/ 目录、无 test:e2e 脚本，src/ 下也没有任何
    # `@playwright/test` import（playwright 仅出现在 package.json 与 lock 里），
    # 该步骤下载的浏览器无人使用，纯耗时。仓库真实的 e2e 在 Python 侧
    # （tests/e2e、tests/e2e_api），且 tests/e2e 正是上面 pytest 步骤的 --ignore 目标。
    # 若将来落地 Playwright e2e，需同时补 playwright.config.ts + spec + test:e2e 脚本，
    # 再恢复本步骤（见 ITER-4 决策项 D-2）。
    - name: Run frontend lint
      run: npm run lint

    # 此前 CI 从不执行前端单测，行为回归只有类型检查兜底（revert 修复也不会红）。
    # 2026-09-29：加 `--reporter=junit --outputFile.junit=test-results.xml`，
    # 让单测结果成为可下载的 CI 产物（原先下游 artifact 步骤上传的 Playwright
    # playwright-report/ 与 test-results/ 两个目录从来不存在 —— 见下方说明）。
    # 注意：这里**直接调 vitest 而不是 `npm run test --`** —— 实测 npm 会把
    # `--outputFile.junit=...` 当成它自己的 cli config 吞掉
    # （打印 "npm warn Unknown cli config \"--outputFile.junit\"" 且不产出报告），
    # 故必须绕开 npm 的参数解析。`test` 脚本本身就是 `vitest run`，二者等价。
    - name: Run frontend unit tests
      run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml

    - name: Run frontend build
      run: npm run build

    # 原为 `npm run test:e2e` —— 该脚本在 package.json 中不存在、也没有
    # playwright.config.* 与 e2e/ 目录，步骤必然失败。改为执行真实存在的跨端
    # 对齐检查；Playwright e2e 落地后恢复（见 ITER-4 决策项 D-2）。
    # P1-12：跨层对齐四件套。check:dto 此前只写在 package.json 里、CI 从不执行，
    # 移动端重复声明 DTO（绕过 @/types）就能一路绿灯；这里补上引用。
    - name: Run frontend cross-layer alignment checks
      run: |
        npm run check:api
        npm run check:api:pc
        npm run check:routes
        npm run check:dto
        npm run check:types

    # 上传上面单测步骤产出的 junit 报告（真实存在；`if: always()` 保证测试失败时也能取到）。
    # 原先上传的 frontend-vite/playwright-report/ 与 frontend-vite/test-results/ 两个路径
    # 永不存在：vitest.config.ts 未配置 junit reporter，且 CI 以 `vitest run` 不带 --coverage
    # 运行（`reporter` 只配在 coverage 段内），故 upload-artifact 的
    # if-no-files-found 默认 warn 会让它静默空转。
    - name: Upload frontend test artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: frontend-test-artifacts
        if-no-files-found: error
        path: frontend-vite/test-results.xml

  build:
    needs: [test, lint, frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Validate source tree
      run: |
        python -m pip install --upgrade pip
        python -m compileall fastapi_app utils tests fastapi_app/tests
  
