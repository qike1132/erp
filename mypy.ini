[mypy]
python_version = 3.13
warn_unused_configs = True
pretty = True
show_error_codes = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
files = fastapi_app/core/security.py,
    fastapi_app/core/config.py,
    fastapi_app/core/database.py,
    fastapi_app/core/cache.py,
    fastapi_app/core/deps.py,
    fastapi_app/core/health.py,
    fastapi_app/core/metrics.py,
    fastapi_app/core/middleware.py,
    fastapi_app/core/nav_context.py,
    fastapi_app/core/db_health.py,
    fastapi_app/core/slow_query.py,
    fastapi_app/core/telemetry.py,
    fastapi_app/core/purchase_cache.py,
    fastapi_app/core/float_utils.py,
    fastapi_app/shared/shipment_calc.py,
    fastapi_app/shared/stock_crud_service.py,
    fastapi_app/shared/report_data_service.py,
    fastapi_app/shared_models/base.py,
    fastapi_app/shared_models/order.py,
    fastapi_app/shared_models/order_item.py,
    fastapi_app/shared_models/notification.py
exclude = (?x)(^\.archive/|^tests/|^fastapi_app/tests/)
