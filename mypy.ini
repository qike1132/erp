[mypy]
python_version = 3.13
# Code targets Windows in production: prod_runner supervises the NSSM services via
# subprocess.CREATE_NO_WINDOW and ctypes.WINFUNCTYPE / ctypes.windll. Pin the
# typeshed platform so this gate behaves identically on the Linux CI runner and the
# Windows dev host -- otherwise mypy on Linux reports those Windows-only attributes
# as undefined (attr-defined) in prod_runner.py, a false positive.
platform = win32
warn_unused_configs = True
pretty = True
show_error_codes = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent

# ---------------------------------------------------------------------------
# Type-check coverage (progressive ratchet).
#
# Policy: only list files that are currently error-free, so the CI gate starts
# green. Once a file's legacy typing problems are fixed, add it to this list;
# NEVER drop an already-listed file just to make the gate pass.
#
# Status (measured 2026-09-14):
#   - core / shared / shared_models: 23 files (baseline 21 + response.py + web_vital.py)
#   - of the 156 files under services, 74 still carry typing errors (about 400
#     errors in total), so only the 82 error-free ones are listed; the rest are
#     added one by one after being fixed.
#
# P0-8 dead-code removal (2026-10-01) deleted 3 FILES (not whitelist entries --
# see the NEVER-remove rule above); the files list shrinks 110 -> 107:
#   - fastapi_app/shared_models/base.py (6 lines of re-exports, zero in-edges)
#   - fastapi_app/services/backup/_stream.py (14 lines of re-exports, zero in-edges)
#   - fastapi_app/services/batch_pipeline.py (128 lines; its only consumer was
#     tests/test_batch_pipeline.py, deleted at the same time)
# Re-check: .venv\Scripts\python.exe scripts\check_orphan_modules.py
#
# P1 follow-up (2026-10-01) deleted one more FILE and therefore shrank the files
# list 107 -> 106 (the entry is not dropped to make the gate pass; the module it
# pointed at no longer exists):
#   - fastapi_app/services/purchase_order_service.py (65 lines). Pure re-export
#     facade over purchase_center_service.py with zero in-edges from fastapi_app/
#     or tests/; its only importer was scripts/perf_benchmark.py, which now
#     benchmarks the production path (purchase_center_service.get_purchase_orders).
# Re-check: .venv\Scripts\python.exe scripts\check_orphan_modules.py
#
# Audit F1-5 / F4-5 follow-up (2026-10-20): the backup dead-code cleanup
# (commit bfd2e801, Z05-R18) deleted 4 more FILES, so their whitelist entries
# are removed -- they pointed at modules that no longer exist (dangling entries
# made the orphan gate fail with "[A] mypy.ini whitelist points at a missing
# module", which is a blocking CI step):
#   - fastapi_app/services/backup/chunks.py (parallel chunking implementation;
#     the live one is api/v1/endpoints/backup/export.py)
#   - fastapi_app/services/backup/format_storage.py
#   - fastapi_app/services/backup/format_strategy.py
#   - fastapi_app/services/backup/format_types.py
#     (the 708-line fourth backup-format implementation; never wired, only
#     exported by services/backup/__init__.py and referenced by tests)
# Re-check: .venv\Scripts\python.exe scripts\check_orphan_modules.py
#
# NOTE (P0-8): keep this file pure ASCII. Python's configparser reads it with the
# locale encoding (cp936/GBK on Chinese Windows), so any non-ASCII byte made
# `python -m mypy --config-file mypy.ini` abort with UnicodeDecodeError (exit 2)
# before any type checking ran. The Chinese comments that used to live here were
# translated to ASCII English for that reason; the wording is preserved.
#
# Real defects found through this gate (not pure type noise):
#   - ocr/_extractors.py: `global _pdf_extracter` was never declared at module
#     level, so the first call always raised NameError and OCR was entirely
#     unusable (the dependency was in fact installed). Reported as
#     `name-defined`; all 1297 tests were green because they only covered the
#     upload/progress APIs.
#   - batch_import_dedup.py: `Container[Hashable]` was not imported, and the
#     annotation was too wide (Container does not guarantee iterability while the
#     body needed `set(existing_keys)`). Adding the import exposed a masked
#     `arg-type`; both were narrowed to Iterable.
#
#   Re-check command:
#     python -m mypy fastapi_app/services/ --no-pretty   # remaining error spread
# ---------------------------------------------------------------------------
# P1-10(3) coverage expansion, first batch (2026-10-02): files 107 -> 145.
# Method: one probe run type-checked all 264 fastapi_app modules that were not
# yet listed (they are fed to mypy as extra command-line targets, which
# overrides files= for that run only) and reported 490 errors in 97 files,
# i.e. 168 candidates were error-free. The 38 modules below were then each
# re-checked on their own before being appended here:
#   python -m mypy --config-file mypy.ini <module>   -> exit 0,
#   "Success: no issues found in 1 source file"   (38/38, 0 failures)
# Because follow_imports = silent is in effect, a per-module run reports only
# that module's own errors. Add further modules only once they are error-free
# on their own, and never drop a listed file (see the NEVER-remove rule above).
#

# P2-A type-coverage integration (2026-10-02): ratchet expanded 144 -> 370.
# 2026-10-11: 13 modules found missing from the list (review verification
# round, REVIEW-VERIFICATION.md B3-mypy); 2 real type errors in
# services/shipment_plan_sync.py fixed in the same batch. Now 383 entries.
# Scope: every non-test .py under fastapi_app/ is now listed; fastapi_app/tests/
# stays out via the exclude pattern below (the list is a gate scope, not the CI
# test scope). The 370 entries are sorted lexicographically.
# Method: P2-A split the 226 previously unlisted modules into four shards
# (24 / 24 / 25 / 24 modules; 495 errors across 97 files) and each shard was
# fixed until its explicit paths reported "Success: no issues found"; the other
# 129 candidates were already error-free. The list measured 144 entries before
# this change (the P1-10(3) note above says 107 -> 145).
# Evidence: docs/p2-mypy-verification-2026-10-01.md (independent verification,
# round 2 pass) and docs/p2-mypy-integration-2026-10-01.md (this integration).
#
# Policy unchanged: the list shrinks only when a module is DELETED, never to make
# the gate pass; no per-module ignore_errors / disable_error_code sections and no
# new exemptions were added. This file must stay pure ASCII because configparser
# reads it with the locale encoding (cp936/GBK).
#
