[mypy]
python_version = 3.13
warn_unused_configs = True
pretty = True
show_error_codes = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent

# ---------------------------------------------------------------------------
# 类型检查覆盖范围（渐进式收紧 / ratchet）
#
# 策略：只纳入「当前已零错误」的文件，保证 CI 门禁一上来就是绿的。
# 修复某文件的历史类型问题后，把该文件加入本列表；禁止为了过门禁而
# 反向删除已纳入的文件。
#
# 现状（2026-09-14 实测）：
#   - core / shared / shared_models 共 23 个文件（原有基线 21 + response.py + web_vital.py）
#   - services 层 156 个文件中，74 个仍有类型错误（合计 400 个 error），
#     故仅纳入已零错误的 82 个文件，其余待逐个修复后再纳入。
#
# 已通过本门禁发现的**真实缺陷**（不是纯类型噪音）：
#   - ocr/_extractors.py：`global _pdf_extracter` 但模块级从未声明 →
#     首次调用必抛 NameError，OCR 功能整体不可用（依赖实际已安装）。
#     由 `name-defined` 报出；当时 1297 项测试全绿，因为测试只覆盖上传/进度 API。
#   - batch_import_dedup.py：`Container[Hashable]` 未 import，且该注解过宽
#     （Container 不保证可迭代，函数体要 `set(existing_keys)`）。
#     补 import 后暴露出被掩盖的 `arg-type`，已一并收窄为 Iterable。
#
#   复核命令：
#     python -m mypy fastapi_app/services/ --no-pretty   # 看剩余错误分布
# ---------------------------------------------------------------------------
