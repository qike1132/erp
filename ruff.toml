target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]
"migrations/**/*.py" = ["A003"]
# S608: stock_service.py 的库存聚合查询使用模块级常量片段 + 绑定参数（:sc/:pids），
# 不含用户输入；bandit.yaml 已全局跳过 B608，此处保持一致避免误报。
# 相关安全说明注释见 stock_service.py 中 _CUST_CLAUSE/_PID_CLAUSE 等常量定义处。
"fastapi_app/services/stock_service.py" = ["S608"]

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
