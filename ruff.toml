target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]
"migrations/**/*.py" = ["A003"]

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
