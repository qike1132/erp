# ==========================================
# 滨发协同系统 - Docker Compose 生产编排
# 版本: v1.0
# 服务清单: app, nginx, mysql, redis, taskiq-worker, ocr-service, prometheus, grafana, loki, pgbouncer
# ==========================================

version: '3.8'

services:
  # ------------------------------------------
  # 主应用服务 (FastAPI + Flask)
  # ------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: erp-system:v1.0
    container_name: erp-app
    restart: unless-stopped
    ports:
      - "5002:5002"  # FastAPI
      - "5003:5003"  # Flask
    environment:
      - ENV=production
      - DATABASE_URL=mysql+pymysql://erp_app:${MYSQL_PASSWORD}@mysql:3306/erp_system
      - ASYNC_DATABASE_URL=mysql+aiomysql://erp_app:${MYSQL_PASSWORD}@mysql:3306/erp_system
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ------------------------------------------
  # Nginx 反向代理
  # ------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ------------------------------------------
  # MySQL 数据库
  # ------------------------------------------
  mysql:
    image: mysql:8.4-lts
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=erp_system
      - MYSQL_USER=erp_app
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./backup/mysql:/backup
    ports:
      - "3306:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  # ------------------------------------------
  # Redis 缓存
  # ------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ------------------------------------------
  # Taskiq Worker
  # ------------------------------------------
  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: erp-system:v1.0
    container_name: erp-taskiq-worker
    restart: unless-stopped
    command: taskiq worker fastapi_app.tasks.broker:broker
    environment:
      - ENV=production
      - DATABASE_URL=mysql+pymysql://erp_app:${MYSQL_PASSWORD}@mysql:3306/erp_system
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - mysql
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ------------------------------------------
  # OCR 服务
  # ------------------------------------------
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    image: erp-ocr-service:v1.0
    container_name: erp-ocr
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
    environment:
      - MODEL_PATH=/app/models
      - LOG_LEVEL=INFO
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ------------------------------------------
  # PgBouncer 连接池
  # ------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:1.23.0
    container_name: erp-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer_users.txt:/etc/pgbouncer/users.txt:ro
    depends_on:
      - mysql
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ------------------------------------------
  # Prometheus 监控
  # ------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: erp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ------------------------------------------
  # Grafana 可视化
  # ------------------------------------------
  grafana:
    image: grafana/grafana:11.5.0
    container_name: erp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ------------------------------------------
  # Loki 日志聚合
  # ------------------------------------------
  loki:
    image: grafana/loki:3.4.0
    container_name: erp-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ------------------------------------------
# 网络定义
# ------------------------------------------
networks:
  backend:
    driver: bridge
    internal: false
  frontend:
    driver: bridge

# ------------------------------------------
# 数据卷定义
# ------------------------------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
