version: "3.9"

x-common-env: &common-env
  APP_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis:6379/2

services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
      SECRET_KEY: ${SECRET_KEY:?ERROR: SECRET_KEY must be set}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_TYPE: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 资源限制：应用服务
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - erp-net

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-celery-worker
    restart: unless-stopped
    command: celery -A fastapi_app.core.celery_app:celery_app worker -Q celery,batch,reports -c 4 --loglevel=info --without-heartbeat
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    # Celery Worker 健康检查
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.core.celery_app:celery_app inspect ping --timeout 10 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 资源限制：Celery Worker
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    networks:
      - erp-net

  # ==================== Celery Beat ====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-celery-beat
    restart: unless-stopped
    command: celery -A fastapi_app.core.celery_app:celery_app beat --loglevel=info
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp-net

  # ==================== Flower ====================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-flower
    restart: unless-stopped
    command: celery -A fastapi_app.core.celery_app:celery_app flower --port=5555 --persistent=True --max_tasks=10000 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?ERROR: FLOWER_PASSWORD must be set}
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp-net

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    # 仅绑定本地，不暴露到外网
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: erp_system
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}
    # PostgreSQL 性能参数调优
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制：PostgreSQL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - erp-net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # Redis healthcheck 使用环境变量引用密码，避免明文泄露
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制：Redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - erp-net

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./frontend-vite/dist:/app/frontend-vite/dist:ro
      - ./static:/app/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-net

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: erp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - erp-net

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: erp-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?ERROR: GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - erp-net

  # ==================== Loki ====================
  loki:
    image: grafana/loki:3.3.0
    container_name: erp-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - erp-net

  # ==================== Promtail ====================
  promtail:
    image: grafana/promtail:3.3.0
    container_name: erp-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/log:/host/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - erp-net

  # ==================== OTel Collector ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: erp-otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command: --config=/etc/otel-collector-config.yaml
    volumes:
      - ./config/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - erp-net

  # ==================== Celery Exporter ====================
  celery-exporter:
    image: danihodorn/celery-exporter:latest
    container_name: erp-celery-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9808:9808"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp-net

volumes:
  pgdata:
  redisdata:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:

networks:
  erp-net:
    driver: bridge
