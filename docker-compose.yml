x-common-env: &common-env
  APP_ENV: production
  # Redis 拆分为独立实例：缓存 / Celery Broker / Celery Results
  REDIS_HOST: redis-cache
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}
  REDIS_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-cache:6379/0
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-cache:6379/0
  REDIS_BROKER_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-broker:6379/0
  REDIS_RESULT_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-results:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-broker:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-results:6379/0
  # 对象存储配置（P2-1）
  STORAGE_TYPE: ${STORAGE_TYPE:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-erp-uploads}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp_app:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@pgbouncer:6432/erp_system
      ASYNC_DATABASE_REPLICA_URL: postgresql+asyncpg://erp_readonly:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres-replica:5432/erp_system
      SECRET_KEY: ${SECRET_KEY:?ERROR: SECRET_KEY must be set}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_TYPE: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-results:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 资源限制：应用服务
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - erp-net

  # ==================== Celery Worker (通用/CPU 密集型) ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-celery-worker
    restart: unless-stopped
    # 仅消费默认 celery 队列；I/O 密集型任务已路由到 io 队列由 gevent worker 处理
    command: celery -A fastapi_app.core.celery_app:celery_app worker -Q celery -c 4 --loglevel=info --without-heartbeat
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-results:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    # Celery Worker 健康检查
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.core.celery_app:celery_app inspect ping --timeout 10 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 资源限制：Celery Worker
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    networks:
      - erp-net

  # ==================== Celery Worker I/O (gevent 池) ====================
  celery-worker-io:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-celery-worker-io
    restart: unless-stopped
    # gevent pool：单进程内 50 个绿色线程，适合备份、报表导出、批量导入等 I/O 等待型任务
    # 使用 celery_worker_io 入口，先 monkey-patch 再加载 Celery 应用
    # 消费所有 io 子队列（io.reports / io.backup / io.batch / io.plan），业务间互不影响
    command: celery -A fastapi_app.celery_worker_io worker -Q io.reports,io.backup,io.batch,io.plan -P gevent -c 50 --loglevel=info --without-heartbeat
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-results:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.core.celery_app:celery_app inspect ping --timeout 10 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    networks:
      - erp-net

  # ==================== Celery Beat ====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-celery-beat
    restart: unless-stopped
    command: celery -A fastapi_app.core.celery_app:celery_app beat --loglevel=info
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/erp_system
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - erp-net

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    # 仅绑定本地，不暴露到外网
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: erp_system
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}
    # PostgreSQL 性能参数调优
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c effective_io_concurrency=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制：PostgreSQL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - erp-net

  # ==================== PgBouncer 连接池 ====================
  pgbouncer:
    image: pgbouncer/pgbouncer:1.23.1
    container_name: erp-pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DATABASE: erp_system
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      SERVER_CONNECT_TIMEOUT: 15
      SERVER_CHECK_QUERY: "select 1"
      SERVER_CHECK_DELAY: 30
      AUTH_TYPE: md5
      AUTH_FILE: /etc/pgbouncer/userlist.txt
      ADMIN_USERS: erp_admin
      STATS_USERS: erp_monitor
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-net

  # ==================== PostgreSQL 只读副本 ====================
  # 说明：需要在主库 postgres 服务中先配置流复制（wal_level=replica, max_wal_senders=5 等），
  # 并在主库创建复制用户和物理复制槽。此服务为只读副本提供独立访问入口。
  postgres-replica:
    image: postgres:16-alpine
    container_name: erp-postgres-replica
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: erp_system
      POSTGRES_USER: erp_readonly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}
      PGUSER: erp_readonly
    # 使用主库作为复制源；首次启动前需从主库执行 basebackup
    command: >
      postgres
      -c hot_standby=on
    volumes:
      - pgreplicadata:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_readonly -d erp_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-net

  # ==================== Redis 缓存实例 ====================
  redis-cache:
    image: redis:7.4.9-alpine
    container_name: erp-redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    # 启用 I/O 线程：写请求由主线程处理，读请求分发到 I/O 线程，提升多客户端并发
    # Redis 7+ 稳定特性；cache 实例读多写少，收益明显
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --io-threads 4
      --io-threads-do-reads yes
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-net

  # ==================== Redis Celery Broker 实例 ====================
  redis-broker:
    image: redis:7.4.9-alpine
    container_name: erp-redis-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-broker-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-net

  # ==================== Redis Celery Results 实例 ====================
  redis-results:
    image: redis:7.4.9-alpine
    container_name: erp-redis-results
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-results-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-net

  # ==================== Redis （兼容旧配置，建议逐步下线） ====================
  redis:
    image: redis:7.4.9-alpine
    container_name: erp-redis
    restart: unless-stopped
    profiles:
      - legacy
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # Redis healthcheck 使用环境变量引用密码，避免明文泄露
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制：Redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - erp-net
  # 生产环境高可用（HA）说明：
  # 当前为单节点 Redis，适用于开发/中小规模生产。
  # 如需 Redis 高可用（自动故障转移），请部署 Redis Sentinel 集群
  #（3 个 Sentinel 节点 + 1 主 + 1 从），并在应用环境变量中设置：
  #   REDIS_SENTINEL_HOSTS=sentinel1:26379,sentinel2:26379,sentinel3:26379
  # 应用将通过 Sentinel 发现 master，单机模式（REDIS_HOST）将被忽略。
  # Sentinel 容器编排示例见 docs/redis-sentinel.md（按需创建）。

  # ==================== Nginx ====================
  # 使用内置 ngx_brotli 模块的镜像，以支持 Brotli 压缩（gzip fallback）
  nginx:
    image: fholzer/nginx-brotli:v1.27.3
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./frontend-vite/dist:/app/frontend-vite/dist:ro
      - ./static:/app/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-net

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: erp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - erp-net

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: erp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?ERROR: GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - erp-net

  # ==================== Loki ====================
  loki:
    image: grafana/loki:3.3.0
    container_name: erp-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - erp-net

  # ==================== Promtail ====================
  promtail:
    image: grafana/promtail:3.3.0
    container_name: erp-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/app/logs:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/log:/host/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - erp-net

  # ==================== MinIO 对象存储 ====================
  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: erp-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?ERROR: MINIO_ROOT_PASSWORD must be set}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-net

  # ==================== OTel Collector ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: erp-otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command: --config=/etc/otel-collector-config.yaml
    volumes:
      - ./config/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - erp-net

  # ==================== Celery Exporter ====================
  celery-exporter:
    image: danihodorn/celery-exporter:latest
    container_name: erp-celery-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9808:9808"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set}@redis-broker:6379/0
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - erp-net

volumes:
  pgdata:
  pgreplicadata:
  redisdata:
  redis-cache-data:
  redis-broker-data:
  redis-results-data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:

networks:
  erp-net:
    driver: bridge
